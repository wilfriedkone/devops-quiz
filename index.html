"Un service DNS"],"why":"Un VPC (Virtual Private Cloud) est ton réseau privé dans AWS : tu choisis la plage d'IP, tu le découpes en subnets et tu contrôles les routes et pare-feux.","wx":["Le serveur virtuel, c'est EC2.","Le pare-feu applicatif, c'est WAF.","Le DNS, c'est Route 53."]},{"id":"aws-f2-8","q":"Différence entre un subnet public et un subnet privé ?","a":"Le public a un accès direct à internet, le privé non (BDD, apps sécurisées)","w":["Le privé a un accès internet, le public non","Le public est gratuit, le privé payant","Aucune différence"],"why":"Un subnet public a une route vers une Internet Gateway : on y met load balancers et bastions. Un subnet privé n'a pas d'accès direct depuis internet : on y protège les bases et les applis.","wx":["C'est l'inverse.","Les subnets ne sont pas facturés différemment.","C'est la route vers internet qui les distingue."]},{"id":"aws-f2-9","q":"À quoi sert une NAT Gateway ?","a":"Permettre aux instances d'un subnet privé de sortir sur internet sans être joignables","w":["Donner une IP publique fixe","Relier deux VPC","Bloquer les attaques web"],"why":"La NAT Gateway, placée dans un subnet public, permet aux instances privées de sortir (mises à jour, appels d'API), tout en empêchant toute connexion entrante depuis internet.","wx":["L'IP publique fixe, c'est l'Elastic IP.","Relier deux VPC, c'est le Peering ou Transit Gateway.","Bloquer les attaques web, c'est WAF."]},{"id":"aws-f2-10","q":"À quoi sert une Internet Gateway ?","a":"C'est la porte d'accès à internet du VPC","w":["Relier un subnet privé à internet","Répartir la charge","Gérer le DNS"],"why":"L'Internet Gateway, attachée au VPC, permet l'échange avec internet dans les deux sens pour les subnets publics.","wx":["Pour un subnet privé, il faut une NAT Gateway.","La répartition de charge, c'est ELB.","Le DNS, c'est Route 53."]},{"id":"aws-f2-11","q":"Quelle est la différence entre une NACL et un Security Group ?","a":"La NACL filtre au niveau du subnet, le Security Group au niveau de l'instance","w":["La NACL filtre l'instance, le Security Group le subnet","Les deux filtrent au niveau du VPC","Le Security Group filtre seulement HTTP"],"why":"La NACL protège tout un subnet (règles numérotées, stateless : il faut autoriser l'aller et le retour). Le Security Group protège une instance (stateful : le retour est autorisé automatiquement).","wx":["C'est l'inverse.","Les deux agissent à des niveaux différents.","Le Security Group filtre tous les ports et protocoles."]},{"id":"aws-f2-12","q":"Qu'est-ce qu'une Route Table ?","a":"Le « GPS » du réseau : elle dit où vont les paquets","w":["La liste des IP publiques","Le pare-feu du subnet","L'annuaire DNS"],"why":"La Route Table contient les règles de routage d'un subnet : pour telle destination (ex : 0.0.0.0/0), envoyer vers telle cible (Internet Gateway, NAT…).","wx":["Elle ne liste pas d'IP publiques.","Le pare-feu du subnet, c'est la NACL.","Le DNS, c'est Route 53."]},{"id":"aws-f2-13","q":"Quand préférer Transit Gateway au VPC Peering ?","a":"Quand tu as beaucoup de VPC à relier via un hub central","w":["Pour relier deux VPC seulement","Pour sortir sur internet","Pour bloquer les attaques web"],"why":"Le Peering relie les VPC deux à deux, ce qui devient ingérable à grande échelle. Transit Gateway est un hub central : chaque VPC s'y connecte une fois.","wx":["Pour deux VPC, un simple Peering suffit.","Sortir sur internet, c'est l'Internet Gateway ou la NAT.","Bloquer les attaques, c'est WAF."]},{"id":"aws-f2-14","q":"Qu'est-ce que Route 53 ?","a":"Le service DNS d'AWS (domaines, routage, health checks)","w":["Le CDN d'AWS","Un répartiteur de charge","Un service de routage entre VPC"],"why":"Route 53 est le DNS d'AWS : achat de domaines, traduction d'un nom en IP, routage avancé (latence, géolocalisation, bascule) et health checks.","wx":["Le CDN, c'est CloudFront.","Le répartiteur de charge, c'est ELB.","Le routage entre VPC, c'est Transit Gateway ou le Peering."]},{"id":"aws-f2-15","q":"Différence entre ALB et NLB ?","a":"ALB travaille en niveau 7 (HTTP/HTTPS), NLB en niveau 4 (TCP)","w":["ALB en niveau 4, NLB en niveau 7","ALB est pour les bases de données","NLB ne gère que HTTPS"],"why":"L'ALB comprend HTTP (niveau 7) : il route selon le chemin ou l'hôte (/api, /images). Le NLB travaille en TCP/UDP (niveau 4) : très rapide, pour de gros volumes.","wx":["C'est l'inverse.","Les deux répartissent du trafic réseau, pas des bases de données.","Le NLB gère du TCP/UDP brut ; HTTPS, c'est surtout l'ALB."]},{"id":"aws-f2-16","q":"Que fait CloudFront ?","a":"Copie tes fichiers statiques partout dans le monde pour un chargement rapide","w":["Il protège contre les attaques web","Il gère tes noms de domaine","Il stocke tes backups"],"why":"CloudFront est un CDN : il met en cache tes contenus dans des centaines d'Edge Locations proches des utilisateurs, ce qui réduit fortement le temps de chargement.","wx":["La protection contre les attaques web, c'est WAF (qui peut s'associer à CloudFront).","Les noms de domaine, c'est Route 53.","Les backups, c'est S3 ou AWS Backup."]}]},{"title":"Sécurité, déploiement et supervision","src":"fiche","qs":[{"id":"aws-f3-1","q":"Qu'est-ce qu'IAM ?","a":"Le service qui gère « qui peut faire quoi » (users, groups, roles, policies)","w":["Le service de chiffrement","Le pare-feu d'AWS","Le service de monitoring"],"why":"IAM (Identity and Access Management) contrôle qui (users, groups, roles) peut faire quoi (policies) sur quelles ressources AWS.","wx":["Le chiffrement, c'est KMS.","Les pare-feux, ce sont les Security Groups et WAF.","Le monitoring, c'est CloudWatch."]},{"id":"aws-f3-2","q":"Qu'est-ce qu'un rôle IAM ?","a":"Une identité temporaire pour un service (ex : une EC2 qui écrit sur S3)","w":["Un groupe d'utilisateurs","Un document de permissions","Un compte administrateur"],"why":"Un rôle IAM est une identité sans mot de passe qu'un service (EC2, Lambda) ou un utilisateur endosse temporairement. Exemple : une EC2 avec un rôle peut écrire dans S3 sans clés en dur.","wx":["Un groupe d'utilisateurs, c'est un IAM Group.","Le document de permissions, c'est une Policy ; on l'attache au rôle.","Un rôle n'est pas un compte, encore moins admin."]},{"id":"aws-f3-3","q":"Sous quel format est écrite une IAM Policy ?","a":"JSON (Allow / Deny)","w":["YAML","XML","HCL"],"why":"Une policy IAM est un document JSON avec des Statements : Effect (Allow ou Deny), Action, Resource.","wx":["Le YAML sert à CloudFormation (qui accepte aussi le JSON), pas aux policies.","Pas de XML.","Le HCL est le langage de Terraform ; Terraform génère quand même du JSON pour les policies."]},{"id":"aws-f3-4","q":"Quelle bonne pratique pour le compte root ?","a":"Ne jamais l'utiliser au quotidien et activer le MFA","w":["L'utiliser pour toutes les tâches d'administration","Partager ses identifiants avec l'équipe","Désactiver son mot de passe"],"why":"Le compte root a tous les pouvoirs : on le protège avec le MFA et on ne s'en sert que pour de rares tâches. Au quotidien, on utilise des users ou des rôles IAM.","wx":["C'est justement ce qu'il ne faut pas faire.","Ne jamais partager d'identifiants, surtout ceux du root.","On le sécurise ; on ne le désactive pas."]},{"id":"aws-f3-5","q":"À quoi sert KMS ?","a":"Gérer les clés de chiffrement (EBS, S3, RDS…)","w":["Stocker les mots de passe","Gérer les utilisateurs","Surveiller les accès"],"why":"KMS crée et gère des clés de chiffrement, utilisées par EBS, S3, RDS… pour chiffrer les données au repos.","wx":["Stocker des mots de passe, c'est Secrets Manager.","Gérer les utilisateurs, c'est IAM.","Surveiller les accès, c'est CloudTrail."]},{"id":"aws-f3-6","q":"À quoi sert Secrets Manager ?","a":"Stocker les secrets (mots de passe, clés API) et les faire tourner automatiquement","w":["Gérer les clés de chiffrement","Créer des utilisateurs","Chiffrer les disques"],"why":"Secrets Manager stocke les secrets de façon chiffrée et peut les changer automatiquement (rotation), par exemple le mot de passe d'une base RDS.","wx":["Les clés de chiffrement, c'est KMS (que Secrets Manager utilise en interne).","Créer des utilisateurs, c'est IAM.","Chiffrer les disques, c'est EBS avec KMS."]},{"id":"aws-f3-7","q":"Qu'est-ce que CloudFormation ?","a":"L'Infrastructure as Code d'AWS, en YAML ou JSON","w":["Le service de monitoring","Un outil de build","Le CDN d'AWS"],"why":"CloudFormation est l'outil d'Infrastructure as Code d'AWS : tu décris tes ressources dans un template YAML ou JSON, et AWS crée la stack. C'est l'équivalent maison de Terraform.","wx":["Le monitoring, c'est CloudWatch.","Le build, c'est CodeBuild.","Le CDN, c'est CloudFront."]},{"id":"aws-f3-8","q":"Différence entre CodePipeline et CodeBuild ?","a":"CodePipeline orchestre les étapes, CodeBuild compile le code","w":["CodeBuild orchestre, CodePipeline compile","CodePipeline déploie seulement sur EC2","Aucune différence"],"why":"CodePipeline enchaîne les étapes de la CI/CD (Source → Build → Test → Deploy). CodeBuild est le service qui compile et teste le code, souvent appelé par CodePipeline.","wx":["C'est l'inverse.","CodePipeline peut déployer sur ECS, Lambda, S3, Beanstalk…","Ils sont complémentaires, pas identiques."]},{"id":"aws-f3-9","q":"Que permettent les CloudWatch Alarms ?","a":"Déclencher une action quand un seuil est dépassé (ex : CPU > 80 %)","w":["Stocker les logs","Tracer les requêtes entre microservices","Enregistrer qui a fait quoi"],"why":"Une alarme surveille une métrique et réagit quand un seuil est franchi : envoi d'une notification SNS, ajout d'instances (Auto Scaling), etc.","wx":["Stocker les logs, c'est CloudWatch Logs.","Tracer les requêtes, c'est X-Ray.","« Qui a fait quoi », c'est CloudTrail."]},{"id":"aws-f3-10","q":"Que fait CloudTrail ?","a":"Il enregistre qui a fait quoi sur le compte AWS","w":["Il surveille le CPU et la RAM","Il optimise les coûts","Il trace les requêtes applicatives"],"why":"CloudTrail enregistre chaque appel à l'API AWS : qui, quoi, quand, d'où. C'est indispensable pour l'audit et les enquêtes de sécurité.","wx":["Le CPU et la RAM, c'est CloudWatch.","Les coûts, c'est Cost Explorer ou Trusted Advisor.","Les requêtes applicatives, c'est X-Ray."]},{"id":"aws-f3-11","q":"À quoi sert X-Ray ?","a":"Suivre une requête à travers tous les microservices pour déboguer","w":["Scanner les vulnérabilités","Surveiller les coûts","Chiffrer les données"],"why":"X-Ray suit le parcours d'une requête à travers tes microservices et montre le temps passé à chaque étape. Il aide à trouver un ralentissement ou une erreur.","wx":["Scanner les vulnérabilités, c'est Inspector.","Les coûts, c'est Cost Explorer.","Le chiffrement, c'est KMS."]},{"id":"aws-f3-12","q":"Qu'est-ce que Trusted Advisor ?","a":"Un « médecin » qui conseille sur les coûts, la sécurité et les performances","w":["Un service de support payant","Un outil de déploiement","Un pare-feu"],"why":"Trusted Advisor analyse ton compte et donne des recommandations : économies, sécurité (ports ouverts, MFA), performances, limites de service.","wx":["Le support payant est AWS Support ; Trusted Advisor est un outil d'analyse (complet avec certains plans de support).","Il ne déploie rien.","Ce n'est pas un pare-feu."]},{"id":"aws-f3-13","q":"Différence entre SNS et SQS ?","a":"SNS diffuse un message à plusieurs abonnés, SQS met les messages en file d'attente","w":["SQS diffuse, SNS met en file d'attente","SNS est pour les e-mails seulement","Aucune différence"],"why":"SNS fait du pub/sub : un message publié part à tous les abonnés (e-mail, SMS, Lambda, SQS). SQS est une file d'attente : les messages sont stockés jusqu'à ce qu'un consommateur les traite.","wx":["C'est l'inverse.","SNS envoie aussi vers des SMS, Lambda, SQS, HTTP…","Ils répondent à deux besoins différents : diffuser ou mettre en file."]},{"id":"aws-f3-14","q":"Scalabilité verticale ou horizontale : ajouter des machines, c'est…","a":"Horizontale (scale out)","w":["Verticale (scale up)","Élasticité","Redondance"],"x":"Verticale = rendre une machine plus puissante.","why":"Scalabilité horizontale (scale out) : on ajoute des machines qui se partagent le travail. C'est ce que fait Auto Scaling.","wx":["La verticale (scale up) rend une machine plus puissante (plus de CPU ou de RAM).","L'élasticité, c'est ajuster automatiquement les ressources ; ce n'est pas le nom de l'action.","La redondance double les composants contre les pannes ; ce n'est pas pour absorber la charge."]},{"id":"aws-f3-15","q":"Qu'est-ce qu'une application stateless ?","a":"Elle ne garde pas en mémoire l'utilisateur entre deux requêtes","w":["Elle se souvient du contexte utilisateur","Elle n'a pas de base de données","Elle ne tourne que sur une seule machine"],"why":"Stateless : chaque requête est traitée sans mémoire des précédentes ; l'état est stocké ailleurs (base, cache). N'importe quelle instance peut donc répondre, ce qui facilite le scaling.","wx":["Ça, c'est stateful.","Une appli stateless peut avoir une base ; elle ne garde simplement pas d'état en mémoire.","Au contraire, elle peut tourner sur plusieurs machines."]},{"id":"aws-f3-16","q":"Qu'est-ce que l'élasticité ?","a":"La capacité à s'adapter automatiquement à la charge","w":["Le fait de doubler les composants critiques","La capacité à rester en ligne en cas de panne","Le fait d'ajouter de la RAM"],"why":"L'élasticité, c'est ajouter ou retirer des ressources automatiquement selon la demande : on paie seulement ce qu'on utilise.","wx":["Doubler les composants, c'est la redondance.","Rester en ligne malgré les pannes, c'est la haute disponibilité.","Ajouter de la RAM, c'est de la scalabilité verticale."]}]},{"title":"Quiz de formation 1/2","src":"quiz","qs":[{"id":"aws-01","q":"Quel service AWS fournit l'historique des modifications de vos applications ?","a":"AWS Quantum Ledger Database","w":["AWS DocumentDB","AWS Neptune","AWS ElastiCache"],"x":"QLDB est un registre immuable (journal des modifications). AWS a annoncé son arrêt pour 2025 ; pour l'historique de configuration on pense aussi à AWS Config et CloudTrail.","why":"QLDB (Quantum Ledger Database) est un registre immuable dont l'historique peut être vérifié cryptographiquement : chaque modification est conservée. AWS a annoncé son arrêt.","wx":["DocumentDB est une base de documents compatible MongoDB.","Neptune est une base de graphes.","ElastiCache est un cache en mémoire."]},{"id":"aws-02","q":"AWS EC2 ?","a":"Un serveur virtuel dans le cloud AWS","w":["Un centre de données","Un service de monitoring des ressources","Un service de calcul sans serveur"],"why":"EC2 fournit des serveurs virtuels à la demande dans le cloud AWS.","wx":["Un centre de données est un bâtiment physique ; EC2 est un service.","Le monitoring, c'est CloudWatch.","Le calcul sans serveur, c'est Lambda."]},{"id":"aws-03","q":"Quel service AWS est utilisé pour mettre en cache des données afin d'améliorer les performances des applications ?","a":"Amazon ElastiCache","w":["AWS Snowball","AWS Glue","Amazon CloudFront"],"why":"ElastiCache fournit Redis ou Memcached gérés : les données lues souvent restent en mémoire, ce qui accélère l'appli et soulage la base.","wx":["Snowball est un appareil physique pour transférer de gros volumes de données.","Glue est un ETL.","CloudFront met en cache des contenus web près des utilisateurs (CDN), pas les données de ton application."]},{"id":"aws-04","q":"Quel service envoie et reçoit des messages entre les composants d'une application ?","a":"AWS SQS","w":["AWS CloudTrail","AWS Snowmobile","AWS Lambda"],"why":"SQS (Simple Queue Service) est une file de messages : un composant dépose un message, un autre le récupère et le traite. Les composants sont ainsi découplés.","wx":["CloudTrail fait de l'audit.","Snowmobile est un camion de transfert de données.","Lambda exécute du code ; elle peut lire SQS, mais ce n'est pas un service de messagerie."]},{"id":"aws-05","q":"Quel est l'objectif du service AWS Organizations ?","a":"Gestion centralisée de plusieurs comptes AWS","w":["Surveillance des performances réseau","Suivi des coûts AWS","Hébergement d’applications cloud"],"why":"Organizations regroupe plusieurs comptes AWS : facturation centralisée, politiques de sécurité communes (SCP), création de comptes.","wx":["La surveillance réseau, c'est CloudWatch ou VPC Flow Logs.","Organizations aide la facturation, mais le suivi des coûts, c'est Cost Explorer.","L'hébergement, ce sont EC2, Beanstalk…"]},{"id":"aws-06","q":"Quel outil permet de visualiser et gérer vos coûts AWS ?","a":"AWS Cost Explorer","w":["AWS CloudWatch","AWS Price Calculator","AWS Budgets"],"why":"Cost Explorer affiche graphiques et détails de tes dépenses passées, filtrables par service, et fait des prévisions.","wx":["CloudWatch surveille les ressources, pas les coûts.","Price Calculator estime un coût avant de déployer.","Budgets alerte quand un seuil est dépassé, mais ne sert pas à explorer les dépenses."]},{"id":"aws-07","q":"Quel service AWS permet d’analyser en continu les journaux pour détecter des menaces de sécurité ?","a":"Amazon GuardDuty","w":["AWS Glue","AWS CloudFormation"],"why":"GuardDuty analyse en continu CloudTrail, les VPC Flow Logs et le DNS pour détecter des menaces : comportement suspect, minage de crypto, accès anormaux.","wx":["Glue est un ETL.","CloudFormation fait de l'Infrastructure as Code."]},{"id":"aws-08","q":"Comment AWS garantit-il la haute disponibilité des applications ?","a":"En utilisant plusieurs zones de disponibilité (AZ)","w":["En déployant des charges de travail sur plusieurs régions","En stockant toutes les données sur une seule instance EC2","En désactivant l'Auto Scaling"],"why":"On répartit l'application sur plusieurs zones de disponibilité (des data centers séparés dans une même région) : si une AZ tombe, les autres prennent le relais.","wx":["Le multi-région existe, mais la base de la haute disponibilité selon ton corrigé, ce sont les AZ.","Une seule instance est un point de panne unique.","Désactiver l'Auto Scaling réduit la résilience."]},{"id":"aws-09","q":"Quel service de stockage AWS est conçu pour transférer des pétaoctets de données vers et depuis le cloud ?","a":"AWS Snowmobile","w":["Amazon S3","Amazon Redshift","AWS DataSync"],"why":"Snowmobile était un camion avec un conteneur de stockage (jusqu'à 100 Po) pour déplacer d'énormes volumes vers AWS.","wx":["S3 stocke, mais l'envoi de pétaoctets par internet prendrait trop de temps.","Redshift est un entrepôt de données.","DataSync transfère par le réseau ; il est adapté à des volumes plus modestes."]},{"id":"aws-10","q":"Quel type de scaling AWS Auto Scaling permet-il ?","a":"Scaling horizontal (ajout/retrait d'instances)","w":["Scaling inversé (réduction de la capacité de stockage sur S3)","Scaling vertical (augmentation des ressources d'une instance)","Scaling fixe (fixation du nombre d’instances sans ajustement)"],"why":"Auto Scaling ajoute ou retire des instances selon la charge : c'est de la scalabilité horizontale.","wx":["Le « scaling inversé » sur S3 n'existe pas.","Auto Scaling ne grossit pas une instance ; changer de type, c'est vertical et manuel.","Un nombre fixe, c'est l'inverse du scaling."]},{"id":"aws-11","q":"AWS Elastic Block Store Snapshot est un type de sauvegarde :","a":"Incrémentale","w":["Automatique","Différentielle","Complète"],"why":"Un snapshot EBS est incrémental : le premier copie tout, les suivants seulement les blocs modifiés depuis le précédent. C'est moins de stockage et moins de coût.","wx":["On peut les automatiser (Data Lifecycle Manager), mais ce n'est pas leur type.","Une sauvegarde différentielle repart toujours de la dernière complète.","Seul le premier snapshot est complet."]},{"id":"aws-12","q":"Quel est le rôle de VPC Peering ?","a":"Il permet aux VPCs de communiquer directement entre eux via des IP privées","w":["Il est automatiquement configuré entre les VPCs d'un même compte","Il remplace AWS Direct Connect"],"why":"Le VPC Peering relie deux VPC (même compte ou non, même région ou non) : leurs instances communiquent par IP privées, sans passer par internet.","wx":["Il faut le créer et l'accepter, puis ajouter les routes.","Direct Connect relie ton data center à AWS ; c'est un autre besoin."]}]},{"title":"Quiz de formation 2/2","src":"quiz","qs":[{"id":"aws-13","q":"Le pare-feu AWS Web Application Firewall peut bloquer le trafic réseau en fonction des requêtes d'une application.","a":"vrai","w":["faux"],"o":["faux","vrai"],"why":"Vrai : WAF filtre le trafic HTTP(S) au niveau applicatif, selon le contenu des requêtes (injections SQL, XSS, IP, en-têtes…).","wx":["Faux : c'est justement son rôle."]},{"id":"aws-14","q":"Quel est l'avantage principal d'AWS Transit Gateway par rapport à VPC Peering ?","a":"Il permet de centraliser la gestion des connexions entre plusieurs VPCs","w":["Il remplace les tables de routage des VPCs","Il est moins coûteux que VPC Peering pour interconnecter quelques VPCs","Il supporte les connexions VPN et Direct Connect en plus du VPC Peering"],"why":"Transit Gateway est un hub : chaque VPC s'y connecte une seule fois, au lieu d'un Peering entre chaque paire. La gestion devient centralisée.","wx":["Les tables de routage restent nécessaires.","Pour quelques VPC, le Peering est souvent moins cher.","Il accepte bien VPN et Direct Connect, mais l'avantage principal attendu est la centralisation."]},{"id":"aws-15","q":"Les régions AWS font partie de l'infrastructure globale d'AWS.","a":"vrai","w":["faux"],"o":["vrai","faux"],"why":"Vrai : l'infrastructure mondiale d'AWS se compose de régions (ex : eu-west-3 Paris), qui contiennent des zones de disponibilité, plus les Edge Locations.","wx":["Faux : les régions sont la brique de base de l'infrastructure mondiale."]},{"id":"aws-16","q":"Quel service AWS réduit la latence réseau ?","a":"AWS CloudFront","w":["Lambda","EC2","DynamoDB"],"why":"CloudFront sert les contenus depuis l'Edge Location la plus proche de l'utilisateur, ce qui réduit la latence.","wx":["Lambda exécute du code (Lambda@Edge existe, mais via CloudFront).","EC2 fournit des serveurs, mais ne réduit pas la latence par lui-même.","DynamoDB est rapide, mais c'est une base de données, pas un service réseau."]},{"id":"aws-17","q":"Quel type de base de données est AWS DynamoDB ?","a":"nosql","w":["clé-valeur","graphique","relationnelle"],"x":"DynamoDB est une base NoSQL de type clé-valeur : les deux idées sont vraies, le corrigé attendait « nosql ».","why":"DynamoDB est une base NoSQL : c'est la réponse attendue par ton corrigé.","wx":["Elle est bien de type clé-valeur (et document), mais le corrigé attendait la famille : NoSQL.","La base de graphes d'AWS, c'est Neptune.","Le relationnel, c'est RDS ou Aurora."]},{"id":"aws-18","q":"Qu'est-ce qu'une IAM Policy ?","a":"Une politique de sécurité définissant les permissions des utilisateurs et services AWS","w":["Une base de données AWS","Un outil de gestion des coûts","Un service de monitoring"],"why":"Une IAM Policy est un document JSON qui autorise ou interdit des actions sur des ressources ; on l'attache à un user, un groupe ou un rôle.","wx":["Ce n'est pas une base de données.","Les coûts, c'est Cost Explorer ou Budgets.","Le monitoring, c'est CloudWatch."]},{"id":"aws-19","q":"Quel service AWS gère le chiffrement et le déchiffrement des données ?","a":"AWS KMS","w":["AWS Inspector","AWS GuardDuty","AWS WAF"],"why":"KMS (Key Management Service) crée les clés et chiffre ou déchiffre les données pour S3, EBS, RDS…","wx":["Inspector scanne les vulnérabilités.","GuardDuty détecte les menaces.","WAF filtre le trafic web."]},{"id":"aws-20","q":"Qu'est-ce qu'AWS EFS ?","a":"Elastic File System","w":["Efficient File System","Enterprise File System","External File Storage"],"why":"EFS veut dire Elastic File System : un système de fichiers NFS partagé et élastique.","wx":["Le E veut dire Elastic, comme pour EC2 et EBS.","Ce n'est pas Enterprise.","S veut dire System, pas Storage, et E n'est pas External."]},{"id":"aws-21","q":"Que sont les Edge Locations ?","a":"Des centres de données qui délivrent rapidement des données aux utilisateurs","w":["Des centres de données stockant des pétaoctets de données","Des régions AWS","Des disques durs physiques"],"why":"Les Edge Locations sont de petits sites répartis dans le monde où CloudFront garde du contenu en cache, pour le livrer au plus près des utilisateurs.","wx":["Le stockage massif se fait dans les régions (S3), pas dans les Edge Locations.","Une région est plus grande et contient plusieurs AZ.","Ce sont des sites réseau, pas des disques."]},{"id":"aws-22","q":"Quel service permet d'exécuter du code sans se soucier des serveurs ?","a":"AWS Lambda","w":["AWS Serverless","Amazon ECS","EC2 Auto Scaling"],"why":"Lambda exécute ton code à la demande : AWS gère serveurs, montée en charge et disponibilité.","wx":["« AWS Serverless » n'est pas le nom d'un service.","ECS orchestre des conteneurs (même avec Fargate, ce n'est pas l'exemple attendu).","EC2 Auto Scaling gère des serveurs."]},{"id":"aws-23","q":"Quelle classe de stockage Amazon S3 est la moins coûteuse ?","a":"S3 Glacier Deep Archive","w":["S3 Standard","S3 Intelligent-Tiering","S3 One Zone-IA"],"why":"Glacier Deep Archive est la classe la moins chère de S3, pour des données rarement lues ; la récupération peut prendre jusqu'à 12 heures.","wx":["Standard est la classe la plus chère.","Intelligent-Tiering déplace automatiquement les données ; elle n'est pas la moins chère.","One Zone-IA est moins chère que Standard, mais bien plus que Deep Archive."]},{"id":"aws-24","q":"Quelle base de données est idéale pour les applications à fort trafic et haute disponibilité ?","a":"AWS Aurora","w":["Amazon RDS","SQLite","DynamoDB"],"why":"Aurora est la base relationnelle d'AWS compatible MySQL et PostgreSQL : jusqu'à 5 fois plus rapide que MySQL, données copiées 6 fois sur 3 AZ, bascule automatique. Elle est taillée pour le fort trafic.","wx":["RDS est le service qui gère aussi Aurora ; le quiz attendait Aurora.","SQLite est une base locale dans un fichier, inadaptée au fort trafic.","DynamoDB monte aussi très bien en charge, mais elle est NoSQL ; le corrigé attendait Aurora."]}]}]},{"id":"cicd","name":"CI/CD","sub":"Jenkins et GitLab CI","steps":[{"title":"Jenkins : les bases","src":"fiche","qs":[{"id":"cicd-f1-1","q":"Que veut dire CI dans CI/CD ?","a":"Continuous Integration : compiler et tester à chaque commit","w":["Continuous Infrastructure","Code Inspection","Container Integration"],"why":"CI = Continuous Integration : à chaque commit, le code est automatiquement compilé et testé. Les erreurs sont détectées tout de suite.","wx":["L'infrastructure relève de l'IaC, pas de la CI.","L'inspection de code est un outil possible, pas le sens de CI.","Aucun lien direct avec les conteneurs."]},{"id":"cicd-f1-2","q":"Que veut dire CD dans CI/CD ?","a":"Continuous Deployment : livrer automatiquement si les tests passent","w":["Code Delivery manuel","Container Docker","Continuous Debugging"],"why":"CD = Continuous Deployment (ou Delivery) : si les tests passent, l'application est livrée ou déployée automatiquement.","wx":["Tout l'intérêt est l'automatisation : rien de manuel.","CD n'a rien à voir avec Docker.","CD ne veut pas dire Debugging."]},{"id":"cicd-f1-3","q":"Quel est le rôle du Master Node Jenkins ?","a":"Gérer l'interface web, les configs et les jobs","w":["Exécuter les builds lourds","Stocker le code source","Héberger l'application déployée"],"why":"Le master (controller) Jenkins sert l'interface web, stocke la configuration et les jobs, et distribue le travail aux agents.","wx":["Les builds lourds vont aux agents.","Le code reste dans Git.","L'appli est déployée sur des serveurs cibles."]},{"id":"cicd-f1-4","q":"Pourquoi utiliser des agents (slaves) Jenkins ?","a":"Exécuter les builds lourds sans surcharger le master","w":["Gérer l'interface web","Stocker les secrets","Remplacer les plugins"],"why":"Les agents exécutent les builds et les tests à la place du master : il reste réactif. Ils permettent aussi de builder sur plusieurs OS.","wx":["L'interface web est servie par le master.","Les secrets sont stockés dans les Credentials du master.","Les plugins s'installent sur le master."]},{"id":"cicd-f1-5","q":"Qu'est-ce que le workspace Jenkins ?","a":"L'espace disque de l'agent où Jenkins récupère le code et travaille","w":["La page d'accueil de Jenkins","La liste des jobs","Le dossier des plugins"],"why":"Le workspace est le dossier de travail d'un job sur l'agent : Jenkins y clone le code et y lance build et tests.","wx":["La page d'accueil est le tableau de bord.","La liste des jobs est sur le tableau de bord.","Les plugins sont dans /var/lib/jenkins/plugins."]},{"id":"cicd-f1-6","q":"Qu'est-ce qu'un build ?","a":"Une exécution d'un job","w":["Un plugin de compilation","Un agent Jenkins","Un fichier Jenkinsfile"],"why":"Un build est une exécution d'un job : build n°42, avec sa console, son résultat (succès ou échec) et ses artefacts.","wx":["Ce n'est pas un plugin.","L'agent est la machine qui exécute le build.","Le Jenkinsfile décrit le pipeline ; le build est son exécution."]},{"id":"cicd-f1-7","q":"Sur quel port Jenkins répond-il par défaut ?","a":"8080","w":["80","443","9000"],"why":"Jenkins écoute par défaut sur le port 8080 : http://ip:8080.","wx":["80 est le port HTTP standard ; il faudrait un proxy devant.","443 est le port HTTPS.","9000 est le port par défaut de SonarQube, pas de Jenkins."]},{"id":"cicd-f1-8","q":"Où trouver le mot de passe admin initial de Jenkins ?","a":"/var/lib/jenkins/secrets/initialAdminPassword","w":["/etc/jenkins/password","/home/jenkins/.admin","Dans l'e-mail d'installation"],"why":"À la première installation, Jenkins est verrouillé : on lit le mot de passe avec `sudo cat /var/lib/jenkins/secrets/initialAdminPassword`.","wx":["Ce fichier n'existe pas.","Ce fichier n'existe pas.","Jenkins n'envoie pas d'e-mail."]},{"id":"cicd-f1-9","q":"Pourquoi le Pipeline est-il préféré au Freestyle ?","a":"Le Jenkinsfile est versionné avec le code source","w":["Il ne demande aucun plugin","Il se configure avec des cases à cocher","Il est plus rapide à exécuter"],"why":"Avec Pipeline, tout le processus est décrit dans un Jenkinsfile stocké dans Git, à côté du code : il est versionné, relu et reproductible.","wx":["Pipeline est lui-même un plugin.","Ça, c'est le Freestyle.","La vitesse ne change pas ; c'est la maintenabilité qui gagne."]}]},{"title":"Jenkinsfile et triggers","src":"fiche","qs":[{"id":"cicd-f2-1","q":"Dans un Jenkinsfile déclaratif, que contient le bloc stages ?","a":"Les étapes du pipeline (Checkout, Build, Test, Deploy…)","w":["Les variables d'environnement","Les actions après le pipeline","La liste des agents"],"why":"`stages` contient les stage('Checkout'), stage('Build')… : chaque étape a ses `steps`.","wx":["Les variables vont dans `environment`.","Les actions après le pipeline vont dans `post`.","L'agent se choisit avec `agent`."]},{"id":"cicd-f2-2","q":"À quoi sert le bloc post ?","a":"Définir les actions après le pipeline (success, failure, always)","w":["Publier le code sur Git","Déclarer les variables","Choisir l'agent"],"why":"`post` s'exécute à la fin : `success` (envoyer un message), `failure` (alerter), `always` (nettoyer avec cleanWs).","wx":["Publier sur Git n'est pas le rôle de post.","Les variables vont dans `environment`.","L'agent se choisit avec `agent`."]},{"id":"cicd-f2-3","q":"Que fait `cleanWs()` ?","a":"Nettoie le workspace (fichiers de l'ancien build)","w":["Supprime le job","Vide le cache des plugins","Redémarre l'agent"],"why":"`cleanWs()` vide le workspace du job, pour qu'il ne reste rien du build précédent et que le disque ne se remplisse pas.","wx":["Le job n'est pas supprimé.","Les plugins ne sont pas touchés.","L'agent n'est pas redémarré."]},{"id":"cicd-f2-4","q":"Quelle différence entre `sh` et `bat` ?","a":"sh exécute du Shell (Linux/Mac), bat du Batch (Windows)","w":["bat exécute du Shell, sh du Batch","sh est pour les tests, bat pour le build","Aucune différence"],"why":"`sh` lance une commande shell (Linux, macOS) ; `bat` lance une commande Batch sur un agent Windows.","wx":["C'est l'inverse.","Les deux exécutent n'importe quelle commande.","Ils visent des systèmes différents."]},{"id":"cicd-f2-5","q":"Que fait `archiveArtifacts artifacts: '**/*.jar'` ?","a":"Sauvegarde les fichiers construits sur le master Jenkins","w":["Supprime les anciens .jar","Compresse le workspace","Envoie les .jar sur Git"],"why":"`archiveArtifacts` conserve sur le master les fichiers produits (ici tous les .jar) : on peut les télécharger depuis la page du build.","wx":["Il conserve les fichiers, il ne supprime rien.","Il ne compresse pas le workspace.","Il n'envoie rien sur Git."]},{"id":"cicd-f2-6","q":"Que fait `checkout scm` ?","a":"Récupère le code du dépôt qui a déclenché le build","w":["Crée une nouvelle branche","Pousse le code sur le dépôt","Vérifie la syntaxe du Jenkinsfile"],"why":"`checkout scm` récupère le code du dépôt et du commit qui ont déclenché le build, d'après la configuration du job.","wx":["Il ne crée pas de branche.","Il récupère, il ne pousse pas.","Il ne vérifie pas la syntaxe."]},{"id":"cicd-f2-7","q":"Que signifie `agent { label 'linux' }` ?","a":"Le pipeline s'exécute seulement sur un agent ayant le label linux","w":["Le pipeline installe Linux sur l'agent","Le pipeline s'exécute sur n'importe quel agent","Le pipeline crée un agent nommé linux"],"why":"Le pipeline tourne seulement sur un agent portant le label « linux ». Les labels permettent de cibler un type de machine.","wx":["Il n'installe rien.","Ça, c'est `agent any`.","Il ne crée rien ; il choisit parmi les agents existants."]},{"id":"cicd-f2-8","q":"Quel est l'inconvénient du Poll SCM ?","a":"Pas instantané et consomme des ressources inutilement","w":["Il nécessite un webhook","Il ne marche qu'avec GitLab","Il ne détecte pas les push"],"why":"Avec Poll SCM, Jenkins interroge Git régulièrement : le build démarre avec un retard, et des requêtes partent même quand rien n'a changé.","wx":["Le Poll SCM fonctionne sans webhook ; c'est son seul avantage.","Il marche avec tout dépôt Git.","Il détecte bien les push, mais avec du retard."]},{"id":"cicd-f2-9","q":"Comment fonctionne un webhook ?","a":"Git prévient Jenkins dès qu'il y a un push ou une Pull Request","w":["Jenkins interroge Git toutes les 5 minutes","Le développeur lance le job à la main","Jenkins clone le dépôt chaque nuit"],"why":"Avec un webhook, GitHub ou GitLab appelle l'URL de Jenkins dès qu'un push ou une PR arrive : le build démarre immédiatement.","wx":["Ça, c'est le Poll SCM.","Ça, c'est un lancement manuel.","Ça, c'est une planification nocturne."]},{"id":"cicd-f2-10","q":"Que veut dire `H/5 * * * *` dans Poll SCM ?","a":"Vérifier toutes les 5 minutes","w":["Vérifier 5 fois par heure exactement à H","Vérifier chaque jour à 5 h","Vérifier toutes les 5 heures"],"why":"Syntaxe cron : `H/5` dans le champ des minutes veut dire toutes les 5 minutes. Le H répartit la minute de départ entre les jobs pour éviter qu'ils tournent tous en même temps.","wx":["H n'est pas une heure fixe : il sert à répartir la charge.","Le premier champ est celui des minutes, pas des heures.","Le premier champ concerne les minutes."]}]},{"title":"Jenkins : sécurité et bonnes pratiques","src":"fiche","qs":[{"id":"cicd-f3-1","q":"Comment utiliser un mot de passe dans un Jenkinsfile ?","a":"Avec credentials('ID') bindé à une variable d'environnement","w":["En l'écrivant directement dans le Jenkinsfile","Dans un commentaire du Jenkinsfile","Dans le nom de la branche"],"why":"Le secret est stocké dans Jenkins (Credentials) et injecté avec `credentials('ID')` dans une variable d'environnement. Jenkins masque même sa valeur dans les logs.","wx":["Le Jenkinsfile est dans Git : le secret serait exposé.","Un commentaire est tout aussi visible.","Le nom de la branche est public."]},{"id":"cicd-f3-2","q":"Où ajoute-t-on un secret dans Jenkins ?","a":"Manage Jenkins > Manage Credentials","w":["Dans le Jenkinsfile","Dans le workspace","Dans Blue Ocean"],"why":"Manage Jenkins > Credentials : on y ajoute un Secret text, un Username with password, une clé SSH…, avec un ID qu'on référence dans le pipeline.","wx":["Le Jenkinsfile référence l'ID ; il ne contient jamais le secret.","Le workspace est temporaire et lisible.","Blue Ocean est une interface de visualisation."]},{"id":"cicd-f3-3","q":"Que fait `agent { docker { image 'node:14' } }` ?","a":"Chaque étape tourne dans un conteneur Node.js","w":["Construit une image node:14","Installe Node.js sur le master","Déploie l'image sur Docker Hub"],"why":"Chaque stage s'exécute dans un conteneur créé à partir de l'image node:14 : Node est disponible sans l'installer sur l'agent.","wx":["L'image est téléchargée, pas construite.","Rien n'est installé sur le master.","Rien n'est poussé sur Docker Hub."]},{"id":"cicd-f3-4","q":"Que permet le plugin Kubernetes de Jenkins ?","a":"Créer des pods agents à la demande, détruits après le job","w":["Déployer Jenkins sans serveur","Remplacer les Jenkinsfile","Surveiller le cluster"],"why":"Le plugin Kubernetes lance un pod agent pour chaque build, puis le supprime : les agents s'adaptent automatiquement à la charge.","wx":["Jenkins a toujours besoin de son controller.","Les Jenkinsfile restent.","La surveillance du cluster relève de Prometheus ou Grafana."]},{"id":"cicd-f3-5","q":"Quel dossier sauvegarder pour garder toute la config Jenkins ?","a":"/var/lib/jenkins/","w":["/etc/jenkins/","/opt/jenkins/plugins/","/tmp/jenkins/"],"why":"/var/lib/jenkins (le JENKINS_HOME) contient tout : jobs, configuration, plugins, credentials, historique. C'est lui qu'on sauvegarde.","wx":["Il peut contenir des options de démarrage, mais pas les données.","Ce n'est pas le dossier standard.","/tmp est temporaire."]},{"id":"cicd-f3-6","q":"Que permet le plugin Configuration as Code (JCasC) ?","a":"Configurer Jenkins en YAML/JSON","w":["Écrire le Jenkinsfile en Python","Générer du code automatiquement","Sauvegarder les jobs"],"why":"JCasC décrit toute la configuration de Jenkins (sécurité, outils, agents) dans un fichier YAML versionné : Jenkins peut être recréé à l'identique.","wx":["Le Jenkinsfile s'écrit en Groovy.","Le plugin ne génère pas de code.","Les sauvegardes passent par ThinBackup."]},{"id":"cicd-f3-7","q":"Pourquoi définir un timeout sur un job ?","a":"Éviter qu'un job bloqué tourne indéfiniment","w":["Accélérer le build","Planifier le job","Limiter le nombre de plugins"],"why":"`timeout(time: 30, unit: 'MINUTES')` arrête le job s'il bloque, par exemple sur un test figé, ce qui libère l'agent.","wx":["Un timeout n'accélère rien.","La planification, ce sont les triggers.","Il n'a aucun rapport avec les plugins."]},{"id":"cicd-f3-8","q":"Que signifie un build en rouge dans Jenkins ?","a":"Échec","w":["En cours","Annulé","Réussi"],"x":"Bleu = en cours, gris = annulé.","why":"Rouge veut dire échec. Bleu (ou vert avec un plugin) : succès ; gris : annulé ou jamais lancé.","wx":["Un build en cours a une barre de progression ou une icône clignotante.","Annulé, c'est gris.","Réussi, c'est bleu ou vert."]}]},{"title":"Quiz de formation 1/2","src":"quiz","qs":[{"id":"cicd-01","q":"Jenkins est écrit principalement en quel langage ?","a":"Java","w":["Ruby","Python","c++"],"why":"Jenkins est écrit en Java : il tourne sur une JVM, d'où le besoin d'installer Java avant Jenkins.","wx":["Ce n'est pas du Ruby.","Ce n'est pas du Python.","Ce n'est pas du C++."]},{"id":"cicd-02","q":"Quel type de pipeline permet l’utilisation de groovy dans Jenkins ?","a":"Scripted pipeline","w":["Matrix pipeline","Declarative pipeline","Freestyle job"],"why":"Le Scripted Pipeline (`node { ... }`) est du Groovy libre : boucles, conditions, code complet.","wx":["Matrix sert à lancer des combinaisons de configurations ; ce n'est pas le type « Groovy ».","Le déclaratif repose aussi sur Groovy, mais avec une structure imposée. Le corrigé attendait le Scripted.","Freestyle se configure par l'interface, sans code."]},{"id":"cicd-03","q":"Dans un Jenkinsfile, que fait l’instruction agent any ?","a":"Affecte le pipeline à n’importe quel agent disponible","w":["Exécute le pipeline sans agent","Ignore l’étape de build","Laisse l’utilisateur choisir l’agent"],"why":"`agent any` laisse Jenkins exécuter le pipeline sur n'importe quel agent disponible.","wx":["Sans agent, ce serait `agent none`.","Il n'ignore aucune étape.","Jenkins choisit lui-même ; l'utilisateur n'intervient pas."]},{"id":"cicd-04","q":"Quel fichier est utilisé pour configurer un pipeline GitLab CI ?","a":".gitlab-ci.yml","w":["gitlab.yml","config.yml","pipeline.yaml"],"why":"GitLab lit le fichier .gitlab-ci.yml à la racine du dépôt : il y trouve stages et jobs.","wx":["Le nom exact est .gitlab-ci.yml.","config.yml est utilisé par d'autres outils (CircleCI…).","pipeline.yaml n'est pas lu par GitLab."]},{"id":"cicd-05","q":"Quelle fonctionnalité de Jenkins permet de conserver l’historique des builds ?","a":"Build History","w":["les logs","Workspace","Artifacts"],"why":"Le panneau Build History liste les builds passés d'un job, avec leur statut et leur date.","wx":["Les logs (Console Output) sont le détail d'un build, pas l'historique.","Le workspace est le dossier de travail.","Les artifacts sont des fichiers produits."]},{"id":"cicd-06","q":"Comment GitLab CI exécute-t-il un pipeline ?","a":"Toutes les réponses ci-dessus","w":["Lorsqu'un commit est poussé dans le dépôt","Selon un planning pré-établi","Lorsqu'un développeur le lance manuellement"],"o":["Lorsqu'un commit est poussé dans le dépôt","Selon un planning pré-établi","Toutes les réponses ci-dessus","Lorsqu'un développeur le lance manuellement"],"why":"Un pipeline GitLab peut démarrer sur un push, selon un planning (Pipeline schedules) ou à la main (bouton Run pipeline) : les trois sont vrais.","wx":["Vrai, mais incomplet.","Vrai, mais incomplet.","Vrai, mais incomplet."]},{"id":"cicd-07","q":"Comment pouvez-vous définir des conditions pour l’exécution d’un job dans GitLab CI ?","a":"avec des règles (rules)","w":["avec des settings","via des flags","using condition keywords"],"why":"Le mot-clé `rules:` définit quand un job s'exécute : selon la branche, une variable, des fichiers modifiés… Il remplace only et except.","wx":["« settings » n'est pas un mot-clé de .gitlab-ci.yml.","Les flags ne sont pas un mécanisme de GitLab CI.","Il n'existe pas de « condition keywords » ; c'est `rules`."]},{"id":"cicd-08","q":"Quelle variable d'environnement contient l'ID du dépôt dans GitLab CI ?","a":"$CI_PROJECT_ID","w":["$CI_ID","$PROJECT_ID","$GITLAB_ID"],"why":"GitLab fournit des variables prédéfinies ; `CI_PROJECT_ID` contient l'identifiant numérique du projet.","wx":["Cette variable n'existe pas.","Il manque le préfixe CI_.","Cette variable n'existe pas."]},{"id":"cicd-09","q":"Jenkins peut-il fonctionner sans serveur ?","a":"Oui, avec Docker","w":["Oui, dans un environnement sans serveur grâce à des configurations avancées","Non, il nécessite un serveur physique","Oui, Jenkins peut fonctionner sur n'importe quel système local"],"why":"Selon ton corrigé : oui, en le lançant dans un conteneur Docker (image jenkins/jenkins), sans l'installer sur un serveur dédié. Il lui faut quand même une machine pour tourner.","wx":["Jenkins n'est pas un service serverless comme Lambda.","Il n'a pas besoin d'un serveur physique : une VM ou un conteneur suffit.","Le corrigé attendait spécifiquement Docker."]}]},{"title":"Quiz de formation 2/2","src":"quiz","qs":[{"id":"cicd-10","q":"Que permet de faire le plugin \"Blue Ocean\" de Jenkins ?","a":"Gérer les pipelines avec une interface graphique améliorée","w":["Tester des jobs en parallèle","Suivre les erreurs des pipelines","Déployer des applications automatiquement"],"why":"Blue Ocean est une interface moderne et visuelle pour créer et suivre les pipelines (étapes en graphique, logs par étape).","wx":["Le parallélisme se règle dans le Jenkinsfile.","Il facilite la lecture des erreurs, mais ce n'est pas son but principal.","Le déploiement, c'est le pipeline lui-même."]},{"id":"cicd-11","q":"Quelle commande permet d'exécuter un job manuellement dans GitLab CI ?","a":"gitlab-runner exec","w":["gitlab-runner run","gitlab-ci start","trigger job"],"x":"gitlab-runner exec a été retiré des versions récentes de GitLab Runner ; en pratique on lance un job manuel (when: manual) depuis l'interface.","why":"C'est la réponse du corrigé : `gitlab-runner exec` lançait un job en local. Elle est dépréciée dans les versions récentes ; en pratique, on lance un job manuel (`when: manual`) depuis l'interface.","wx":["`run` démarre le service du runner, pas un job précis.","`gitlab-ci` n'est pas une commande.","« trigger job » n'est pas une commande."]},{"id":"cicd-12","q":"Quel est le but du paramètre tools dans un Jenkinsfile ?","a":"Spécifier les outils à installer pour exécuter un pipeline","w":["Configurer les permissions d’accès aux outils externes","Gérer les versions des plugins Jenkins","Définir les outils utilisés pour les tests uniquement"],"why":"`tools { maven 'M3'; jdk 'JDK17' }` installe ou met dans le PATH les outils configurés dans Jenkins (Global Tool Configuration) pour ce pipeline.","wx":["Les permissions se gèrent avec les credentials.","Les plugins se gèrent dans Manage Plugins.","Les outils servent à tout le pipeline, pas seulement aux tests."]},{"id":"cicd-13","q":"Dans GitLab CI, quel est l'impact de l'option allow_failure dans un job ?","a":"Si ce job échoue, le pipeline continue et le job s'affiche en avertissement (orange)","w":["Le job sera ignoré s'il échoue","Le job sera exécuté en parallèle avec d’autres jobs","Le job sera exécuté uniquement si les autres jobs réussissent"],"x":"Corrigé de ton quiz rectifié : avec allow_failure: true, l'échec du job ne bloque pas le pipeline.","why":"Avec `allow_failure: true`, si le job échoue, le pipeline continue : le job s'affiche en orange (avertissement) au lieu de bloquer la suite.","wx":["Le job est bien exécuté ; seul son échec est toléré.","Le parallélisme dépend des stages et de needs.","Ça, c'est le comportement normal des stages."]},{"id":"cicd-14","q":"Quelle est la différence entre un Freestyle Project et un Pipeline Job dans Jenkins ?","a":"Freestyle Project permet de configurer des étapes de build sans programmation, un Pipeline Job permet de définir des étapes complexes avec un code explicite","w":["Un Freestyle Project inclut la gestion des environnements de production, contrairement à un Pipeline Job","Un Pipeline Job est plus simple à configurer qu’un Freestyle Project","Aucun changement, les deux sont identiques dans leur fonctionnement"],"why":"Le Freestyle se configure dans l'interface, sans code (cases à cocher). Le Pipeline décrit le processus en code (Jenkinsfile), avec stages, conditions et parallélisme.","wx":["Aucun des deux n'a cette fonction spécifique.","Le Freestyle est plus simple au départ ; c'est le Pipeline qui demande du code.","Leur fonctionnement est très différent."]},{"id":"cicd-15","q":"Quelle est la commande pour installer un plugin dans Jenkins via la ligne de commande ?","a":"jenkins-cli install-plugin <plugin-name>","w":["Jenkins n’a pas de commande CLI pour installer des plugins","jenkins install plugin <plugin-name>","install-plugin <plugin-name>"],"why":"On télécharge jenkins-cli.jar depuis ton Jenkins, puis on lance `java -jar jenkins-cli.jar -s URL install-plugin nom`.","wx":["Jenkins a bien une CLI.","La commande `jenkins` n'existe pas en tant que telle.","`install-plugin` seul ne marche pas ; il faut passer par la CLI."]},{"id":"cicd-16","q":"Comment pouvez-vous gérer les différentes configurations d'environnement dans GitLab CI/CD ?","a":"En utilisant des fichiers de variables d'environnement","w":["En définissant des variables globales dans .gitlab-ci.yml","En utilisant des branches dédiées pour chaque environnement","En créant plusieurs projets pour chaque environnement"],"why":"Selon ton corrigé : par des fichiers de variables d'environnement. En pratique, GitLab propose aussi les variables CI/CD par environnement dans les paramètres du projet.","wx":["Des variables globales s'appliquent à tous les environnements, sans les différencier.","Une branche par environnement est une pratique lourde, déconseillée.","Plusieurs projets dupliquent le code."]},{"id":"cicd-17","q":"Comment pouvez-vous utiliser des services externes dans vos pipelines GitLab CI ?","a":"Toutes les réponses ci-dessus","w":["En utilisant des scripts shell","En définissant des services dans votre fichier .gitlab-ci.yml","En utilisant des containers Docker dans les jobs"],"o":["En utilisant des scripts shell","Toutes les réponses ci-dessus","En définissant des services dans votre fichier .gitlab-ci.yml","En utilisant des containers Docker dans les jobs"],"why":"Scripts shell, mot-clé `services:` (ex : une base postgres pour les tests) et images Docker dans les jobs : toutes ces méthodes fonctionnent.","wx":["Vrai, mais incomplet.","Vrai, mais incomplet.","Vrai, mais incomplet."]}]}]},{"id":"k8s","name":"Kubernetes","sub":"Orchestrer des conteneurs","steps":[{"title":"Architecture et workloads","src":"fiche","qs":[{"id":"k8s-f1-1","q":"À quoi sert Kubernetes ?","a":"Automatiser le déploiement et la gestion de conteneurs, comme un chef d'orchestre","w":["Construire des images Docker","Versionner le code","Provisionner des VM dans le cloud"],"why":"Kubernetes orchestre des conteneurs : il les déploie, les redémarre s'ils plantent, les répartit sur les machines et en ajoute selon la charge. Tu décris l'état voulu, il le maintient.","wx":["Construire des images, c'est Docker build.","Versionner, c'est Git.","Provisionner des VM, c'est Terraform."]},{"id":"k8s-f1-2","q":"Quel est le rôle du Control Plane ?","a":"Prendre les décisions globales du cluster (le « cerveau »)","w":["Exécuter les applications","Stocker les images Docker","Équilibrer le trafic externe"],"why":"Le Control Plane (API Server, etcd, Scheduler, Controller Manager) est le cerveau : il prend les décisions et veille à ce que l'état réel suive l'état voulu.","wx":["Les applis tournent sur les Worker Nodes.","Les images sont dans un registre (Docker Hub, ECR).","Le trafic externe passe par Ingress ou un LoadBalancer."]},{"id":"k8s-f1-3","q":"Qu'est-ce qu'etcd ?","a":"La base de données qui stocke l'état du cluster","w":["L'agent des nœuds","Le gestionnaire de paquets","Le point d'entrée HTTP"],"why":"etcd est une base clé-valeur distribuée qui stocke tout l'état du cluster : objets, configuration, secrets. Si tu perds etcd, tu perds le cluster : on le sauvegarde.","wx":["L'agent des nœuds, c'est le Kubelet.","Le gestionnaire de paquets, c'est Helm.","Le point d'entrée HTTP, c'est l'Ingress."]},{"id":"k8s-f1-4","q":"Quel composant choisit sur quel nœud placer un pod ?","a":"Le Scheduler","w":["Le Kubelet","etcd","Kube-proxy"],"why":"Le Scheduler regarde les pods sans nœud et choisit le meilleur nœud selon les ressources disponibles, les affinités et les taints.","wx":["Le Kubelet lance les pods sur son nœud une fois placés.","etcd stocke l'état.","Kube-proxy gère le réseau des Services."]},{"id":"k8s-f1-5","q":"Qu'est-ce que le Kubelet ?","a":"L'agent qui tourne sur chaque worker node","w":["La base de données du cluster","L'outil en ligne de commande","Le load balancer interne"],"why":"Le Kubelet tourne sur chaque nœud : il reçoit les pods à lancer, les démarre via le runtime et rend compte de leur santé à l'API Server.","wx":["La base, c'est etcd.","La ligne de commande, c'est kubectl.","Le load balancer interne, c'est le Service avec kube-proxy."]},{"id":"k8s-f1-6","q":"Quel composant d'un worker node gère le réseau ?","a":"Kube-proxy","w":["Kubelet","etcd","Scheduler"],"why":"Kube-proxy configure les règles réseau (iptables ou IPVS) sur chaque nœud pour que le trafic vers un Service arrive aux bons pods.","wx":["Le Kubelet gère les pods.","etcd stocke l'état.","Le Scheduler place les pods."]},{"id":"k8s-f1-7","q":"Qu'est-ce qu'un Pod ?","a":"L'unité de base : un ou plusieurs conteneurs partageant IP et volumes","w":["Un nœud du cluster","Un groupe de nœuds","Une image Docker"],"why":"Le Pod est la plus petite unité déployable : un ou plusieurs conteneurs qui partagent la même IP et les mêmes volumes. Il est éphémère : on le remplace, on ne le répare pas.","wx":["Un nœud est une machine qui héberge des pods.","Un groupe de nœuds forme le cluster.","L'image est le modèle ; le pod fait tourner des conteneurs créés à partir d'elle."]},{"id":"k8s-f1-8","q":"Quel objet pour une application sans état avec mises à jour sans coupure ?","a":"Deployment","w":["StatefulSet","DaemonSet","Job"],"why":"Le Deployment gère des applis sans état : il maintient N réplicas via un ReplicaSet et fait des mises à jour progressives (rolling updates), sans coupure.","wx":["StatefulSet sert aux applis avec état.","DaemonSet met un pod par nœud.","Job sert à une tâche ponctuelle qui se termine."]},{"id":"k8s-f1-9","q":"Quel objet pour une base de données (identité et stockage stables) ?","a":"StatefulSet","w":["Deployment","DaemonSet","ReplicaSet"],"why":"Le StatefulSet donne à chaque pod un nom stable (db-0, db-1) et son propre volume persistant : c'est ce qu'il faut pour une base de données.","wx":["Les pods d'un Deployment sont interchangeables, sans identité stable.","Un DaemonSet place un pod par nœud.","Un ReplicaSet maintient seulement un nombre de pods identiques."]},{"id":"k8s-f1-10","q":"Quel objet garantit un pod sur CHAQUE nœud (ex : monitoring) ?","a":"DaemonSet","w":["Deployment","StatefulSet","CronJob"],"why":"Le DaemonSet lance exactement un pod sur chaque nœud, y compris les nouveaux. C'est idéal pour les agents de logs ou de monitoring.","wx":["Un Deployment fixe un nombre de réplicas, pas un par nœud.","StatefulSet sert aux applis avec état.","CronJob sert aux tâches planifiées."]},{"id":"k8s-f1-11","q":"Quel objet pour une tâche planifiée ?","a":"CronJob","w":["Job","DaemonSet","Deployment"],"why":"Le CronJob lance un Job selon une planification cron (ex : une sauvegarde chaque nuit à 2 h).","wx":["Un Job s'exécute une fois ; le CronJob le répète selon un planning.","DaemonSet place un pod par nœud.","Un Deployment tourne en continu."]}]},{"title":"Réseau, config et scaling","src":"fiche","qs":[{"id":"k8s-f2-1","q":"À quoi sert un Service ?","a":"Donner une IP stable et un nom DNS à un groupe de pods","w":["Exposer le cluster en HTTPS avec un domaine","Stocker la configuration","Isoler les environnements"],"why":"Les pods changent d'IP quand ils sont recréés. Le Service donne une IP fixe (ClusterIP) et un nom DNS, puis répartit le trafic entre les pods correspondants.","wx":["Ça, c'est l'Ingress.","La configuration, c'est ConfigMap.","L'isolement, c'est le Namespace."]},{"id":"k8s-f2-2","q":"À quoi sert un Ingress ?","a":"Point d'entrée HTTP/HTTPS externe : routage par domaine et SSL","w":["IP interne stable pour les pods","Pare-feu entre pods","Stockage persistant"],"why":"L'Ingress est l'entrée HTTP(S) du cluster : il route selon le domaine et le chemin vers les bons Services et gère les certificats TLS.","wx":["L'IP interne stable, c'est le Service.","Le pare-feu entre pods, c'est NetworkPolicy.","Le stockage, ce sont PV et PVC."]},{"id":"k8s-f2-3","q":"À quoi sert une NetworkPolicy ?","a":"C'est le pare-feu interne qui restreint le trafic entre pods","w":["Exposer les pods sur internet","Attribuer des IP aux nœuds","Chiffrer les secrets"],"why":"Une NetworkPolicy autorise ou bloque le trafic entre pods (ex : seul le backend peut parler à la base) : c'est un pare-feu interne au cluster.","wx":["Exposer sur internet, c'est l'Ingress ou un Service LoadBalancer.","Les IP sont attribuées par le plugin réseau (CNI).","Les secrets se chiffrent dans etcd ou avec un outil externe."]},{"id":"k8s-f2-4","q":"Différence entre ConfigMap et Secret ?","a":"ConfigMap pour la config non sensible, Secret pour les données sensibles","w":["Secret pour la config, ConfigMap pour les mots de passe","Les deux chiffrent les données","Aucune différence"],"why":"Le ConfigMap stocke de la configuration en clair (URL, paramètres). Le Secret stocke les données sensibles (mots de passe, tokens), encodées en base64 et à accès restreint.","wx":["C'est l'inverse.","Un Secret est seulement encodé en base64, pas chiffré par défaut ; et un ConfigMap n'est pas chiffré du tout.","Leurs usages et leurs protections diffèrent."]},{"id":"k8s-f2-5","q":"Qu'est-ce qu'un PVC ?","a":"Une demande de stockage liée à un PersistentVolume","w":["Un disque physique du nœud","Un type de pod","Une règle réseau"],"why":"Le PVC (PersistentVolumeClaim) est une demande de stockage faite par un pod (ex : 10 Go). Kubernetes le relie à un PersistentVolume qui correspond.","wx":["Le disque réel, c'est le PersistentVolume.","Ce n'est pas un pod.","Le réseau, c'est NetworkPolicy."]},{"id":"k8s-f2-6","q":"Que fait le HPA ?","a":"Ajoute ou retire des pods selon la charge CPU/RAM","w":["Agrandit le CPU/RAM des pods existants","Ajoute des nœuds au cluster","Redémarre les pods en erreur"],"why":"Le HPA (Horizontal Pod Autoscaler) change le nombre de réplicas selon le CPU, la mémoire ou une autre métrique : plus de charge, plus de pods.","wx":["Agrandir les pods existants, c'est le VPA.","Ajouter des nœuds, c'est le Cluster Autoscaler.","Redémarrer les pods, c'est le rôle des sondes (liveness) et du contrôleur."]},{"id":"k8s-f2-7","q":"Que fait le VPA ?","a":"Ajuste le CPU/RAM des pods existants","w":["Ajoute des pods selon la charge","Ajoute des nœuds","Répartit le trafic"],"why":"Le VPA (Vertical Pod Autoscaler) ajuste le CPU et la RAM demandés par les pods selon leur consommation réelle.","wx":["Ajouter des pods, c'est le HPA.","Ajouter des nœuds, c'est le Cluster Autoscaler.","Répartir le trafic, c'est le Service."]},{"id":"k8s-f2-8","q":"À quoi sert un Namespace ?","a":"Isoler des environnements ou des équipes dans un même cluster","w":["Nommer les pods","Stocker les secrets","Relier deux clusters"],"why":"Un Namespace découpe un cluster en espaces isolés (dev, prod, équipe A…), chacun avec ses ressources, ses quotas et ses droits.","wx":["Les pods ont déjà un nom ; le namespace sert à les regrouper.","Les secrets se stockent dans des Secrets, eux-mêmes rangés dans un namespace.","Il ne relie pas deux clusters."]},{"id":"k8s-f2-9","q":"À quoi servent les Taints & Tolerations ?","a":"Réserver des nœuds à certains pods (ex : nœuds GPU)","w":["Signaler des pods en erreur","Limiter la RAM des pods","Chiffrer le trafic"],"why":"Un taint sur un nœud repousse les pods ; seuls ceux qui ont la toleration correspondante peuvent y aller. On réserve ainsi des nœuds GPU à certains pods.","wx":["Les erreurs se voient dans le statut des pods.","La RAM se limite avec resources.limits.","Le chiffrement passe par TLS ou un service mesh."]},{"id":"k8s-f2-10","q":"Qu'est-ce que Helm ?","a":"Un gestionnaire de paquets pour générer les manifestes Kubernetes","w":["L'outil en ligne de commande de Kubernetes","Un orchestrateur concurrent","Le tableau de bord du cluster"],"why":"Helm est le gestionnaire de paquets de Kubernetes : un chart est un modèle de manifestes YAML paramétrables, qu'on installe avec `helm install`.","wx":["La ligne de commande, c'est kubectl.","Ce n'est pas un orchestrateur.","Le tableau de bord, c'est Kubernetes Dashboard ou Lens."]},{"id":"k8s-f2-11","q":"Quel est l'outil en ligne de commande principal de Kubernetes ?","a":"kubectl","w":["kubeadm-cli","helm","k8sctl"],"why":"kubectl parle à l'API Server : `kubectl get pods`, `apply -f`, `logs`, `describe`…","wx":["kubeadm sert à installer un cluster ; « kubeadm-cli » n'existe pas.","Helm gère des charts, il ne remplace pas kubectl.","« k8sctl » n'existe pas."]}]}]}];
const COLORS={linux:"#C2410C",git:"#D9480F",docker:"#1D72B8",ansible:"#B42318",terraform:"#6941C6",aws:"#C77700",cicd:"#3B5BDB",k8s:"#2F6FDB"};
const BADGE={linux:"$_",git:"git",docker:"🐳",ansible:"A",terraform:"tf",aws:"aws",cicd:"CI",k8s:"k8s"};
const PASS=0.7;
const $=id=>document.getElementById(id);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(v==null)continue;if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const QINDEX={};BANK.forEach(t=>t.steps.forEach((s,si)=>s.qs.forEach(q=>QINDEX[q.id]={q,t:t.id,si})));
const TOTAL_STEPS=BANK.reduce((n,t)=>n+t.steps.length,0);

/* ---- Sauvegarde sur le téléphone ---- */
const KEY="devops-quiz-v1";
let S={best:{},miss:{},xp:0,streak:0,last:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function touchStreak(){const t=today();if(S.last===t)return;S.streak=S.last===yesterday()?S.streak+1:1;S.last=t}
function stepKey(tid,si){return tid+":"+si}
function stars(p){return p>=1?3:p>=.85?2:p>=PASS?1:0}
function starEl(n){const e=h("span",{class:"stars","aria-label":n+" étoile"+(n>1?"s":"")+" sur 3"});for(let i=0;i<3;i++)e.append(h("span",{class:i<n?"":"off"},"★"));return e}
function isOpen(t,si){return si===0||(S.best[stepKey(t.id,si-1)]||0)>=PASS}
function doneSteps(t){return t.steps.filter((s,si)=>(S.best[stepKey(t.id,si)]||0)>=PASS).length}
function yesterday(){const y=new Date();y.setDate(y.getDate()-1);return y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0")}
function refreshChips(){const st=(S.last===today()||S.last===yesterday())?S.streak:0;$("streak").textContent=st;$("xp").textContent=S.xp}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}

/* ---- Navigation ---- */
let stack=[];
function go(view,arg,replace){if(replace)stack.pop();stack.push([view,arg]);render()}
function back(){if(quizState&&!quizState.finished&&quizState.i>0&&stack[stack.length-1][0]==="quiz"){if(!backArmed){backArmed=true;toast("Appuie encore pour quitter la série");setTimeout(()=>backArmed=false,2500);return}}backArmed=false;stack.pop();if(!stack.length)stack=[["home"]];render()}
let backArmed=false;
$("back").onclick=back;
window.addEventListener("popstate",()=>{if(stack.length>1){back();history.pushState(null,"")}});
history.pushState(null,"");
function render(){const[view,arg]=stack[stack.length-1];$("back").hidden=stack.length<=1;refreshChips();const app=$("app");app.replaceChildren();window.scrollTo(0,0);({home:viewHome,theme:viewTheme,quiz:viewQuiz,result:viewResult})[view](app,arg)}

/* ---- Accueil ---- */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(stack[stack.length-1][0]==="home")render()});
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function viewHome(app){
  $("title").textContent="DevOps Quiz";
  const done=BANK.reduce((n,t)=>n+doneSteps(t),0);
  app.append(h("section",{class:"card hero"},
    h("div",{class:"hero-row"},
      h("div",{},h("div",{class:"label"},"Ta progression"),h("div",{class:"big"},done+" / "+TOTAL_STEPS),h("div",{class:"small"},"étapes validées")),
      h("div",{style:"text-align:right"},h("div",{class:"big"},String(Object.keys(QINDEX).length)),h("div",{class:"small"},"questions"))),
    h("div",{class:"bar"},h("i",{style:"width:"+Math.round(done/TOTAL_STEPS*100)+"%"}))));
  const missN=Object.keys(S.miss).filter(id=>QINDEX[id]).length;
  app.append(h("button",{class:"card review",disabled:missN?null:"",onclick:()=>missN&&startReview()},
    h("span",{class:"ico"},String(missN)),
    h("span",{style:"flex:1;min-width:0"},h("b",{},"Revoir mes erreurs"),h("span",{class:"small"},missN?"Les questions ratées reviennent jusqu'à ce que tu les réussisses":"Aucune erreur à revoir pour l'instant"))));
  app.append(h("button",{class:"btn btn-ghost",onclick:startRandom},"🎲  Série aléatoire · 10 questions"));
  const grid=h("div",{class:"themes"});
  BANK.forEach(t=>{const d=doneSteps(t),n=t.steps.length;
    grid.append(h("button",{class:"card theme",onclick:()=>go("theme",t.id)},
      h("span",{class:"badge",style:"background:"+COLORS[t.id]},BADGE[t.id]),
      h("span",{},h("b",{},t.name),h("div",{class:"sub"},t.sub)),
      h("span",{class:"foot"},h("span",{},d+"/"+n+" étapes"),h("span",{class:"bar"},h("i",{style:"width:"+Math.round(d/n*100)+"%;background:"+COLORS[t.id]})))))});
  app.append(h("div",{class:"label",style:"margin-top:4px"},"Thèmes"),grid);
  if(!standalone()){
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    const box=h("section",{class:"card install"},h("b",{},"Installer l'appli sur ton téléphone"));
    if(deferredPrompt){box.append(h("p",{},"Ajoute DevOps Quiz à ton écran d'accueil : elle s'ouvrira comme une appli, même sans connexion."),h("button",{class:"btn btn-primary",onclick:async()=>{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;render()}},"Installer"))}
    else if(ios){box.append(h("p",{html:"Dans Safari, touche <b>Partager</b> (le carré avec la flèche), puis <b>Sur l'écran d'accueil</b>."}))}
    else{box.append(h("p",{html:"Dans Chrome, ouvre le menu <b>⋮</b> puis <b>Installer l'application</b> (ou <b>Ajouter à l'écran d'accueil</b>)."}))}
    app.append(box);
  }
  app.append(h("button",{class:"danger",onclick:resetAll},"Remettre ma progression à zéro"));
}
let resetArmed=false;
function resetAll(){if(!resetArmed){resetArmed=true;toast("Touche encore une fois pour tout effacer");setTimeout(()=>resetArmed=false,3000);return}S={best:{},miss:{},xp:0,streak:0,last:null};save();resetArmed=false;toast("Progression remise à zéro");render()}

/* ---- Thème : parcours par étapes ---- */
function viewTheme(app,tid){
  const t=BANK.find(x=>x.id===tid);$("title").textContent=t.name;
  const d=doneSteps(t);
  app.append(h("section",{class:"card hero"},h("div",{class:"label"},t.sub),
    h("div",{},h("div",{class:"big"},d+" / "+t.steps.length),h("div",{class:"small"},"étapes validées · 70 % pour débloquer la suivante")),
    h("div",{class:"bar"},h("i",{style:"width:"+Math.round(d/t.steps.length*100)+"%;background:"+COLORS[t.id]}))));
  const path=h("div",{class:"path"});
  t.steps.forEach((s,si)=>{const best=S.best[stepKey(t.id,si)];const open=isOpen(t,si);const done=(best||0)>=PASS;
    const cls="step "+(done?"done":open?"open":"locked");
    path.append(h("button",{class:cls,disabled:open?null:"",onclick:()=>open&&startStep(t.id,si),"aria-label":"Étape "+(si+1)+" : "+s.title+(open?"":" (verrouillée)")},
      h("span",{class:"node"},done?"✓":open?String(si+1):"🔒"),
      h("span",{class:"info"},h("b",{},s.title),
        h("span",{class:"meta"},s.src==="quiz"?h("span",{class:"tag"},"Ton quiz"):null,h("span",{},s.qs.length+" questions"),best!=null?starEl(stars(best)):null,best!=null?h("span",{},"meilleur : "+Math.round(best*100)+" %"):null))))});
  app.append(path);
}

/* ---- Série de questions ---- */
let quizState=null;
function prepare(q){const opts=q.o?q.o.slice():shuffle([q.a,...q.w]);return{q,opts,correct:opts.indexOf(q.a)}}
function startStep(tid,si){const t=BANK.find(x=>x.id===tid);quizState={mode:"step",tid,si,title:t.name+" · Étape "+(si+1),items:shuffle(t.steps[si].qs).map(prepare),i:0,good:0,answered:false,missed:[]};go("quiz")}
function startReview(){const ids=shuffle(Object.keys(S.miss).filter(id=>QINDEX[id])).slice(0,15);quizState={mode:"review",title:"Mes erreurs",items:ids.map(id=>prepare(QINDEX[id].q)),i:0,good:0,answered:false,missed:[]};go("quiz")}
function startRandom(){const all=Object.values(QINDEX).map(x=>x.q);quizState={mode:"random",title:"Série aléatoire",items:shuffle(all).slice(0,10).map(prepare),i:0,good:0,answered:false,missed:[]};go("quiz")}
function viewQuiz(app){
  const st=quizState;if(!st){back();return}
  $("title").textContent=st.title;
  const it=st.items[st.i];const n=st.items.length;
  app.append(h("div",{class:"qhead"},h("div",{class:"bar"},h("i",{style:"width:"+Math.round(st.i/n*100)+"%"})),h("span",{},(st.i+1)+"/"+n)));
  const theme=BANK.find(t=>t.id===QINDEX[it.q.id].t);
  app.append(h("section",{class:"card qcard"},h("div",{class:"label",style:"color:"+COLORS[theme.id]},theme.name),h("h2",{html:fmt(it.q.q)})));
  const opts=h("div",{class:"opts"});const keys="ABCDE";
  const fb=h("div");const bottom=h("div",{class:"bottom"});
  it.opts.forEach((o,k)=>{const b=h("button",{class:"opt"},h("span",{class:"k"},keys[k]),h("span",{html:fmt(o)}));
    b.onclick=()=>{if(st.answered)return;st.answered=true;const ok=k===it.correct;
      [...opts.children].forEach((x,j)=>{x.disabled=true;if(j===it.correct)x.classList.add("right");else if(j===k)x.classList.add("wrong");else x.classList.add("dim")});
      if(ok){st.good++;S.xp+=10;if(S.miss[it.q.id]){S.miss[it.q.id]--;if(S.miss[it.q.id]<=0)delete S.miss[it.q.id]}}
      else{st.missed.push(it);S.miss[it.q.id]=2}
      touchStreak();save();refreshChips();
      try{navigator.vibrate&&navigator.vibrate(ok?15:[30,40,30])}catch(e){}
      fb.replaceChildren(explain(it,k,ok,keys));
      const last=st.i===n-1;
      bottom.replaceChildren(h("button",{class:"btn btn-primary",onclick:()=>{if(last)finish();else{st.i++;st.answered=false;render()}}},last?"Voir mon résultat":"Question suivante"));
      bottom.firstChild.focus({preventScroll:true});fb.firstChild.scrollIntoView({behavior:"smooth",block:"start"});
    };opts.append(b)});
  app.append(opts,fb,bottom);
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
/* Explication détaillée après chaque réponse */
function whyWrong(q,text){const i=q.w.indexOf(text);return q.wx&&i>=0?q.wx[i]:""}
function explain(it,k,ok,keys){
  const q=it.q;const box=h("div",{class:"explain"});
  box.append(h("div",{class:"feedback "+(ok?"good":"bad")},
    h("b",{},ok?pick(["Bien joué !","Exact !","Parfait !","C'est ça !"]):"Pas tout à fait"),
    h("p",{},ok?"Lis l'explication pour bien retenir pourquoi.":"Voici pourquoi ton choix ne marche pas, et ce qu'il fallait répondre.")));
  if(!ok){const mine=it.opts[k];
    box.append(h("section",{class:"xbox wrong"},h("h3",{},"✗ Pourquoi ta réponse est fausse"),
      h("p",{class:"ans",html:keys[k]+". "+fmt(mine)}),h("p",{html:fmt(whyWrong(q,mine)||"Ce n'est pas ce que fait cet élément.")})))}
  const right=h("section",{class:"xbox right"},h("h3",{},"✓ "+(ok?"Pourquoi c'est la bonne réponse":"La bonne réponse")),
    h("p",{class:"ans",html:keys[it.correct]+". "+fmt(q.a)}),q.why?h("p",{html:fmt(q.why)}):null);
  if(q.x)right.append(h("p",{class:"note",html:"💡 "+fmt(q.x)}));
  box.append(right);
  const others=it.opts.map((o,j)=>({o,j})).filter(x=>x.j!==it.correct&&x.j!==k);
  if(others.length){const sec=h("section",{class:"xbox others"},h("h3",{},ok?"Pourquoi les autres sont fausses":"Et les autres réponses"));
    others.forEach(({o,j})=>sec.append(h("div",{class:"xitem"},h("span",{class:"k"},keys[j]),h("div",{},h("b",{html:fmt(o)}),h("span",{html:fmt(whyWrong(q,o))})))));
    box.append(sec)}
  return box;
}
function finish(){const st=quizState;st.finished=true;const p=st.good/st.items.length;
  let unlocked=false;
  if(st.mode==="step"){const k=stepKey(st.tid,st.si);const prev=S.best[k]||0;if(p>prev)S.best[k]=p;if(p>=PASS&&prev<PASS){S.xp+=50;unlocked=true}}
  save();go("result",{p,unlocked},true)}
function viewResult(app,{p,unlocked}){
  const st=quizState;$("title").textContent=st.title;
  const n=stars(p);const t=st.tid?BANK.find(x=>x.id===st.tid):null;
  const msg=st.mode!=="step"?(p>=PASS?"Belle série, continue comme ça.":"Ces questions reviendront dans « Mes erreurs ».")
    :p>=PASS?(unlocked?(st.si<t.steps.length-1?"Étape validée : la suivante est débloquée !":"Thème terminé, bravo !"):"Étape validée."):"Il faut 70 % pour valider. Revois tes erreurs et retente.";
  const s=starEl(n);s.classList.add("pop");
  app.append(h("section",{class:"card result"},st.mode==="step"?s:null,h("div",{class:"score"},Math.round(p*100)+" %"),h("div",{class:"small"},st.good+" bonnes réponses sur "+st.items.length),h("p",{},msg)));
  const acts=h("div",{class:"actions"});
  if(st.mode==="step"&&p>=PASS&&st.si<t.steps.length-1)acts.append(h("button",{class:"btn btn-primary",onclick:()=>{stack.pop();startStep(st.tid,st.si+1)}},"Étape suivante →"));
  if(st.missed.length)acts.append(h("button",{class:st.mode==="step"&&p>=PASS?"btn btn-ghost":"btn btn-primary",onclick:()=>{const items=shuffle(st.missed).map(x=>prepare(x.q));quizState={mode:"review",title:"Rattrapage",items,i:0,good:0,answered:false,missed:[]};go("quiz",null,true)}},"Refaire mes "+st.missed.length+" erreur"+(st.missed.length>1?"s":"")));
  if(st.mode==="step")acts.append(h("button",{class:"btn btn-ghost",onclick:()=>{stack.pop();startStep(st.tid,st.si)}},"Recommencer l'étape"));
  acts.append(h("button",{class:"btn btn-ghost",onclick:back},st.mode==="step"?"Retour aux étapes":"Retour à l'accueil"));
  app.append(acts);
  if(st.missed.length){const ul=h("ul");st.missed.forEach(x=>ul.append(h("li",{},h("span",{html:fmt(x.q.q)}),h("span",{class:"good",html:"→ "+fmt(x.q.a)}))));
    app.append(h("section",{class:"card missed"},h("div",{class:"label"},"À retenir"),ul))}
}

stack=[["home"]];render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
</body>
</html>
