<title>DevOps Quiz</title>
<meta name="description" content="Révision DevOps par étapes : Linux, Git, Docker, Ansible, Terraform, AWS, CI/CD, Kubernetes.">

<meta name="mobile-web-app-capable" content="yes">

<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
/* Layout: appli mobile une colonne ; barre du haut fixe, écrans qui se remplacent. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#14203A; --muted:#5C6B82; --line:#D6DEE9;
  --brand:#1B2A4A; --accent:#2F5BEA; --accent-soft:#E3EAFE;
  --ok:#17845A; --ok-soft:#DDF3E8; --ko:#C8442F; --ko-soft:#FBE4DF; --gold:#E0A100;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1524; --surface:#172238; --ink:#E8EDF6; --muted:#97A5BD; --line:#26344F;
  --brand:#0A1120; --accent:#7C9CFF; --accent-soft:#1E2C52;
  --ok:#4CCB92; --ok-soft:#123326; --ko:#FF8A74; --ko-soft:#3A1D18; --gold:#F5C542;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.9em;background:var(--accent-soft);color:var(--ink);padding:1px 5px;border-radius:5px;word-break:break-word}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;min-height:56px}
.top h1{font-size:18px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.top .back{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.top .chips{display:flex;gap:8px;font-size:13px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);padding:4px 9px;border-radius:99px;font-variant-numeric:tabular-nums}

main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;font-weight:700;padding:0 18px;width:100%}
.btn-primary{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn-primary{color:#0E1524}}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}

/* Accueil */
.hero{padding:18px;display:flex;flex-direction:column;gap:14px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.small{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.review{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%}
.review .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--ko-soft);color:var(--ko);font-weight:800;flex:none}
.review b{display:block}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.theme{padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative;overflow:hidden}
.theme .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:15px;color:#fff}
.theme b{font-size:17px}
.theme .sub{font-size:13px;color:var(--muted);line-height:1.3}
.theme .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.theme .foot span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.install{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.install p{margin:0;font-size:14px;color:var(--muted)}

/* Parcours d'étapes */
.path{display:flex;flex-direction:column;gap:0;position:relative;padding-left:4px}
.step{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;text-align:left;width:100%;padding:8px 0;position:relative}
.step .node{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--surface);border:3px solid var(--line);color:var(--muted);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.step:not(:last-child)::after{content:"";position:absolute;left:25px;top:56px;bottom:-12px;width:3px;background:var(--line)}
.step.done .node{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done:not(:last-child)::after{background:var(--ok)}
.step.open .node{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.step.locked{opacity:.55;cursor:default}
.step .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.step .info b{font-size:16px}
.step .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line)}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}

/* Question */
.qhead{display:flex;align-items:center;gap:12px}
.qhead .bar{flex:1}
.qhead span{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.qcard{padding:20px 18px;display:flex;flex-direction:column;gap:6px}
.qcard h2{font-size:19px;line-height:1.35;margin:0;font-weight:700;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);min-height:56px;transition:transform .08s,border-color .15s,background .15s}
.opt:active{transform:scale(.985)}
.opt .k{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:800;font-size:14px;color:var(--muted)}
.opt span{overflow-wrap:anywhere;min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ko);background:var(--ko-soft)}
.opt.wrong .k{background:var(--ko);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.feedback{padding:14px 16px;border-radius:12px;display:flex;flex-direction:column;gap:6px;border-left:5px solid}
.feedback.good{background:var(--ok-soft);border-color:var(--ok)}
.feedback.bad{background:var(--ko-soft);border-color:var(--ko)}
.feedback b{font-size:16px}
.feedback p{margin:0;font-size:14px}
.explain{display:flex;flex-direction:column;gap:12px;scroll-margin-top:72px}
.xbox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;flex-direction:column;gap:8px}
.xbox h3{margin:0;font-size:13px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;display:flex;align-items:center;gap:8px}
.xbox.right{border-left:5px solid var(--ok)}
.xbox.right h3{color:var(--ok)}
.xbox.wrong{border-left:5px solid var(--ko)}
.xbox.wrong h3{color:var(--ko)}
.xbox.others h3{color:var(--muted)}
.xbox p{margin:0;font-size:15px;line-height:1.5;overflow-wrap:anywhere}
.xbox .ans{font-weight:700}
.xbox .note{font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:8px}
.xitem{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start}
.xitem+.xitem{border-top:1px solid var(--line);padding-top:10px}
.xitem .k{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;background:var(--ko-soft);color:var(--ko);font-weight:800;font-size:13px}
.xitem div{display:flex;flex-direction:column;gap:3px;min-width:0}
.xitem b{font-size:14px;overflow-wrap:anywhere}
.xitem span{font-size:14px;color:var(--muted);line-height:1.45;overflow-wrap:anywhere}
.xitem.mine .k{background:var(--ko);color:#fff}
.bottom{position:sticky;bottom:0;padding:12px 0 calc(4px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* Résultat */
.result{padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.result .stars{font-size:38px;letter-spacing:6px}
.result .score{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.result p{margin:0;color:var(--muted);max-width:32ch}
.missed{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.missed li{display:flex;flex-direction:column;gap:3px;font-size:14px}
.missed ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.missed .good{color:var(--ok);font-weight:600}
.actions{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:10;max-width:90vw}
.danger{color:var(--ko);font-size:14px;font-weight:600;padding:10px;align-self:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
</style>
</head>

<header class="top">
  <button class="back" id="back" aria-label="Retour" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="title">DevOps Quiz</h1>
  <div class="chips"><span class="chip" title="Jours d'affilée" aria-label="Série de jours">🔥 <b id="streak">0</b></span><span class="chip" title="Points" aria-label="Points">⭐ <b id="xp">0</b></span></div>
</header>

<script>
const BANK = [{"id":"linux","name":"Linux","sub":"Commandes, droits, processus","steps":[{"title":"Navigation et fichiers","src":"fiche","qs":[{"id":"linux-f1-1","q":"Que fait la commande `pwd` ?","a":"Affiche le dossier dans lequel tu te trouves","w":["Liste les fichiers du dossier","Change de dossier","Affiche le chemin de l'exécutable d'une commande"],"x":"pwd = print working directory.","why":"`pwd` veut dire « print working directory » : il affiche le chemin complet du dossier où tu te trouves, par exemple /home/wil. C'est le réflexe pour savoir où tu es avant de lancer une commande.","wx":["Lister les fichiers, c'est `ls`.","Changer de dossier, c'est `cd`.","Trouver le chemin d'un exécutable, c'est `which` (ex : `which pwd`)."]},{"id":"linux-f1-2","q":"Que fait `cd -` ?","a":"Revient au dossier précédent","w":["Remonte au dossier parent","Va dans ton répertoire utilisateur (home)","Va à la racine /"],"x":"Pour remonter au dossier parent, c'est `cd ..`.","why":"`cd -` te ramène au dernier dossier où tu étais, comme un bouton « retour ». Pratique pour alterner entre deux dossiers éloignés.","wx":["Remonter au dossier parent, c'est `cd ..`.","Aller dans ton home, c'est `cd ~` (ou `cd` tout seul).","Aller à la racine, c'est `cd /`."]},{"id":"linux-f1-3","q":"Que fait `cd ~` ?","a":"Va dans ton répertoire utilisateur (home)","w":["Revient au dossier précédent","Remonte au dossier parent","Va à la racine /"],"why":"Le `~` (tilde) est un raccourci pour ton répertoire personnel, par exemple /home/wil. `cd ~` t'y emmène depuis n'importe où.","wx":["Revenir au dossier précédent, c'est `cd -`.","Remonter d'un niveau, c'est `cd ..`.","La racine se note `/`, pas `~`."]},{"id":"linux-f1-4","q":"Que fait `ls -la` ?","a":"Liste détaillée, fichiers cachés inclus","w":["Liste triée par date de modification","Liste uniquement les dossiers","Liste récursive de tous les sous-dossiers"],"why":"`-l` donne le format long (droits, propriétaire, taille, date) et `-a` (all) montre aussi les fichiers cachés, ceux qui commencent par un point comme .bashrc.","wx":["Le tri par date, c'est l'option `-t` (ex : `ls -lrt`).","`ls` n'a pas d'option simple pour lister seulement les dossiers ; on utilise plutôt `ls -d */` ou `find -type d`.","La liste récursive, c'est `-R`."]},{"id":"linux-f1-5","q":"Que fait `ls -lrt /etc` ?","a":"Trie par date de dernière modification, du plus ancien au plus récent","w":["Trie par taille, du plus gros au plus petit","Liste récursivement tout /etc","Affiche uniquement les fichiers cachés"],"why":"`-l` = format long, `-t` = tri par date de modification, `-r` = ordre inversé. Le tri `-t` met les plus récents en premier ; `-r` l'inverse, donc les plus récents finissent en bas, juste au-dessus de ton prompt.","wx":["Le tri par taille, c'est `-S`.","La récursion, c'est `-R`, pas `-r`. Attention : en minuscule, `-r` veut dire « reverse ».","Les fichiers cachés s'affichent avec `-a`."]},{"id":"linux-f1-6","q":"Que fait `ls -lh` ?","a":"Affiche les tailles dans un format lisible (Ko, Mo…)","w":["Affiche les fichiers cachés","Affiche l'aide de la commande ls","Trie les fichiers par heure"],"why":"`-h` veut dire « human-readable » : au lieu de 14522 octets, tu lis 15K, 3,2M, 1G. Il se combine avec `-l`, qui affiche les tailles.","wx":["Les fichiers cachés, c'est `-a`.","L'aide, c'est `ls --help` ou `man ls`. Ici, `-h` ne veut pas dire « help ».","Le tri par date, c'est `-t`."]},{"id":"linux-f1-7","q":"Que fait `mkdir -p a/b/c` ?","a":"Crée des dossiers imbriqués en une seule commande","w":["Crée trois dossiers a, b et c au même niveau","Crée a/b/c seulement si a et b existent déjà","Crée un dossier protégé en écriture"],"why":"`-p` (parents) crée tous les dossiers manquants du chemin d'un coup : a, puis a/b, puis a/b/c. Sans `-p`, mkdir échoue si a n'existe pas. Il ne renvoie pas non plus d'erreur si le dossier existe déjà.","wx":["Pour trois dossiers côte à côte, on écrirait `mkdir a b c`. Les `/` indiquent une imbrication.","C'est justement le comportement SANS `-p`. Avec `-p`, les parents sont créés.","`-p` n'a rien à voir avec les droits : ce sont chmod ou l'option `-m` qui les gèrent."]},{"id":"linux-f1-8","q":"Quelle commande déplace OU renomme un fichier ?","a":"mv","w":["cp","ln","rename -r"],"why":"`mv` (move) déplace un fichier. Si la destination est un nouveau nom dans le même dossier, cela revient à le renommer : `mv a.txt b.txt`.","wx":["`cp` copie : l'original reste en place.","`ln` crée un lien vers le fichier, sans le déplacer.","`rename` existe sur certaines distributions pour renommer en masse avec des motifs, mais `-r` n'est pas une option standard et ce n'est pas la commande de déplacement."]},{"id":"linux-f1-9","q":"Que fait `ln -s backup lien_backup` ?","a":"Crée un lien symbolique (raccourci) vers backup","w":["Copie le dossier backup","Déplace backup dans lien_backup","Crée un fichier vide nommé lien_backup"],"why":"`ln -s cible nom_du_lien` crée un lien symbolique : un raccourci qui pointe vers backup. Ouvrir lien_backup, c'est ouvrir backup. Si backup est supprimé, le lien devient « cassé ».","wx":["Copier, c'est `cp -r`. Un lien ne duplique aucune donnée.","Déplacer, c'est `mv`.","Créer un fichier vide, c'est `touch`."]},{"id":"linux-f1-10","q":"Que fait `touch fichier.txt` si le fichier n'existe pas ?","a":"Crée un fichier vide","w":["Affiche son contenu","Renvoie une erreur","Ouvre l'éditeur de texte"],"why":"`touch` met à jour la date de modification d'un fichier ; s'il n'existe pas, il le crée vide. C'est la façon la plus rapide de créer un fichier vide.","wx":["Afficher le contenu, c'est `cat`.","Aucune erreur : la création est justement le comportement prévu.","`touch` n'ouvre rien ; pour éditer, on utilise `nano` ou `vim`."]},{"id":"linux-f1-11","q":"Quelle commande copie un dossier avec tout son contenu ?","a":"cp -r","w":["cp -a -f","mv -r","cp --all"],"x":"-r = récursif.","why":"`-r` (récursif) dit à `cp` de descendre dans le dossier et de copier tout ce qu'il contient. Sans `-r`, `cp` refuse de copier un dossier.","wx":["`-a` (archive) copie aussi récursivement en gardant droits et dates, et `-f` force l'écrasement. Cette combinaison n'est pas la réponse attendue : la commande de base, c'est `cp -r`.","`mv` déplace, il ne copie pas, et n'a pas besoin de `-r`.","`--all` n'est pas une option de `cp`."]},{"id":"linux-f1-12","q":"Que fait `rm -i profile.log` ?","a":"Supprime le fichier en demandant une confirmation","w":["Supprime le fichier de force","Supprime un dossier et son contenu","Supprime uniquement les fichiers cachés"],"why":"`-i` (interactive) fait demander une confirmation avant chaque suppression : tu tapes y pour valider. C'est un garde-fou contre les erreurs.","wx":["Forcer, c'est `-f`, l'inverse de `-i`.","Supprimer un dossier et son contenu, c'est `-r`.","Il n'existe pas d'option qui cible seulement les fichiers cachés."]},{"id":"linux-f1-13","q":"Que fait `rm -rf dossier` ?","a":"Supprime le dossier et son contenu de force, sans confirmation","w":["Supprime le dossier seulement s'il est vide","Déplace le dossier dans la corbeille","Supprime le dossier en demandant confirmation"],"x":"À manier avec prudence !","why":"`-r` supprime récursivement le dossier et tout ce qu'il contient ; `-f` force, sans confirmation ni erreur si quelque chose manque. Il n'y a pas de corbeille sous Linux : c'est définitif.","wx":["Supprimer un dossier vide, c'est `rmdir`.","`rm` ne passe jamais par une corbeille : la suppression est immédiate.","La confirmation, c'est `-i`. `-f` fait exactement l'inverse."]},{"id":"linux-f1-14","q":"Que fait `which pwd` ?","a":"Localise le fichier exécutable de la commande pwd","w":["Affiche le dossier actuel","Affiche l'aide de pwd","Indique quel utilisateur a lancé pwd"],"why":"`which` cherche dans ton PATH où se trouve l'exécutable d'une commande. `which pwd` répond par exemple /usr/bin/pwd. Utile pour savoir quelle version d'un programme tu lances.","wx":["Afficher le dossier courant, c'est `pwd` lui-même, pas `which pwd`.","L'aide, c'est `man pwd` ou `pwd --help`.","Voir quel utilisateur lance un processus, c'est `ps`."]},{"id":"linux-f1-15","q":"Que fait `!42` dans le terminal ?","a":"Réexécute la commande n°42 de l'historique","w":["Tue le processus 42","Affiche les 42 dernières commandes","Va à la ligne 42 du fichier ouvert"],"why":"Dans Bash, `!` suivi d'un numéro relance la commande portant ce numéro dans `history`. `!!` relance la dernière commande.","wx":["Tuer un processus, c'est `kill 42`.","Afficher les dernières commandes, c'est `history` (ou `history 42`).","Le terminal n'a pas de notion de « ligne du fichier ouvert »."]}]},{"title":"Lire et chercher","src":"fiche","qs":[{"id":"linux-f2-1","q":"Que fait `tac fichier` ?","a":"Affiche le contenu à l'envers (dernière ligne en premier)","w":["Affiche le contenu page par page","Concatène deux fichiers","Affiche les 10 dernières lignes"],"why":"`tac`, c'est `cat` à l'envers, et le nom aussi : il affiche le fichier de la dernière ligne à la première.","wx":["Page par page, c'est `less` ou `more`.","Concaténer, c'est le rôle de `cat` (`cat a b`).","Les 10 dernières lignes, c'est `tail`."]},{"id":"linux-f2-2","q":"Quelle est la différence entre `less` et `more` ?","a":"less permet de monter et descendre, more seulement de descendre","w":["more permet de monter et descendre, less seulement de descendre","less affiche moins de lignes que more","Aucune, ce sont des alias"],"x":"Dans less, tape q pour quitter.","why":"`more` est l'ancien paginateur : on ne peut que descendre. `less` est plus récent et permet de remonter, chercher avec `/` et quitter avec `q`. D'où le jeu de mots : « less is more ».","wx":["C'est l'inverse : c'est `less` qui permet de remonter.","Les deux affichent un écran à la fois. La différence est la navigation, pas le nombre de lignes.","Ce sont deux programmes distincts."]},{"id":"linux-f2-3","q":"Combien de lignes affiche `tail fichier` sans option ?","a":"Les 10 dernières","w":["Les 5 dernières","Les 20 dernières","Toutes"],"why":"Par défaut, `tail` affiche les 10 dernières lignes (comme `head` affiche les 10 premières). On change le nombre avec `-n`, par exemple `tail -n 5`.","wx":["5, c'est seulement si tu l'indiques avec `-n 5`.","20, c'est seulement avec `-n 20`.","Pour tout afficher, on utilise `cat`."]},{"id":"linux-f2-4","q":"Que fait `tail -f app.log` ?","a":"Suit en direct les nouvelles lignes ajoutées au fichier","w":["Affiche le fichier en entier","Force la lecture d'un fichier verrouillé","Affiche les premières lignes du fichier"],"x":"Très utilisé pour surveiller des logs.","why":"`-f` (follow) garde le fichier ouvert et affiche chaque nouvelle ligne dès qu'elle est écrite. Idéal pour regarder les logs d'une appli en direct ; on quitte avec Ctrl+C.","wx":["Afficher en entier, c'est `cat`.","`-f` ici veut dire « follow », pas « force ».","Les premières lignes, c'est `head`."]},{"id":"linux-f2-5","q":"Que fait `wc -l fichier` ?","a":"Compte le nombre de lignes","w":["Compte le nombre de mots","Affiche la largeur du fichier","Liste les liens du fichier"],"why":"`wc` (word count) compte lignes, mots et octets ; `-l` limite le résultat au nombre de lignes. Souvent utilisé en pipe : `grep erreur app.log | wc -l`.","wx":["Les mots, c'est `wc -w`.","`wc` ne mesure pas de largeur ; `-L` donne la longueur de la plus longue ligne.","`wc` ne s'occupe pas des liens."]},{"id":"linux-f2-6","q":"Que fait `grep -i linux system.log` ?","a":"Cherche « linux » en ignorant majuscules/minuscules","w":["Cherche « linux » dans tous les fichiers du dossier","Affiche les lignes qui ne contiennent pas « linux »","Affiche les numéros de lignes"],"why":"`-i` (ignore case) rend la recherche insensible à la casse : « linux », « Linux » et « LINUX » sont tous trouvés.","wx":["Chercher dans tous les fichiers du dossier, c'est `-r`.","Inverser la recherche, c'est `-v`.","Les numéros de lignes, c'est `-n`."]},{"id":"linux-f2-7","q":"Que fait `grep -v Linux system.log` ?","a":"Affiche les lignes qui ne contiennent PAS « Linux »","w":["Affiche la version de grep","Affiche les lignes avec leur numéro","Cherche en mode verbeux"],"why":"`-v` (invert) inverse la recherche : grep affiche toutes les lignes qui ne contiennent pas le mot. Pratique pour filtrer du bruit, par exemple `grep -v DEBUG app.log`.","wx":["La version, c'est `grep --version` (`-V` en majuscule).","Les numéros de lignes, c'est `-n`.","Ici, `-v` ne veut pas dire « verbose »."]},{"id":"linux-f2-8","q":"Que fait `grep -n Linux system.log` ?","a":"Affiche les lignes trouvées avec leur numéro","w":["Compte le nombre de lignes trouvées","Affiche les lignes sans le mot","Cherche sans tenir compte de la casse"],"why":"`-n` ajoute le numéro de chaque ligne trouvée devant celle-ci, par exemple « 42:Linux démarre ». Utile pour ensuite ouvrir le fichier au bon endroit.","wx":["Compter les correspondances, c'est `-c`.","Afficher les lignes sans le mot, c'est `-v`.","Ignorer la casse, c'est `-i`."]},{"id":"linux-f2-9","q":"Que fait `grep -r \"mot\" .` ?","a":"Cherche « mot » dans tous les fichiers du dossier actuel","w":["Remplace « mot » dans tous les fichiers","Cherche « mot » en partant de la racine /","Cherche les fichiers nommés « mot »"],"why":"`-r` (récursif) fait chercher grep dans tous les fichiers du dossier indiqué et de ses sous-dossiers. Le `.` désigne le dossier courant.","wx":["grep cherche et affiche, il ne modifie rien. Pour remplacer, on utilise `sed`.","Le point `.` veut dire « ici », pas la racine `/`.","Chercher par nom de fichier, c'est `find -name`. grep cherche dans le contenu."]},{"id":"linux-f2-10","q":"Avec `find`, quelle option limite la recherche aux dossiers ?","a":"-type d","w":["-type f","-dir","-name d"],"x":"-type f limite aux fichiers.","why":"`-type d` (directory) limite les résultats aux dossiers. `-type f` les limite aux fichiers ordinaires.","wx":["`-type f` donne les fichiers, pas les dossiers.","`-dir` n'existe pas dans find.","`-name d` chercherait un élément nommé exactement « d »."]},{"id":"linux-f2-11","q":"Que trouve `find -name \"*.log\" -mmin -120` ?","a":"Les fichiers .log modifiés dans les 2 dernières heures","w":["Les fichiers .log de moins de 120 Ko","Les fichiers .log accédés il y a plus de 120 jours","Les 120 premiers fichiers .log"],"why":"`-mmin` compte en minutes depuis la dernière modification ; le `-` devant 120 veut dire « moins de ». Donc : modifiés il y a moins de 120 minutes, soit 2 heures.","wx":["La taille se filtre avec `-size`.","L'accès en jours, c'est `-atime`. Ici c'est `-mmin`, modification en minutes, et `-120` veut dire moins de 120.","find n'a pas d'option pour limiter le nombre de résultats ; on utilise `| head -120`."]},{"id":"linux-f2-12","q":"Que fait `find -name \"*.log\" -exec chmod 600 {} \\;` ?","a":"Applique chmod 600 à chaque fichier .log trouvé","w":["Affiche les droits des fichiers .log","Supprime les fichiers .log de plus de 600 octets","Cherche les fichiers ayant les droits 600"],"why":"`-exec` lance une commande sur chaque résultat ; `{}` est remplacé par le nom du fichier trouvé et `\\;` termine la commande. Chaque .log reçoit donc les droits 600 (rw pour le propriétaire seulement).","wx":["Afficher les droits, ce serait `-exec ls -l {} \\;` ou `-ls`.","Rien n'est supprimé, et 600 est un mode de droits, pas une taille.","Chercher par droits, c'est `-perm 600`."]},{"id":"linux-f2-13","q":"Sur quoi s'appuie la commande `locate` ?","a":"Une base de données, mise à jour avec updatedb","w":["Un parcours en direct de tout le disque","Le cache du navigateur","L'historique des commandes"],"why":"`locate` interroge une base de données qui indexe les fichiers : c'est très rapide, mais elle peut être en retard. On la met à jour avec `updatedb`.","wx":["Le parcours en direct, c'est `find`. C'est plus lent mais toujours à jour.","Aucun rapport avec le navigateur.","L'historique des commandes, c'est `history`."]}]},{"title":"Traiter du texte","src":"fiche","qs":[{"id":"linux-f3-1","q":"Que fait `sort -r nom.txt` ?","a":"Trie les lignes dans l'ordre inverse","w":["Trie et modifie le fichier","Supprime les lignes en double","Trie récursivement les fichiers d'un dossier"],"why":"`sort` trie les lignes par ordre alphabétique ; `-r` (reverse) inverse l'ordre, de Z à A.","wx":["sort n'écrit jamais dans le fichier, sauf avec `-o`.","Supprimer les doublons, c'est `-u` (ou `uniq`).","sort trie des lignes de texte, pas des fichiers dans un dossier."]},{"id":"linux-f3-2","q":"La commande `sort nom.txt` modifie-t-elle le fichier ?","a":"Non, elle affiche seulement le résultat trié","w":["Oui, le fichier est réécrit trié","Oui, mais seulement avec les droits root","Non, elle crée automatiquement nom.sorted"],"why":"sort lit le fichier et affiche le résultat trié à l'écran ; le fichier d'origine ne change pas. Pour garder le résultat : `sort nom.txt > trie.txt` ou `sort -o trie.txt nom.txt`.","wx":["Le fichier reste intact, sauf si tu rediriges ou utilises `-o`.","Les droits root ne changent pas ce comportement.","sort ne crée aucun fichier tout seul."]},{"id":"linux-f3-3","q":"Que fait `sed '2,4 d' sed.txt` ?","a":"Affiche le fichier sans les lignes 2 à 4","w":["Affiche uniquement les lignes 2 à 4","Supprime définitivement les lignes 2 à 4 du fichier","Supprime les lignes 2 et 4 seulement"],"why":"Dans sed, `2,4` désigne la plage de lignes 2 à 4 et `d` veut dire delete : ces lignes sont retirées de l'affichage. Sans `-i`, le fichier reste intact.","wx":["Afficher uniquement ces lignes, c'est `sed -n '2,4p'`.","Sans `-i`, sed ne modifie pas le fichier ; il affiche seulement le résultat.","Les lignes 2 et 4 seules s'écriraient `'2d;4d'`. Avec la virgule, c'est une plage."]},{"id":"linux-f3-4","q":"Que fait `sed -n '1,4p' sed.txt` ?","a":"Affiche uniquement les lignes 1 à 4","w":["Affiche tout sauf les lignes 1 à 4","Imprime 4 copies du fichier","Numérote les lignes 1 à 4"],"why":"`-n` empêche sed d'afficher chaque ligne automatiquement ; `1,4p` imprime (print) seulement les lignes 1 à 4. C'est l'équivalent de `head -n 4`.","wx":["Tout sauf 1 à 4, c'est `sed '1,4d'`.","`4` ici est un numéro de ligne, pas un nombre de copies.","Numéroter les lignes, c'est `cat -n` ou `nl`."]},{"id":"linux-f3-5","q":"Que fait `sed 's/Ligne/test/g' sed.txt` ?","a":"Remplace toutes les occurrences de « Ligne » par « test »","w":["Remplace seulement la première occurrence par ligne","Supprime toutes les lignes contenant « Ligne »","Cherche « Ligne » et « test »"],"x":"Le g final = global (toutes les occurrences).","why":"`s/ancien/nouveau/` substitue un texte ; le `g` final (global) remplace toutes les occurrences de chaque ligne, pas seulement la première.","wx":["Sans le `g`, seule la première occurrence de chaque ligne serait remplacée. Ici le `g` est présent.","Supprimer des lignes, c'est la commande `d`, pas `s`.","`s` remplace, il ne cherche pas deux mots."]},{"id":"linux-f3-6","q":"Que fait `sed -n '/^L/!p' sed.txt` ?","a":"Affiche les lignes qui ne commencent PAS par L","w":["Affiche les lignes qui commencent par L","Supprime la lettre L de chaque ligne","Affiche les lignes qui finissent par L"],"why":"`/^L/` sélectionne les lignes qui commencent par L (`^` = début de ligne) ; `!` inverse la sélection et `p` imprime. Avec `-n`, seules les lignes qui ne commencent pas par L s'affichent.","wx":["Ce serait `sed -n '/^L/p'`, sans le `!`.","Supprimer une lettre, ce serait une substitution : `s/L//`.","La fin de ligne se note `$` (`/L$/`). `^` désigne le début."]},{"id":"linux-f3-7","q":"Que fait `awk '{print $1}' etudiant.txt` ?","a":"Affiche la première colonne de chaque ligne","w":["Affiche la première ligne","Affiche le premier caractère du fichier","Compte les colonnes"],"why":"awk découpe chaque ligne en colonnes (séparées par des espaces par défaut) ; `$1` est la première colonne. `print $1` l'affiche pour chaque ligne.","wx":["La première ligne, c'est `awk 'NR==1'`.","awk travaille par colonnes, pas par caractères.","Le nombre de colonnes, c'est `NF`."]},{"id":"linux-f3-8","q":"Que fait `awk 'NR==3' etudiant.txt` ?","a":"Affiche la troisième ligne","w":["Affiche la troisième colonne","Affiche les 3 premières lignes","Affiche les lignes de plus de 3 caractères"],"why":"`NR` (Number of Record) est le numéro de la ligne en cours. `NR==3` est vrai seulement à la ligne 3, qui est alors affichée.","wx":["La troisième colonne, c'est `{print $3}`.","Les 3 premières lignes, ce serait `NR<=3`.","La longueur se teste avec `length($0)>3`."]},{"id":"linux-f3-9","q":"Que fait `awk -F: '{print $1,$6}' /etc/passwd` ?","a":"Affiche le nom d'utilisateur et son répertoire home, avec « : » comme séparateur","w":["Affiche les lignes 1 à 6 du fichier","Modifie le séparateur du fichier passwd","Affiche les mots de passe des utilisateurs"],"why":"`-F:` définit `:` comme séparateur, puisque /etc/passwd sépare ses champs par des deux-points. Le champ 1 est le nom d'utilisateur, le champ 6 son répertoire home.","wx":["`$1` et `$6` sont des colonnes, pas des lignes.","awk lit et affiche ; il ne modifie pas le fichier.","Les mots de passe chiffrés ne sont plus dans /etc/passwd (il y a un « x ») mais dans /etc/shadow, et le champ 6 est le home."]},{"id":"linux-f3-10","q":"Que fait `du -h | sort -nr` ?","a":"Affiche la taille des dossiers, du plus grand au plus petit","w":["Trie les fichiers par nom","Affiche l'espace libre des partitions","Supprime les dossiers les plus lourds"],"why":"`du -h` donne la taille de chaque dossier, `|` envoie le résultat à `sort`, et `-nr` trie numériquement (`-n`) en ordre décroissant (`-r`). Les plus gros dossiers arrivent en tête. Pour un tri fiable avec des tailles comme 1K et 2G, on utilise `sort -hr`.","wx":["`du` mesure des tailles et `-n` trie des nombres, pas des noms.","L'espace libre des partitions, c'est `df -h`.","Aucune de ces commandes ne supprime quoi que ce soit."]}]},{"title":"Permissions et utilisateurs","src":"fiche","qs":[{"id":"linux-f4-1","q":"Que fait `chmod +x script.sh` ?","a":"Rend le script exécutable","w":["Donne tous les droits à tout le monde","Change le propriétaire du script","Supprime les droits d'écriture"],"why":"`+x` ajoute le droit d'exécution. Sans lettre devant (u, g ou o), il s'applique à tous, en tenant compte de umask. Ensuite tu peux lancer `./script.sh`.","wx":["Tous les droits à tous, c'est `chmod 777`. `+x` n'ajoute que l'exécution.","Changer le propriétaire, c'est `chown`.","Retirer l'écriture, c'est `-w`."]},{"id":"linux-f4-2","q":"En octal, combien vaut le droit d'écriture (w) ?","a":"2","w":["1","4","7"],"x":"r = 4, w = 2, x = 1.","why":"En octal : r = 4, w = 2, x = 1. On additionne : rw = 4 + 2 = 6, rwx = 7.","wx":["1, c'est x (exécution).","4, c'est r (lecture).","7, c'est rwx (4 + 2 + 1), tous les droits."]},{"id":"linux-f4-3","q":"Que donne `chmod 755 fichier` ?","a":"rwx pour le propriétaire, r-x pour le groupe et les autres","w":["rwx pour tout le monde","rw- pour le propriétaire, r-- pour les autres","r-x pour le propriétaire, rwx pour les autres"],"why":"Chaque chiffre correspond à un bloc : propriétaire, groupe, autres. 7 = rwx, 5 = r-x (4 + 1). Donc rwx pour le propriétaire et r-x pour le groupe et les autres. C'est typique d'un script ou d'un dossier partagé.","wx":["rwx pour tous, ce serait 777.","rw- / r--, ce serait 644.","L'ordre est toujours propriétaire, groupe, autres : le 7 est au propriétaire."]},{"id":"linux-f4-4","q":"Que donne `chmod 770 script.sh` ?","a":"Tous les droits au propriétaire et au groupe, aucun aux autres","w":["Tous les droits à tout le monde","Lecture seule pour tous","Tous les droits au propriétaire uniquement"],"why":"7 = rwx pour le propriétaire, 7 = rwx pour le groupe, 0 = rien pour les autres. Le fichier est complètement fermé aux personnes extérieures au groupe.","wx":["Tous les droits à tous, c'est 777. Ici le dernier chiffre est 0.","Lecture seule pour tous, ce serait 444.","Le propriétaire seul, ce serait 700. Ici le groupe a aussi 7."]},{"id":"linux-f4-5","q":"Propriétaire : tous les droits, groupe : lecture + exécution, autres : lecture. Quelle commande ?","a":"chmod 754","w":["chmod 764","chmod 745","chmod 751"],"x":"7 = rwx, 5 = r-x, 4 = r--. C'est l'exercice de ta fiche.","why":"Propriétaire rwx = 4 + 2 + 1 = 7 ; groupe r-x = 4 + 1 = 5 ; autres r-- = 4. Ce qui donne 754.","wx":["764 donnerait rw- au groupe (6 = 4 + 2), pas r-x.","745 inverse les deux derniers blocs : r-- au groupe et r-x aux autres.","751 donnerait seulement x aux autres (1), au lieu de r."]},{"id":"linux-f4-6","q":"Sur un DOSSIER, que permet le droit x ?","a":"Traverser le dossier (y entrer)","w":["Exécuter tous les fichiers du dossier","Lister le contenu du dossier","Supprimer le dossier"],"why":"Sur un dossier, x permet de le traverser : y entrer avec `cd` et accéder aux fichiers dont tu connais le nom. Sans x, tu ne peux pas y entrer même si tu as r.","wx":["Le x du dossier ne rend pas exécutables les fichiers qu'il contient : chaque fichier a ses propres droits.","Lister le contenu, c'est le droit r du dossier.","Supprimer un dossier dépend du droit w de son dossier parent."]},{"id":"linux-f4-7","q":"Sur un DOSSIER, que permet le droit w ?","a":"Créer, supprimer et renommer les fichiers à l'intérieur","w":["Modifier le contenu des fichiers à l'intérieur","Traverser le dossier","Lister le contenu"],"why":"Sur un dossier, w permet de modifier sa liste de fichiers : créer, supprimer, renommer des entrées. C'est pourquoi on peut supprimer un fichier en lecture seule si on a w sur son dossier.","wx":["Modifier le contenu d'un fichier dépend du w du fichier lui-même.","Traverser, c'est le droit x.","Lister, c'est le droit r."]},{"id":"linux-f4-8","q":"Que fait `chown etl:etl script.sh` ?","a":"Change le propriétaire ET le groupe du fichier","w":["Change seulement le groupe","Change les droits du fichier","Crée l'utilisateur etl"],"why":"La syntaxe `utilisateur:groupe` change les deux à la fois : etl devient propriétaire et etl devient le groupe du fichier.","wx":["Pour le groupe seul, on écrit `chown :etl` ou `chgrp etl`.","Changer les droits, c'est `chmod`.","Créer un utilisateur, c'est `adduser` ou `useradd`."]},{"id":"linux-f4-9","q":"Quelle option de chown applique le changement à tout un dossier ?","a":"-R","w":["-r","-a","-all"],"why":"Pour chown (comme chmod et chgrp), l'option récursive est `-R` en majuscule : elle s'applique au dossier et à tout son contenu.","wx":["Avec chown, `-r` en minuscule n'est pas l'option récursive. Contrairement à cp et rm, c'est `-R`.","`-a` n'existe pas pour chown.","`-all` n'existe pas."]},{"id":"linux-f4-10","q":"Que montre `umask` ?","a":"Les permissions par défaut appliquées à la création","w":["La liste des utilisateurs","Les droits d'un fichier précis","Le masque réseau"],"why":"umask définit les droits retirés par défaut à la création des fichiers et dossiers. Avec umask 022, un nouveau fichier est en 644 et un dossier en 755.","wx":["Les utilisateurs se trouvent dans /etc/passwd.","Les droits d'un fichier précis s'affichent avec `ls -l`.","Le masque réseau s'affiche avec `ip a`. Ici « mask » parle de permissions."]},{"id":"linux-f4-11","q":"Que fait `usermod -G sudo etl` (sans -a) ?","a":"Ajoute etl au groupe sudo et le retire de ses autres groupes","w":["Ajoute etl au groupe sudo en gardant ses autres groupes","Retire etl du groupe sudo","Crée le groupe sudo"],"x":"Avec -aG, il garde ses anciens groupes.","why":"`-G` remplace la liste des groupes secondaires de l'utilisateur par celle donnée. Sans `-a` (append), etl perd tous ses autres groupes. C'est un piège classique.","wx":["Garder les autres groupes, c'est justement `usermod -aG`.","Retirer d'un groupe, c'est `gpasswd -d etl sudo` ou `deluser etl sudo`.","Créer un groupe, c'est `groupadd` ou `addgroup`."]},{"id":"linux-f4-12","q":"Que fait `deluser etl admin` ?","a":"Retire etl du groupe admin","w":["Supprime l'utilisateur etl","Supprime le groupe admin","Retire tous les droits admin du système"],"why":"Avec deux arguments, `deluser utilisateur groupe` retire seulement l'utilisateur du groupe ; le compte reste intact.","wx":["Supprimer l'utilisateur, c'est `deluser etl`, avec un seul argument.","Supprimer le groupe, c'est `delgroup admin`.","La commande ne touche qu'à un utilisateur et un groupe."]},{"id":"linux-f4-13","q":"Quelle est la différence entre `adduser` et `useradd` ?","a":"adduser est interactif, useradd est la commande brute","w":["useradd est interactif, adduser est la commande brute","adduser crée un groupe, useradd un utilisateur","Aucune, ce sont des alias"],"why":"`adduser` (Debian/Ubuntu) est un script convivial : il pose des questions, crée le home et demande un mot de passe. `useradd` est la commande de bas niveau : il faut tout préciser avec des options.","wx":["C'est l'inverse : c'est adduser qui est interactif.","Les deux créent des utilisateurs ; pour les groupes, c'est `addgroup` ou `groupadd`.","Ce sont deux programmes différents au comportement différent."]},{"id":"linux-f4-14","q":"Quel fichier contient la liste des utilisateurs ?","a":"/etc/passwd","w":["/etc/shadow-users","/etc/group","/home/users"],"why":"/etc/passwd liste les comptes : nom, UID, GID, home, shell. Les mots de passe chiffrés sont à part, dans /etc/shadow.","wx":["Le vrai fichier s'appelle /etc/shadow et il contient les mots de passe chiffrés, pas la liste des comptes.","/etc/group liste les groupes.","/home contient les dossiers personnels, pas une liste d'utilisateurs."]},{"id":"linux-f4-15","q":"Que fait la commande `w` ?","a":"Montre qui est connecté et ce qu'ils font","w":["Affiche ton nom d'utilisateur","Ouvre l'éditeur de texte","Affiche les fenêtres ouvertes"],"why":"`w` affiche les utilisateurs connectés et ce qu'ils exécutent, avec la charge du système. C'est la version détaillée de `who`.","wx":["Ton nom d'utilisateur, c'est `whoami`.","Les éditeurs sont `nano` ou `vim`.","`w` n'a rien à voir avec les fenêtres graphiques."]}]},{"title":"Processus et système","src":"fiche","qs":[{"id":"linux-f5-1","q":"Que fait `kill -9 <PID>` ?","a":"Tue le processus de force (SIGKILL)","w":["Met le processus en pause","Arrête proprement le processus après 9 secondes","Tue les 9 premiers processus"],"why":"`-9` envoie le signal SIGKILL : le noyau tue le processus immédiatement, sans lui laisser le temps de se fermer proprement. À utiliser quand un simple `kill` (SIGTERM) ne suffit pas.","wx":["La pause, c'est SIGSTOP (`kill -STOP`) ou Ctrl+Z.","`9` est le numéro du signal, pas un délai ; et SIGKILL n'est justement pas « propre ».","Le PID désigne un seul processus ; 9 est le signal."]},{"id":"linux-f5-2","q":"Quelle commande tue un processus par son nom ?","a":"pkill","w":["kill -n","ps -k","stop"],"why":"`pkill nom` cherche les processus par leur nom et leur envoie un signal, sans que tu aies besoin du PID. `killall` fait la même chose.","wx":["`kill` attend un PID ; `-n` n'est pas une option pour cibler un nom.","`ps` affiche les processus, il n'en tue pas.","`stop` n'est pas une commande standard pour tuer un processus."]},{"id":"linux-f5-3","q":"Que fait `top &` ?","a":"Lance top en arrière-plan","w":["Lance top avec les droits root","Lance deux instances de top","Arrête top"],"why":"Le `&` à la fin d'une commande la lance en arrière-plan : tu récupères ton terminal tout de suite. Tu la retrouves avec `jobs`, et `fg` la ramène.","wx":["Les droits root, c'est `sudo`.","Un seul processus est lancé.","Arrêter, c'est `kill` ou `q` dans top."]},{"id":"linux-f5-4","q":"Quelle commande ramène une tâche au premier plan ?","a":"fg","w":["bg","jobs","front"],"x":"bg l'envoie en arrière-plan, jobs liste les tâches.","why":"`fg` (foreground) ramène au premier plan une tâche en arrière-plan ou suspendue avec Ctrl+Z.","wx":["`bg` fait l'inverse : il relance la tâche en arrière-plan.","`jobs` liste les tâches sans les déplacer.","`front` n'existe pas."]},{"id":"linux-f5-5","q":"Que fait `du -sh dossier` ?","a":"Affiche la taille totale du dossier","w":["Affiche l'espace libre du disque","Supprime le dossier","Affiche les droits du dossier"],"why":"`du` mesure l'espace disque utilisé ; `-s` (summary) donne un seul total au lieu du détail de chaque sous-dossier, et `-h` le rend lisible (ex : 2,3G).","wx":["L'espace libre du disque, c'est `df -h`.","du ne supprime rien, il mesure.","Les droits s'affichent avec `ls -ld dossier`."]},{"id":"linux-f5-6","q":"Quelle commande affiche la RAM utilisée et disponible ?","a":"free -h","w":["df -h","ram -s","lscpu"],"why":"`free` affiche la mémoire vive (RAM) et le swap ; `-h` les met en Mo ou Go lisibles.","wx":["`df -h` montre l'espace disque, pas la RAM.","`ram` n'est pas une commande standard.","`lscpu` décrit le processeur."]},{"id":"linux-f5-7","q":"Que fait `uname -a` ?","a":"Affiche les infos sur le noyau et le système","w":["Affiche ton nom d'utilisateur","Liste tous les utilisateurs","Affiche l'adresse IP"],"why":"`uname` affiche les infos du système ; `-a` (all) montre tout : nom du noyau, version, architecture (x86_64), nom de la machine.","wx":["Ton nom d'utilisateur, c'est `whoami`.","Les utilisateurs sont dans /etc/passwd ; les connectés, c'est `who`.","L'adresse IP, c'est `ip a`."]},{"id":"linux-f5-8","q":"Que fait `shutdown -r now` ?","a":"Redémarre immédiatement le système","w":["Arrête le système dans 1 minute","Annule un arrêt programmé","Met le système en veille"],"why":"`-r` = reboot et `now` = tout de suite : la machine redémarre immédiatement.","wx":["Sans heure, shutdown attend 1 minute ; ici `now` force l'immédiat, et `-r` redémarre au lieu d'arrêter.","Annuler un arrêt programmé, c'est `shutdown -c`.","La veille, c'est `systemctl suspend`."]},{"id":"linux-f5-9","q":"Que fait `umount /mnt` ?","a":"Démonte le disque monté sur /mnt","w":["Supprime le dossier /mnt","Formate /mnt","Monte un disque sur /mnt"],"why":"`umount` (sans « n ») détache le disque du point de montage /mnt : ses fichiers n'y sont plus accessibles et on peut le retirer sans risque.","wx":["Le dossier /mnt reste ; seul le disque est détaché.","Formater, c'est `mkfs`.","Monter, c'est `mount`, l'inverse."]},{"id":"linux-f5-10","q":"Avec `ps`, que fait l'option x ?","a":"Affiche aussi les processus non liés à un terminal","w":["Affiche les processus en arborescence","Tue les processus","Affiche uniquement les processus root"],"why":"Avec ps, `x` inclut les processus sans terminal : les démons et services lancés au démarrage. D'où `ps aux` pour tout voir.","wx":["L'arborescence, c'est l'option `f` (ex : `ps auxf`) ou `pstree`.","ps n'arrête aucun processus ; c'est le rôle de `kill`.","Filtrer par utilisateur se fait avec `-u root`."]},{"id":"linux-f5-11","q":"Quelle commande est la version améliorée de top ?","a":"htop","w":["topx","ps aux","uptop"],"why":"`htop` est une version améliorée de `top` : couleurs, défilement, tri à la souris, et on tue un processus avec F9. Il faut souvent l'installer.","wx":["`topx` n'existe pas.","`ps aux` donne une photo fixe, pas un moniteur en temps réel.","`uptop` n'existe pas."]}]},{"title":"Réseau et archives","src":"fiche","qs":[{"id":"linux-f6-1","q":"Que fait `ping -c 4 8.8.8.8` ?","a":"Envoie seulement 4 tests de connectivité","w":["Teste 4 adresses différentes","Attend 4 secondes entre chaque test","Teste le port 4"],"why":"`-c` (count) limite le nombre de paquets envoyés : ici 4, puis ping s'arrête avec un résumé. Sans `-c`, ping tourne jusqu'à Ctrl+C sous Linux.","wx":["Une seule adresse est testée : 8.8.8.8.","L'intervalle se règle avec `-i`.","ping utilise ICMP, qui n'a pas de port."]},{"id":"linux-f6-2","q":"Quelle est l'alternative moderne à `netstat` ?","a":"ss","w":["ip","nc","iftop"],"why":"`ss` (socket statistics) remplace `netstat` : il est plus rapide et accepte les mêmes options, comme `ss -tuln` pour les ports ouverts.","wx":["`ip` remplace `ifconfig` (interfaces), pas netstat.","`nc` (netcat) ouvre des connexions, il ne liste pas les sockets.","`iftop` mesure le débit en temps réel."]},{"id":"linux-f6-3","q":"Que montre `netstat -tuln` ?","a":"Les ports ouverts en TCP et UDP","w":["Les utilisateurs connectés","Les interfaces réseau","L'historique réseau"],"why":"`-t` = TCP, `-u` = UDP, `-l` = ports en écoute, `-n` = numéros bruts sans résolution de noms. Tu vois les ports ouverts sur la machine.","wx":["Les utilisateurs connectés, c'est `who`.","Les interfaces réseau, c'est `ip a`.","netstat ne garde aucun historique."]},{"id":"linux-f6-4","q":"Que fait `scp fichier user@ip:/chemin` ?","a":"Copie un fichier vers une autre machine via SSH","w":["Se connecte à distance en SSH","Télécharge un fichier depuis internet","Synchronise deux dossiers locaux"],"why":"`scp` (secure copy) copie un fichier vers une autre machine en passant par SSH. La partie `user@ip:/chemin` désigne la destination distante.","wx":["Se connecter à distance, c'est `ssh user@ip`.","Télécharger depuis internet, c'est `wget` ou `curl`.","Synchroniser deux dossiers locaux, c'est `rsync` ou `cp`."]},{"id":"linux-f6-5","q":"Quelle commande télécharge un fichier depuis internet ?","a":"wget","w":["ssh","scp","ping"],"why":"`wget URL` télécharge le fichier et l'enregistre dans le dossier courant. `curl -O URL` fait la même chose.","wx":["`ssh` ouvre une session sur une machine distante.","`scp` copie entre machines via SSH, pas depuis un site web.","`ping` teste seulement la connectivité."]},{"id":"linux-f6-6","q":"Que fait `tar -czvf archive.tar.gz dossier` ?","a":"Crée une archive compressée en gzip","w":["Extrait une archive .tar.gz","Liste le contenu d'une archive","Crée une archive sans compression"],"why":"`-c` = créer, `-z` = compresser en gzip, `-v` = afficher les fichiers traités, `-f` = nom de l'archive. Résultat : archive.tar.gz.","wx":["Extraire, c'est `-x` à la place de `-c`.","Lister le contenu, c'est `-t`.","Sans compression, il faudrait retirer `-z`."]},{"id":"linux-f6-7","q":"Que fait `tar -xzvf archive.tar.gz` ?","a":"Extrait une archive .tar.gz","w":["Crée une archive .tar.gz","Compresse un dossier en zip","Vérifie l'intégrité de l'archive"],"why":"`-x` = extraire, `-z` = l'archive est en gzip, `-v` = verbeux, `-f` = nom de l'archive. Les fichiers sont décompressés dans le dossier courant.","wx":["Créer, c'est `-c`.","Le format zip se gère avec `zip` et `unzip`.","Il n'y a pas de vérification d'intégrité ici, seulement une extraction."]},{"id":"linux-f6-8","q":"Que fait `tar -tvf system.tar.gz` ?","a":"Affiche le contenu de l'archive sans l'extraire","w":["Teste la vitesse de décompression","Extrait l'archive dans /tmp","Supprime l'archive après lecture"],"why":"`-t` (list) affiche la liste des fichiers contenus dans l'archive sans rien extraire. Pratique pour vérifier avant de décompresser.","wx":["`-t` ne veut pas dire « test de vitesse ».","Rien n'est extrait, et /tmp n'apparaît nulle part.","tar ne supprime jamais l'archive."]},{"id":"linux-f6-9","q":"Dans tar, quelle option utilise l'algorithme xz ?","a":"-J","w":["-j","-z","-x"],"x":"-z = gzip, -j = bzip2, -J = xz.","why":"Pour tar : `-z` = gzip (.gz), `-j` = bzip2 (.bz2), `-J` (majuscule) = xz (.xz).","wx":["`-j` minuscule, c'est bzip2.","`-z`, c'est gzip.","`-x`, c'est extraire."]},{"id":"linux-f6-10","q":"Dans tar, à quoi sert l'option -C data/ ?","a":"Extraire dans le dossier data/","w":["Compresser le dossier data/","Créer le dossier data/","Copier l'archive dans data/"],"why":"`-C dossier` (change directory) fait travailler tar dans ce dossier : l'archive est extraite dans data/. Le dossier doit déjà exister.","wx":["`-C` ne compresse rien ; la compression vient de `-z`, `-j` ou `-J`.","tar ne crée pas le dossier ; il faut le faire avant avec `mkdir`.","L'archive n'est pas copiée : on extrait son contenu à cet endroit."]},{"id":"linux-f6-11","q":"Dans tar, à quoi sert l'option -f ?","a":"Préciser le nom du fichier d'archive","w":["Forcer l'écrasement","Filtrer les fichiers","Faire une archive rapide"],"why":"`-f` (file) est suivi du nom de l'archive à créer ou à lire. Sans lui, tar utiliserait l'entrée ou la sortie standard. On le met en dernier : `-czvf nom.tar.gz`.","wx":["Ici `-f` veut dire file, pas force.","Filtrer se fait avec `--exclude`.","Il n'existe pas de mode « rapide » avec `-f`."]}]},{"title":"Quiz de formation 1/2","src":"quiz","qs":[{"id":"linux-01","q":"Un système d'exploitation est :","a":"intermédiaire entre la machine et l'user","w":["nom du processeur central de l'ordinateur","fonction de l'admin système"],"why":"Le système d'exploitation fait le lien entre le matériel (CPU, RAM, disque) et l'utilisateur ou ses programmes : il partage les ressources et fournit les commandes.","wx":["Le processeur est du matériel ; l'OS est du logiciel.","L'administrateur système gère l'OS, mais l'OS n'est pas son métier."]},{"id":"linux-02","q":"Linux c'est","a":"un système d'exploitation au format libre","w":["un système d'exploitation fonctionnant sur Macintosh","un système d'exploitation fonctionnant sur pc"],"why":"Linux est un système d'exploitation libre et open source : on peut l'utiliser, l'étudier, le modifier et le redistribuer.","wx":["Linux n'est pas spécifique au Macintosh, qui utilise macOS.","Linux tourne sur PC, mais aussi sur des serveurs, des téléphones (Android) et des objets connectés : il ne se limite pas au PC."]},{"id":"linux-03","q":"Quelles sont les distributions Unix serveur les plus utilisées dans l'entreprise","a":"Debian","w":["Redhat","Ubuntu","CentOs","Slackware"],"x":"C'est le corrigé de ta formation. En entreprise, Red Hat (RHEL) et Ubuntu sont aussi très répandues.","why":"Selon le corrigé de ta formation, la réponse attendue est Debian, très présente sur les serveurs pour sa stabilité.","wx":["Red Hat (RHEL) est aussi très utilisé en entreprise, mais ce n'est pas la réponse attendue par ce quiz.","Ubuntu est basée sur Debian et très répandue dans le cloud, mais le quiz attendait Debian.","CentOS, clone gratuit de RHEL, a été arrêté en 2024 au profit de CentOS Stream.","Slackware est une distribution historique, peu utilisée en entreprise."]},{"id":"linux-04","q":"un système monotache :","a":"contient en mémoire la tache en cours d'exécution","w":["n'utilise pas de système d'exploitation","a pour seule tache le système d'exploitation"],"why":"Un système monotâche n'exécute qu'un programme à la fois : seule la tâche en cours est chargée en mémoire. MS-DOS en est un exemple.","wx":["Un système monotâche reste un système d'exploitation.","L'OS sert à exécuter les programmes de l'utilisateur ; ce n'est pas sa seule tâche."]},{"id":"linux-05","q":"Quelle commande permet de vérifier les adresses IP et la configuration des interfaces réseau sur un système Linux moderne ?","a":"ip a","w":["netstat","ifconfig","ps aux"],"why":"`ip a` (ip address) affiche les interfaces réseau et leurs adresses IP. C'est l'outil moderne du paquet iproute2, qui remplace ifconfig.","wx":["netstat montre les connexions et les ports, pas la configuration des interfaces.","ifconfig marche encore, mais il est obsolète ; sur un système moderne, la réponse attendue est `ip a`.","ps aux liste les processus."]},{"id":"linux-06","q":"Que fait la commande lsblk ?","a":"Liste les périphériques de stockage et leurs partitions sur le système.","w":["Affiche les processus en cours sur le système.","Affiche les fichiers dans le répertoire courant","Crée une partition sur un disque."],"why":"`lsblk` (list block devices) affiche les disques et leurs partitions sous forme d'arbre : sda, sda1, sda2… avec leur taille et leur point de montage.","wx":["Les processus, c'est `ps` ou `top`.","Les fichiers du dossier courant, c'est `ls`.","Créer une partition, c'est `fdisk` ou `parted`."]},{"id":"linux-07","q":"Une tache est :","a":"une exécution de programme","w":["un processus","logiciel de divertissement","un mouvement de données"],"why":"Une tâche, c'est un programme en cours d'exécution. Le système peut en gérer une (monotâche) ou plusieurs (multitâche).","wx":["Le corrigé fait la nuance : un processus est la structure de l'OS qui porte l'exécution. La réponse attendue est la définition générale : une exécution de programme.","Rien à voir avec les jeux.","Un mouvement de données est une opération, pas une tâche au sens de l'OS."]},{"id":"linux-08","q":"Que fait la commande df -h ?","a":"Affiche l'espace disque utilisé et disponible sur les systèmes de fichiers montés, dans un format lisible par l'homme.","w":["Liste les fichiers dans le répertoire courant.","Affiche l'utilisation de la mémoire vive.","Formate un disque pour un système de fichiers."],"why":"`df` (disk free) affiche l'espace utilisé et disponible de chaque système de fichiers monté ; `-h` met les tailles en Go ou Mo lisibles.","wx":["Lister les fichiers, c'est `ls`.","La mémoire vive, c'est `free -h`.","Formater, c'est `mkfs`."]},{"id":"linux-09","q":"Que fait la commande usermod -aG wheel rpc ?","a":"Ajoute l'utilisateur rpc au groupe wheel sans le retirer des autres groupes auxquels il appartient déjà.","w":["Modifie le mot de passe de l'utilisateur rpc.","Supprime l'utilisateur rpc du groupe wheel.","Ajoute l'utilisateur rpc au groupe sudo pour lui donner des droits d'exécution."],"why":"`-a` (append) combiné à `-G` ajoute rpc au groupe wheel en gardant ses groupes actuels. Sur Red Hat, wheel est le groupe des administrateurs autorisés à utiliser sudo.","wx":["Le mot de passe, c'est `passwd rpc`.","Retirer d'un groupe, c'est `gpasswd -d rpc wheel`.","Le groupe visé est wheel, pas sudo (son équivalent sur Debian/Ubuntu)."]},{"id":"linux-10","q":"netstat -t","a":"Afficher les connexions TCP uniquement","w":["Afficher les interfaces réseau","Afficher les statistiques du disque","Afficher les processus actifs"],"why":"`-t` filtre sur le protocole TCP : seules les connexions TCP s'affichent.","wx":["Les interfaces, c'est `netstat -i` ou `ip a`.","netstat ne gère pas les disques ; c'est `iostat` ou `df`.","Les processus, c'est `ps`."]},{"id":"linux-11","q":"à quoi sert un FS (système de fichier)","a":"permet de stocker les infos et de les organiser sur le disque dur","w":["permet de stocker les infos et de les organiser sur la mémoire vive","permet de stocker les infos et de les organiser sur la mémoire cache"],"why":"Un système de fichiers (ext4, xfs, NTFS…) organise les données sur un support de stockage persistant comme le disque dur : dossiers, noms, droits, emplacement des blocs.","wx":["La RAM est volatile et s'efface à l'extinction ; ce n'est pas le rôle d'un FS.","Le cache est géré par le processeur et l'OS, pas par un système de fichiers."]},{"id":"linux-12","q":"gpasswd -d rpc wheel","a":"supprimer l'user rpc du groupe wheel","w":["supprimer l'user rpc et son répertoire","créer l'utilisateur rpc","ajouter l'user rpc au groupe wheel tout en gardant les autres groupes","supprimer l'user rpc et son groupe wheel"],"why":"`gpasswd -d` (delete) retire un utilisateur d'un groupe : rpc n'est plus membre de wheel, mais son compte reste intact.","wx":["Supprimer un utilisateur et son home, c'est `userdel -r rpc`.","Créer un utilisateur, c'est `useradd` ou `adduser`.","Ajouter à un groupe, c'est `gpasswd -a` ou `usermod -aG`.","Ni l'utilisateur ni le groupe ne sont supprimés ; seul le lien entre eux disparaît."]}]},{"title":"Quiz de formation 2/2","src":"quiz","qs":[{"id":"linux-13","q":"comment se nomme la racine des dossiers :","a":"/","w":["\\","Root"],"why":"Sous Linux, tout part de la racine `/` : /home, /etc, /var… sont tous dessous.","wx":["`\\` est le séparateur de Windows (C:\\).","« root » est le nom de l'administrateur et de son dossier /root, pas de la racine."]},{"id":"linux-14","q":"Que fait la commande sed '/^L/ d' fichier.txt ?","a":"Supprime toutes les lignes du fichier fichier.txt qui commencent par la lettre \"L\".","w":["Affiche toutes les lignes du fichier fichier.txt qui commencent par \"L\".","Modifie les lignes du fichier fichier.txt qui commencent par \"L\".","Supprime la première ligne du fichier fichier.txt."],"why":"`/^L/` sélectionne les lignes qui commencent par L et `d` les supprime de l'affichage. Le fichier n'est modifié que si on ajoute `-i`.","wx":["Afficher ces lignes, ce serait `sed -n '/^L/p'`.","Modifier, ce serait une substitution avec `s`.","La première ligne seule, ce serait `sed '1d'`."]},{"id":"linux-15","q":"Quelle commande permet de visualiser les interfaces réseau et leurs configurations sous Linux ?","a":"ifconfig","w":["netstat","top","ps aux"],"x":"ifconfig marche encore, mais la commande moderne est ip a (paquet iproute2).","why":"`ifconfig` affiche les interfaces réseau et leur configuration (IP, masque, MAC). Il est ancien mais encore répandu ; l'outil moderne est `ip a`.","wx":["netstat montre les connexions et les ports.","top montre les processus et la charge.","ps aux liste les processus."]},{"id":"linux-16","q":"Quelle commande permet d'afficher une liste des processus en cours d'exécution, triée par utilisation du processeur ?","a":"ps aux --sort=-%cpu","w":["ps aux --sort=-%mem","top","netstat -t"],"why":"`ps aux` liste tous les processus ; `--sort=-%cpu` les trie par usage CPU décroissant (le `-` veut dire décroissant).","wx":["`%mem` trie par mémoire, pas par CPU.","top est interactif et trie aussi par CPU, mais la question attend une commande ps qui affiche une liste.","netstat -t montre les connexions TCP."]},{"id":"linux-17","q":"Que fait la commande mount /dev/vg1/lv1 /data ?","a":"Monte le volume logique /dev/vg1/lv1 sur le répertoire /data.","w":["Affiche les informations sur les disques montés sur /data.","Formate le volume /dev/vg1/lv1 et le monte sur /data.","Crée un nouveau volume logique et le monte sur /data."],"why":"`mount` rattache le volume logique LVM lv1 au dossier /data : ses fichiers deviennent accessibles dans /data.","wx":["Afficher les montages, c'est `mount` sans argument ou `df -h`.","mount ne formate pas ; c'est `mkfs` qu'il faut lancer avant.","Créer un volume logique, c'est `lvcreate`."]},{"id":"linux-18","q":"Si les permissions rwxr-xr- sont accordés au groupe gpl pour un fichier celui-ci a les droits :","a":"lecture et exécution","w":["d'exécution uniquement","lecture uniquement","lecture, écriture et exécution"],"why":"Les droits se lisent par blocs de 3 : propriétaire rwx, groupe r-x, autres r--. Le bloc du groupe, r-x, donne lecture et exécution.","wx":["Le groupe a aussi r.","Le groupe a aussi x.","w manque dans le bloc du groupe."]},{"id":"linux-19","q":"le multitache :","a":"permet de commencer l'exécution d'un second programme alors qu'un premier est déja en exécution","w":["chacune des taches s'exécutant à tour de role","nécessite, pour un système d'exploitation, d'avoir en mémoire centrale plusieurs taches simultanément","ne permet pas le multi-user"],"why":"Le multitâche permet de lancer un deuxième programme pendant que le premier tourne ; l'OS partage le processeur entre eux.","wx":["C'est la façon dont le multitâche est réalisé (temps partagé), mais pas sa définition selon ton corrigé.","C'est une conséquence technique, pas la définition attendue.","Linux est à la fois multitâche et multi-utilisateur."]},{"id":"linux-20","q":"Que fait la commande mkfs.ext4 /dev/vg1/lv1 ?","a":"Formate le volume logique /dev/vg1/lv1 avec le système de fichiers ext4.","w":["Crée une partition ext4 sur le disque /dev/vg1/lv1.","Monte le volume logique /dev/vg1/lv1 sur le système.","Crée un volume logique ext4 dans le groupe de volumes vg1."],"why":"`mkfs.ext4` crée un système de fichiers ext4 sur le volume : c'est le formatage. Il efface ce qu'il contenait.","wx":["La partition ou le volume existe déjà ; mkfs le formate, il ne le crée pas.","Monter, c'est `mount`.","Créer un volume logique, c'est `lvcreate`."]},{"id":"linux-21","q":"fdisk -l","a":"Liste les partitions et les disques présents sur le système.","w":["Crée une nouvelle partition sur un disque.","Affiche les informations détaillées sur l'utilisation du disque."],"why":"`fdisk -l` (list) affiche tous les disques et leurs tables de partitions : tailles, types, secteurs.","wx":["Sans `-l`, fdisk passe en mode interactif pour créer des partitions ; avec `-l`, il se contente de lister.","L'utilisation de l'espace, c'est `df -h`."]},{"id":"linux-22","q":"si un fichier a les permissions rw-r-r- son propriétaire a les droits :","a":"de lecture et d'écriture","w":["d'exécution uniquement","de lecture uniquement","de lecture et d'exécution"],"why":"Premier bloc rw- : r = lecture, w = écriture, pas de x. Le propriétaire peut donc lire et modifier le fichier, mais pas l'exécuter.","wx":["Le x est absent du premier bloc.","Le w est présent en plus du r.","Il n'y a pas de x, mais il y a un w."]},{"id":"linux-23","q":"Quelle commande permet de voir l'utilisation réseau en temps réel sur un système Linux ?","a":"iftop","w":["ps aux","netstat -i","top"],"why":"`iftop` affiche en direct le débit réseau par connexion, comme top mais pour le réseau. Il faut souvent l'installer.","wx":["ps aux liste les processus.","netstat -i donne des compteurs par interface, pas une vue en temps réel du trafic.","top montre le CPU et la RAM, pas le réseau."]}]}]},{"id":"git","name":"Git","sub":"Versionner son code","steps":[{"title":"Démarrer et enregistrer","src":"fiche","qs":[{"id":"git-f1-1","q":"Que fait `git init` ?","a":"Initialise un nouveau dépôt Git","w":["Clone un dépôt distant","Configure ton nom d'utilisateur","Crée une nouvelle branche"],"why":"`git init` crée un dossier caché .git dans le dossier courant : c'est là que Git stocke l'historique. À partir de là, ton dossier devient un dépôt.","wx":["Cloner un dépôt existant, c'est `git clone <url>`.","Configurer ton nom, c'est `git config user.name`.","Créer une branche, c'est `git branch` ou `git switch -c`."]},{"id":"git-f1-2","q":"Que fait `git clone <url>` ?","a":"Télécharge un dépôt distant avec tout son historique","w":["Crée une copie d'une branche locale","Envoie ton dépôt sur le serveur","Duplique le dernier commit"],"why":"`git clone` télécharge tout le dépôt distant (fichiers, historique complet, branches) et configure automatiquement le distant `origin`.","wx":["Copier une branche locale, c'est créer une branche avec `git branch`.","Envoyer sur le serveur, c'est `git push`.","Dupliquer un commit, c'est `git cherry-pick`."]},{"id":"git-f1-3","q":"Comment définir ton nom pour tous tes dépôts ?","a":"git config --global user.name \"Nom\"","w":["git user --name \"Nom\"","git config user.name --all \"Nom\"","git init --name \"Nom\""],"why":"`git config` règle les paramètres ; `--global` les applique à tous tes dépôts (fichier ~/.gitconfig). Ce nom est inscrit dans chacun de tes commits.","wx":["`git user` n'existe pas.","L'option pour tous tes dépôts est `--global` et elle se place avant la clé. `--all` n'existe pas ici.","`git init` crée un dépôt ; il n'accepte pas `--name`."]},{"id":"git-f1-4","q":"Que montre `git status` ?","a":"L'état des fichiers : modifiés, stagés, non suivis","w":["L'historique des commits","Les branches distantes","La configuration de Git"],"why":"`git status` affiche ta branche et l'état de chaque fichier : modifié mais pas ajouté, ajouté au staging (prêt à être commité), ou non suivi. C'est la commande à lancer tout le temps.","wx":["L'historique, c'est `git log`.","Les branches distantes, c'est `git branch -r`.","La configuration, c'est `git config --list`."]},{"id":"git-f1-5","q":"Que fait `git add .` ?","a":"Ajoute au staging tous les fichiers modifiés ou nouveaux du dossier courant","w":["Crée un commit avec tous les fichiers","Ajoute uniquement les fichiers déjà suivis","Ajoute un nouveau dépôt distant"],"why":"`git add` place des changements dans le staging, la zone de préparation du prochain commit. Le `.` veut dire « tout ce qui a changé dans le dossier courant et ses sous-dossiers », nouveaux fichiers compris.","wx":["`add` prépare seulement ; le commit vient ensuite avec `git commit`.","C'est le comportement de `git add -u` ou `commit -a`. `git add .` inclut aussi les nouveaux fichiers.","Ajouter un distant, c'est `git remote add`."]},{"id":"git-f1-6","q":"Quelle est la particularité de `git add -A` ?","a":"Il inclut aussi les suppressions de fichiers","w":["Il crée un commit automatique","Il ignore les fichiers non suivis","Il ajoute les fichiers de toutes les branches"],"why":"`-A` (all) prend en compte tout le dépôt, y compris les fichiers que tu as supprimés : la suppression est enregistrée dans le staging.","wx":["add ne commite jamais ; il faut ensuite `git commit`.","Au contraire, `-A` inclut les fichiers non suivis.","add ne travaille que sur la branche en cours."]},{"id":"git-f1-7","q":"Que fait `git commit -am \"msg\"` ?","a":"Ajoute et commit en une fois les fichiers déjà suivis","w":["Commit tous les fichiers, même non suivis","Modifie le message du dernier commit","Commit puis push automatiquement"],"why":"`-a` ajoute automatiquement au commit les fichiers déjà suivis qui ont été modifiés ou supprimés, et `-m` donne le message. C'est un raccourci pour `git add -u` suivi de `git commit`.","wx":["Les fichiers non suivis (jamais ajoutés) ne sont PAS inclus par `-a` : il faut un `git add` avant.","Modifier le dernier commit, c'est `git commit --amend`.","commit reste local ; push est une commande séparée."]},{"id":"git-f1-8","q":"Que fait `git reset <fichier>` ?","a":"Retire le fichier du staging (unstage)","w":["Supprime le fichier","Annule le dernier commit","Restaure le fichier depuis le serveur"],"why":"`git reset <fichier>` sort le fichier du staging : il redevient « modifié, non ajouté ». Tes modifications restent dans le fichier. L'équivalent moderne est `git restore --staged`.","wx":["Le fichier n'est pas supprimé, et son contenu ne change pas.","Annuler un commit, c'est `git reset HEAD~1` (sans nom de fichier).","reset ne contacte pas le serveur."]},{"id":"git-f1-9","q":"Que fait `git rm <fichier>` ?","a":"Supprime le fichier du dossier de travail et du staging","w":["Retire le fichier du staging seulement","Supprime le dernier commit du fichier","Ignore le fichier pour les prochains commits"],"why":"`git rm` supprime le fichier de ton dossier ET enregistre cette suppression dans le staging : au prochain commit, il disparaît du dépôt.","wx":["Pour ne le retirer que de Git en gardant le fichier sur ton disque, c'est `git rm --cached`.","L'historique reste intact : les anciens commits contiennent toujours le fichier.","Ignorer un fichier, c'est le rôle de .gitignore."]},{"id":"git-f1-10","q":"À quoi sert le fichier .gitignore ?","a":"Lister les fichiers et dossiers que Git doit ignorer","w":["Lister les branches à ne pas pousser","Bloquer certains utilisateurs","Stocker les identifiants Git"],"why":".gitignore liste des motifs (ex : `node_modules/`, `*.log`, `.env`) : les fichiers correspondants n'apparaissent pas dans `git status` et ne sont pas ajoutés par `git add`.","wx":["Il ne concerne que des fichiers, pas des branches.","Les droits d'accès se gèrent côté serveur (GitHub, GitLab).","Les identifiants vont dans un gestionnaire d'identifiants, surtout pas dans .gitignore."]}]},{"title":"Historique et branches","src":"fiche","qs":[{"id":"git-f2-1","q":"Que fait `git log --oneline` ?","a":"Affiche l'historique condensé, un commit par ligne","w":["Affiche seulement le dernier commit","Affiche l'historique en graphique","Affiche les logs du serveur"],"why":"`--oneline` résume chaque commit sur une ligne : hash court et message. C'est idéal pour avoir une vue d'ensemble rapide.","wx":["Le dernier commit seul, c'est `git log -1`.","Le graphique, c'est `--graph` (souvent combiné : `--oneline --graph`).","git log montre l'historique du dépôt, pas les logs d'un serveur."]},{"id":"git-f2-2","q":"Que montre `git diff --staged` ?","a":"Les différences déjà ajoutées au staging","w":["Les différences non stagées","Les différences entre deux branches","Les fichiers non suivis"],"why":"`--staged` compare le staging au dernier commit : tu vois exactement ce qui partira dans le prochain commit.","wx":["Les différences non stagées, c'est `git diff` sans option.","Entre deux branches, c'est `git diff main..feature`.","Les fichiers non suivis apparaissent dans `git status`, pas dans diff."]},{"id":"git-f2-3","q":"Que fait `git show <hash>` ?","a":"Affiche le détail d'un commit précis","w":["Revient à ce commit","Supprime ce commit","Affiche les branches contenant ce commit"],"why":"`git show <hash>` affiche les infos d'un commit (auteur, date, message) et les changements qu'il a introduits.","wx":["Revenir à un commit, c'est `git checkout <hash>` ou `git reset`.","Annuler un commit, c'est `git revert`.","Les branches contenant un commit, c'est `git branch --contains <hash>`."]},{"id":"git-f2-4","q":"Que liste `git reflog` ?","a":"Les opérations faites sur le dépôt local (checkouts, commits…)","w":["Les commits du dépôt distant","Les fichiers modifiés","Les tags du dépôt"],"why":"Le reflog note tous les déplacements de HEAD dans ton dépôt local : commits, checkouts, resets, rebases. C'est la bouée de sauvetage pour retrouver un commit « perdu » après un reset --hard.","wx":["Le reflog est local et n'est jamais partagé.","Les fichiers modifiés, c'est `git status`.","Les tags, c'est `git tag`."]},{"id":"git-f2-5","q":"Que fait `git branch -a` ?","a":"Liste toutes les branches, locales et distantes","w":["Crée une branche nommée a","Liste seulement les branches distantes","Supprime toutes les branches"],"why":"`-a` (all) liste les branches locales ET les branches distantes suivies (remotes/origin/…).","wx":["Pour créer une branche « a », on écrirait `git branch a` sans tiret.","Seulement les distantes, c'est `-r`.","Supprimer, c'est `-d` ou `-D`, une branche à la fois."]},{"id":"git-f2-6","q":"Quelle commande moderne crée une branche ET bascule dessus ?","a":"git switch -c <nom>","w":["git branch -s <nom>","git switch <nom>","git checkout <nom>"],"x":"Équivalent ancien : git checkout -b <nom>.","why":"`git switch -c` (create) crée la branche et bascule dessus en une commande. L'ancienne syntaxe équivalente est `git checkout -b`.","wx":["`git branch` crée sans basculer, et `-s` n'est pas une option de création.","Sans `-c`, switch bascule sur une branche qui doit déjà exister.","Sans `-b`, checkout bascule seulement sur une branche existante."]},{"id":"git-f2-7","q":"Différence entre `git branch -d` et `git branch -D` ?","a":"-D supprime de force, même si la branche n'est pas fusionnée","w":["-d supprime de force, -D seulement si fusionnée","-D supprime aussi la branche distante","Aucune différence"],"why":"`-d` refuse de supprimer une branche non fusionnée, par sécurité. `-D` force la suppression même si son travail n'a pas été fusionné.","wx":["C'est l'inverse : `-d` est la version prudente.","Aucune des deux ne touche au serveur ; pour cela, c'est `git push -d origin <branche>`.","La différence est la sécurité vis-à-vis du travail non fusionné."]},{"id":"git-f2-8","q":"Que fait `git merge feature` ?","a":"Fusionne la branche feature dans la branche actuelle","w":["Fusionne la branche actuelle dans feature","Crée la branche feature","Supprime feature après fusion"],"why":"`git merge X` intègre les commits de X dans la branche où tu te trouves. Pour fusionner feature dans main, tu te places d'abord sur main.","wx":["C'est l'inverse : la branche courante reçoit feature.","Créer, c'est `git branch feature`.","feature reste après la fusion ; il faut la supprimer à part."]},{"id":"git-f2-9","q":"Que fait `git merge --no-ff` ?","a":"Fusionne en créant toujours un commit de fusion","w":["Fusionne sans créer de commit","Annule une fusion en cours","Force la fusion malgré les conflits"],"why":"Normalement, si c'est possible, Git fait un « fast-forward » : il avance simplement le pointeur, sans commit de fusion. `--no-ff` force un commit de fusion pour garder la trace de la branche dans l'historique.","wx":["C'est le fast-forward qui fusionne sans commit ; `--no-ff` l'interdit.","Annuler une fusion en cours, c'est `git merge --abort`.","Rien ne force la résolution des conflits : il faut toujours les régler toi-même."]},{"id":"git-f2-10","q":"Que fait `git rebase main` ?","a":"Rejoue tes commits par-dessus main pour un historique linéaire","w":["Fusionne main avec un commit de fusion","Supprime la branche main","Revient au premier commit de main"],"why":"Le rebase prend tes commits et les rejoue un par un au-dessus du dernier commit de main. L'historique devient une ligne droite, sans commit de fusion, mais les hash de tes commits changent.","wx":["Le commit de fusion, c'est merge. Rebase évite justement ce commit.","main n'est pas touchée ; c'est ta branche qui est réécrite.","Revenir en arrière, c'est reset ou checkout."]},{"id":"git-f2-11","q":"À quoi sert `git rebase -i HEAD~3` ?","a":"Modifier les 3 derniers commits (squash, fixup, edit…)","w":["Annuler les 3 derniers commits","Afficher les 3 derniers commits","Pousser les 3 derniers commits"],"why":"`-i` (interactif) ouvre un éditeur listant les 3 derniers commits (`HEAD~3`). Pour chacun, tu choisis pick, squash (fusionner), fixup, edit ou reword : c'est le nettoyage d'historique avant de partager.","wx":["Annuler, c'est `git reset HEAD~3` ou `revert`.","Afficher, c'est `git log -3`.","Pousser, c'est `git push`."]}]},{"title":"Distant, stash et annulation","src":"fiche","qs":[{"id":"git-f3-1","q":"Différence entre `git fetch` et `git pull` ?","a":"fetch télécharge sans fusionner, pull télécharge puis fusionne","w":["pull télécharge sans fusionner, fetch fusionne","fetch envoie tes commits, pull les reçoit","Aucune différence"],"why":"`fetch` récupère les nouveaux commits du serveur sans toucher à ta branche : tu peux les regarder avant. `pull` = fetch + merge (ou rebase) : il intègre directement.","wx":["C'est l'inverse.","Envoyer tes commits, c'est `push`. fetch et pull reçoivent tous les deux.","pull modifie ta branche, fetch non."]},{"id":"git-f3-2","q":"Que fait `git pull --rebase` ?","a":"fetch puis rebase, pour éviter des commits de fusion inutiles","w":["fetch puis merge","Annule le dernier pull","Pousse puis récupère"],"why":"`--rebase` remplace l'étape merge du pull par un rebase : tes commits locaux sont rejoués au-dessus de ceux du serveur, sans commit « Merge branch… » inutile.","wx":["fetch + merge, c'est le pull par défaut, sans `--rebase`.","pull n'annule rien.","pull ne pousse jamais."]},{"id":"git-f3-3","q":"Que fait `git push -u origin main` ?","a":"Pousse main et la définit comme branche suivie (upstream)","w":["Supprime main sur le serveur","Récupère main depuis origin","Pousse toutes les branches"],"why":"`push` envoie main vers origin ; `-u` (set-upstream) relie ta branche locale à origin/main. Ensuite, `git push` et `git pull` suffisent, sans arguments.","wx":["Supprimer sur le serveur, c'est `-d`.","Récupérer, c'est `pull` ou `fetch`.","Seule main est poussée ; toutes les branches, ce serait `--all`."]},{"id":"git-f3-4","q":"Comment supprimer une branche sur le dépôt distant ?","a":"git push -d origin <branche>","w":["git branch -d origin/<branche>","git remote rm <branche>","git fetch --delete <branche>"],"why":"`git push -d origin <branche>` (ou `--delete`) demande au serveur de supprimer la branche.","wx":["`git branch -d` supprime une branche locale ; sur origin/<branche>, cela ne touche pas le serveur.","`git remote rm` supprime un distant entier (comme origin), pas une branche.","fetch n'a pas d'option `--delete` ; `--prune` nettoie seulement tes références locales."]},{"id":"git-f3-5","q":"Que fait `git remote -v` ?","a":"Affiche les dépôts distants configurés","w":["Affiche la version de Git","Vérifie la connexion au serveur","Supprime les dépôts distants"],"why":"`remote -v` (verbose) liste les distants (origin…) avec leurs URL de fetch et de push.","wx":["La version de Git, c'est `git --version`.","Aucune connexion n'est testée ; ce sont les URL enregistrées.","Supprimer un distant, c'est `git remote rm`."]},{"id":"git-f3-6","q":"Que fait `git stash` ?","a"
