<style>
/* Layout: appli mobile une colonne ; barre du haut fixe, écrans qui se remplacent. */
:root{
  --bg:#EDF1F6; --surface:#FFFFFF; --ink:#14203A; --muted:#5C6B82; --line:#D6DEE9;
  --brand:#1B2A4A; --accent:#2F5BEA; --accent-soft:#E3EAFE;
  --ok:#17845A; --ok-soft:#DDF3E8; --ko:#C8442F; --ko-soft:#FBE4DF; --gold:#E0A100;
  --f-ui:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --f-mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0E1524; --surface:#172238; --ink:#E8EDF6; --muted:#97A5BD; --line:#26344F;
  --brand:#0A1120; --accent:#7C9CFF; --accent-soft:#1E2C52;
  --ok:#4CCB92; --ok-soft:#123326; --ko:#FF8A74; --ko-soft:#3A1D18; --gold:#F5C542;
  color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-ui);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased;overscroll-behavior-y:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
code{font-family:var(--f-mono);font-size:.9em;background:var(--accent-soft);color:var(--ink);padding:1px 5px;border-radius:5px;word-break:break-word}
[hidden]{display:none!important}

.top{position:sticky;top:0;z-index:5;background:var(--brand);color:#fff;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) 12px max(16px,env(safe-area-inset-left,0px));
  display:flex;align-items:center;gap:12px;min-height:56px}
.top h1{font-size:18px;font-weight:700;margin:0;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:-.01em}
.top .back{width:36px;height:36px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.12)}
.top .chips{display:flex;gap:8px;font-size:13px;font-weight:600}
.chip{display:inline-flex;align-items:center;gap:4px;background:rgba(255,255,255,.12);padding:4px 9px;border-radius:99px;font-variant-numeric:tabular-nums}

main{padding:16px max(16px,env(safe-area-inset-right,0px)) calc(28px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border-radius:12px;font-weight:700;padding:0 18px;width:100%}
.btn-primary{background:var(--accent);color:#fff}
@media (prefers-color-scheme:dark){.btn-primary{color:#0E1524}}
.btn-ghost{background:var(--surface);border:1px solid var(--line)}
.btn:disabled{opacity:.45;cursor:default}

/* Accueil */
.hero{padding:18px;display:flex;flex-direction:column;gap:14px}
.hero-row{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.big{font-size:34px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.small{font-size:13px;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.review{display:flex;align-items:center;gap:14px;padding:14px 16px;text-align:left;width:100%}
.review .ico{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--ko-soft);color:var(--ko);font-weight:800;flex:none}
.review b{display:block}
.themes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.theme{padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:150px;position:relative;overflow:hidden}
.theme .badge{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:15px;color:#fff}
.theme b{font-size:17px}
.theme .sub{font-size:13px;color:var(--muted);line-height:1.3}
.theme .foot{margin-top:auto;display:flex;flex-direction:column;gap:6px}
.theme .foot span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.install{padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.install p{margin:0;font-size:14px;color:var(--muted)}

/* Parcours d'étapes */
.path{display:flex;flex-direction:column;gap:0;position:relative;padding-left:4px}
.step{display:grid;grid-template-columns:52px 1fr;gap:14px;align-items:center;text-align:left;width:100%;padding:8px 0;position:relative}
.step .node{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:18px;background:var(--surface);border:3px solid var(--line);color:var(--muted);position:relative;z-index:1;font-variant-numeric:tabular-nums}
.step:not(:last-child)::after{content:"";position:absolute;left:25px;top:56px;bottom:-12px;width:3px;background:var(--line)}
.step.done .node{background:var(--ok);border-color:var(--ok);color:#fff}
.step.done:not(:last-child)::after{background:var(--ok)}
.step.open .node{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.step.locked{opacity:.55;cursor:default}
.step .info{display:flex;flex-direction:column;gap:2px;min-width:0}
.step .info b{font-size:16px}
.step .meta{font-size:13px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.stars{color:var(--gold);letter-spacing:1px;font-size:14px}
.stars .off{color:var(--line)}
.tag{font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 7px;border-radius:99px;background:var(--accent-soft);color:var(--accent)}

/* Question */
.qhead{display:flex;align-items:center;gap:12px}
.qhead .bar{flex:1}
.qhead span{font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.qcard{padding:20px 18px;display:flex;flex-direction:column;gap:6px}
.qcard h2{font-size:19px;line-height:1.35;margin:0;font-weight:700;overflow-wrap:anywhere}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:12px;align-items:center;text-align:left;width:100%;padding:13px 14px;border-radius:12px;background:var(--surface);border:2px solid var(--line);min-height:56px;transition:transform .08s,border-color .15s,background .15s}
.opt:active{transform:scale(.985)}
.opt .k{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:var(--bg);font-weight:800;font-size:14px;color:var(--muted)}
.opt span{overflow-wrap:anywhere;min-width:0}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .k{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--ko);background:var(--ko-soft)}
.opt.wrong .k{background:var(--ko);color:#fff}
.opt.dim{opacity:.55}
.opt:disabled{cursor:default}
.feedback{padding:14px 16px;border-radius:12px;display:flex;flex-direction:column;gap:6px;border-left:5px solid}
.feedback.good{background:var(--ok-soft);border-color:var(--ok)}
.feedback.bad{background:var(--ko-soft);border-color:var(--ko)}
.feedback b{font-size:16px}
.feedback p{margin:0;font-size:14px}
.bottom{position:sticky;bottom:0;padding:12px 0 calc(4px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 70%,transparent)}

/* Résultat */
.result{padding:26px 18px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
.result .stars{font-size:38px;letter-spacing:6px}
.result .score{font-size:48px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}
.result p{margin:0;color:var(--muted);max-width:32ch}
.missed{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.missed li{display:flex;flex-direction:column;gap:3px;font-size:14px}
.missed ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
.missed .good{color:var(--ok);font-weight:600}
.actions{display:flex;flex-direction:column;gap:10px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;font-weight:600;z-index:10;max-width:90vw}
.danger{color:var(--ko);font-size:14px;font-weight:600;padding:10px;align-self:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.pop{animation:pop .35s ease-out}
</style>
</head>

  <button class="back" id="back" aria-label="Retour" hidden><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
  <h1 id="title">DevOps Quiz</h1>
  <div class="chips"><span class="chip" title="Jours d'affilée" aria-label="Série de jours">🔥 <b id="streak">0</b></span><span class="chip" title="Points" aria-label="Points">⭐ <b id="xp">0</b></span></div>

<script>
const BANK = [{"id":"linux","name":"Linux","sub":"Commandes, droits, processus","steps":[{"title":"Navigation et fichiers","src":"fiche","qs":[{"id":"linux-f1-1","q":"Que fait la commande `pwd` ?","a":"Affiche le dossier dans lequel tu te trouves","w":["Liste les fichiers du dossier","Change de dossier","Affiche le chemin de l'exécutable d'une commande"],"x":"pwd = print working directory."},{"id":"linux-f1-2","q":"Que fait `cd -` ?","a":"Revient au dossier précédent","w":["Remonte au dossier parent","Va dans ton répertoire utilisateur (home)","Va à la racine /"],"x":"Pour remonter au dossier parent, c'est `cd ..`."},{"id":"linux-f1-3","q":"Que fait `cd ~` ?","a":"Va dans ton répertoire utilisateur (home)","w":["Revient au dossier précédent","Remonte au dossier parent","Va à la racine /"]},{"id":"linux-f1-4","q":"Que fait `ls -la` ?","a":"Liste détaillée, fichiers cachés inclus","w":["Liste triée par date de modification","Liste uniquement les dossiers","Liste récursive de tous les sous-dossiers"]},{"id":"linux-f1-5","q":"Que fait `ls -lrt /etc` ?","a":"Trie par date de dernière modification, du plus ancien au plus récent","w":["Trie par taille, du plus gros au plus petit","Liste récursivement tout /etc","Affiche uniquement les fichiers cachés"]},{"id":"linux-f1-6","q":"Que fait `ls -lh` ?","a":"Affiche les tailles dans un format lisible (Ko, Mo…)","w":["Affiche les fichiers cachés","Affiche l'aide de la commande ls","Trie les fichiers par heure"]},{"id":"linux-f1-7","q":"Que fait `mkdir -p a/b/c` ?","a":"Crée des dossiers imbriqués en une seule commande","w":["Crée trois dossiers a, b et c au même niveau","Crée a/b/c seulement si a et b existent déjà","Crée un dossier protégé en écriture"]},{"id":"linux-f1-8","q":"Quelle commande déplace OU renomme un fichier ?","a":"mv","w":["cp","ln","rename -r"]},{"id":"linux-f1-9","q":"Que fait `ln -s backup lien_backup` ?","a":"Crée un lien symbolique (raccourci) vers backup","w":["Copie le dossier backup","Déplace backup dans lien_backup","Crée un fichier vide nommé lien_backup"]},{"id":"linux-f1-10","q":"Que fait `touch fichier.txt` si le fichier n'existe pas ?","a":"Crée un fichier vide","w":["Affiche son contenu","Renvoie une erreur","Ouvre l'éditeur de texte"]},{"id":"linux-f1-11","q":"Quelle commande copie un dossier avec tout son contenu ?","a":"cp -r","w":["cp -a -f","mv -r","cp --all"],"x":"-r = récursif."},{"id":"linux-f1-12","q":"Que fait `rm -i profile.log` ?","a":"Supprime le fichier en demandant une confirmation","w":["Supprime le fichier de force","Supprime un dossier et son contenu","Supprime uniquement les fichiers cachés"]},{"id":"linux-f1-13","q":"Que fait `rm -rf dossier` ?","a":"Supprime le dossier et son contenu de force, sans confirmation","w":["Supprime le dossier seulement s'il est vide","Déplace le dossier dans la corbeille","Supprime le dossier en demandant confirmation"],"x":"À manier avec prudence !"},{"id":"linux-f1-14","q":"Que fait `which pwd` ?","a":"Localise le fichier exécutable de la commande pwd","w":["Affiche le dossier actuel","Affiche l'aide de pwd","Indique quel utilisateur a lancé pwd"]},{"id":"linux-f1-15","q":"Que fait `!42` dans le terminal ?","a":"Réexécute la commande n°42 de l'historique","w":["Tue le processus 42","Affiche les 42 dernières commandes","Va à la ligne 42 du fichier ouvert"]}]},{"title":"Lire et chercher","src":"fiche","qs":[{"id":"linux-f2-1","q":"Que fait `tac fichier` ?","a":"Affiche le contenu à l'envers (dernière ligne en premier)","w":["Affiche le contenu page par page","Concatène deux fichiers","Affiche les 10 dernières lignes"]},{"id":"linux-f2-2","q":"Quelle est la différence entre `less` et `more` ?","a":"less permet de monter et descendre, more seulement de descendre","w":["more permet de monter et descendre, less seulement de descendre","less affiche moins de lignes que more","Aucune, ce sont des alias"],"x":"Dans less, tape q pour quitter."},{"id":"linux-f2-3","q":"Combien de lignes affiche `tail fichier` sans option ?","a":"Les 10 dernières","w":["Les 5 dernières","Les 20 dernières","Toutes"]},{"id":"linux-f2-4","q":"Que fait `tail -f app.log` ?","a":"Suit en direct les nouvelles lignes ajoutées au fichier","w":["Affiche le fichier en entier","Force la lecture d'un fichier verrouillé","Affiche les premières lignes du fichier"],"x":"Très utilisé pour surveiller des logs."},{"id":"linux-f2-5","q":"Que fait `wc -l fichier` ?","a":"Compte le nombre de lignes","w":["Compte le nombre de mots","Affiche la largeur du fichier","Liste les liens du fichier"]},{"id":"linux-f2-6","q":"Que fait `grep -i linux system.log` ?","a":"Cherche « linux » en ignorant majuscules/minuscules","w":["Cherche « linux » dans tous les fichiers du dossier","Affiche les lignes qui ne contiennent pas « linux »","Affiche les numéros de lignes"]},{"id":"linux-f2-7","q":"Que fait `grep -v Linux system.log` ?","a":"Affiche les lignes qui ne contiennent PAS « Linux »","w":["Affiche la version de grep","Affiche les lignes avec leur numéro","Cherche en mode verbeux"]},{"id":"linux-f2-8","q":"Que fait `grep -n Linux system.log` ?","a":"Affiche les lignes trouvées avec leur numéro","w":["Compte le nombre de lignes trouvées","Affiche les lignes sans le mot","Cherche sans tenir compte de la casse"]},{"id":"linux-f2-9","q":"Que fait `grep -r \"mot\" .` ?","a":"Cherche « mot » dans tous les fichiers du dossier actuel","w":["Remplace « mot » dans tous les fichiers","Cherche « mot » en partant de la racine /","Cherche les fichiers nommés « mot »"]},{"id":"linux-f2-10","q":"Avec `find`, quelle option limite la recherche aux dossiers ?","a":"-type d","w":["-type f","-dir","-name d"],"x":"-type f limite aux fichiers."},{"id":"linux-f2-11","q":"Que trouve `find -name \"*.log\" -mmin -120` ?","a":"Les fichiers .log modifiés dans les 2 dernières heures","w":["Les fichiers .log de moins de 120 Ko","Les fichiers .log accédés il y a plus de 120 jours","Les 120 premiers fichiers .log"]},{"id":"linux-f2-12","q":"Que fait `find -name \"*.log\" -exec chmod 600 {} \\;` ?","a":"Applique chmod 600 à chaque fichier .log trouvé","w":["Affiche les droits des fichiers .log","Supprime les fichiers .log de plus de 600 octets","Cherche les fichiers ayant les droits 600"]},{"id":"linux-f2-13","q":"Sur quoi s'appuie la commande `locate` ?","a":"Une base de données, mise à jour avec updatedb","w":["Un parcours en direct de tout le disque","Le cache du navigateur","L'historique des commandes"]}]},{"title":"Traiter du texte","src":"fiche","qs":[{"id":"linux-f3-1","q":"Que fait `sort -r nom.txt` ?","a":"Trie les lignes dans l'ordre inverse","w":["Trie et modifie le fichier","Supprime les lignes en double","Trie récursivement les fichiers d'un dossier"]},{"id":"linux-f3-2","q":"La commande `sort nom.txt` modifie-t-elle le fichier ?","a":"Non, elle affiche seulement le résultat trié","w":["Oui, le fichier est réécrit trié","Oui, mais seulement avec les droits root","Non, elle crée automatiquement nom.sorted"]},{"id":"linux-f3-3","q":"Que fait `sed '2,4 d' sed.txt` ?","a":"Affiche le fichier sans les lignes 2 à 4","w":["Affiche uniquement les lignes 2 à 4","Supprime définitivement les lignes 2 à 4 du fichier","Supprime les lignes 2 et 4 seulement"]},{"id":"linux-f3-4","q":"Que fait `sed -n '1,4p' sed.txt` ?","a":"Affiche uniquement les lignes 1 à 4","w":["Affiche tout sauf les lignes 1 à 4","Imprime 4 copies du fichier","Numérote les lignes 1 à 4"]},{"id":"linux-f3-5","q":"Que fait `sed 's/Ligne/test/g' sed.txt` ?","a":"Remplace toutes les occurrences de « Ligne » par « test »","w":["Remplace seulement la première occurrence par ligne","Supprime toutes les lignes contenant « Ligne »","Cherche « Ligne » et « test »"],"x":"Le g final = global (toutes les occurrences)."},{"id":"linux-f3-6","q":"Que fait `sed -n '/^L/!p' sed.txt` ?","a":"Affiche les lignes qui ne commencent PAS par L","w":["Affiche les lignes qui commencent par L","Supprime la lettre L de chaque ligne","Affiche les lignes qui finissent par L"]},{"id":"linux-f3-7","q":"Que fait `awk '{print $1}' etudiant.txt` ?","a":"Affiche la première colonne de chaque ligne","w":["Affiche la première ligne","Affiche le premier caractère du fichier","Compte les colonnes"]},{"id":"linux-f3-8","q":"Que fait `awk 'NR==3' etudiant.txt` ?","a":"Affiche la troisième ligne","w":["Affiche la troisième colonne","Affiche les 3 premières lignes","Affiche les lignes de plus de 3 caractères"]},{"id":"linux-f3-9","q":"Que fait `awk -F: '{print $1,$6}' /etc/passwd` ?","a":"Affiche le nom d'utilisateur et son répertoire home, avec « : » comme séparateur","w":["Affiche les lignes 1 à 6 du fichier","Modifie le séparateur du fichier passwd","Affiche les mots de passe des utilisateurs"]},{"id":"linux-f3-10","q":"Que fait `du -h | sort -nr` ?","a":"Affiche la taille des dossiers, du plus grand au plus petit","w":["Trie les fichiers par nom","Affiche l'espace libre des partitions","Supprime les dossiers les plus lourds"]}]},{"title":"Permissions et utilisateurs","src":"fiche","qs":[{"id":"linux-f4-1","q":"Que fait `chmod +x script.sh` ?","a":"Rend le script exécutable","w":["Donne tous les droits à tout le monde","Change le propriétaire du script","Supprime les droits d'écriture"]},{"id":"linux-f4-2","q":"En octal, combien vaut le droit d'écriture (w) ?","a":"2","w":["1","4","7"],"x":"r = 4, w = 2, x = 1."},{"id":"linux-f4-3","q":"Que donne `chmod 755 fichier` ?","a":"rwx pour le propriétaire, r-x pour le groupe et les autres","w":["rwx pour tout le monde","rw- pour le propriétaire, r-- pour les autres","r-x pour le propriétaire, rwx pour les autres"]},{"id":"linux-f4-4","q":"Que donne `chmod 770 script.sh` ?","a":"Tous les droits au propriétaire et au groupe, aucun aux autres","w":["Tous les droits à tout le monde","Lecture seule pour tous","Tous les droits au propriétaire uniquement"]},{"id":"linux-f4-5","q":"Propriétaire : tous les droits, groupe : lecture + exécution, autres : lecture. Quelle commande ?","a":"chmod 754","w":["chmod 764","chmod 7 e --no-ff` ?","a":"Fusionne en créant toujours un commit de fusion","w":["Fusionne sans créer de commit","Annule une fusion en cours","Force la fusion malgré les conflits"]},{"id":"git-f2-10","q":"Que fait `git rebase main` ?","a":"Rejoue tes commits par-dessus main pour un historique linéaire","w":["Fusionne main avec un commit de fusion","Supprime la branche main","Revient au premier commit de main"]},{"id":"git-f2-11","q":"À quoi sert `git rebase -i HEAD~3` ?","a":"Modifier les 3 derniers commits (squash, fixup, edit…)","w":["Annuler les 3 derniers commits","Afficher les 3 derniers commits","Pousser les 3 derniers commits"]}]},{"title":"Distant, stash et annulation","src":"fiche","qs":[{"id":"git-f3-1","q":"Différence entre `git fetch` et `git pull` ?","a":"fetch télécharge sans fusionner, pull télécharge puis fusionne","w":["pull télécharge sans fusionner, fetch fusionne","fetch envoie tes commits, pull les reçoit","Aucune différence"]},{"id":"git-f3-2","q":"Que fait `git pull --rebase` ?","a":"fetch puis rebase, pour éviter des commits de fusion inutiles","w":["fetch puis merge","Annule le dernier pull","Pousse puis récupère"]},{"id":"git-f3-3","q":"Que fait `git push -u origin main` ?","a":"Pousse main et la définit comme branche suivie (upstream)","w":["Supprime main sur le serveur","Récupère main depuis origin","Pousse toutes les branches"]},{"id":"git-f3-4","q":"Comment supprimer une branche sur le dépôt distant ?","a":"git push -d origin <branche>","w":["git branch -d origin/<branche>","git remote rm <branche>","git fetch --delete <branche>"]},{"id":"git-f3-5","q":"Que fait `git remote -v` ?","a":"Affiche les dépôts distants configurés","w":["Affiche la version de Git","Vérifie la connexion au serveur","Supprime les dépôts distants"]},{"id":"git-f3-6","q":"Que fait `git stash` ?","a":"Met de côté tes modifications en cours","w":["Supprime tes modifications","Crée un commit temporaire sur le serveur","Sauvegarde le dépôt dans une archive"]},{"id":"git-f3-7","q":"Différence entre `git stash pop` et `git stash apply` ?","a":"pop applique et retire le stash de la liste, apply le garde","w":["apply applique et retire, pop le garde","pop supprime sans appliquer","Aucune différence"]},{"id":"git-f3-8","q":"Que fait `git reset --soft HEAD~1` ?","a":"Annule le dernier commit en gardant les modifications dans le staging","w":["Annule le dernier commit et efface les modifications","Annule le dernier commit et sort les modifs du staging","Crée un commit qui annule le précédent"]},{"id":"git-f3-9","q":"Que fait `git reset --hard HEAD~1` ?","a":"Annule le dernier commit ET efface les modifications","w":["Annule le commit en gardant les modifications","Revient au commit sans rien supprimer","Annule seulement le dernier push"],"x":"Très dangereux : les modifications sont perdues."},{"id":"git-f3-10","q":"Quelle commande annule un commit sans réécrire l'historique ?","a":"git revert <hash>","w":["git reset --hard <hash>","git restore <hash>","git checkout -- <hash>"],"x":"revert crée un nouveau commit inverse : c'est la méthode sûre."},{"id":"git-f3-11","q":"Que fait `git restore <fichier>` ?","a":"Annule les modifications non commitées du fichier","w":["Restaure un fichier supprimé du serveur","Retire le fichier du dernier commit","Récupère le fichier d'une autre branche"]},{"id":"git-f3-12","q":"Que fait `git clean -fd` ?","a":"Supprime les fichiers et dossiers non suivis","w":["Nettoie l'historique des commits","Vide le stash","Supprime les branches fusionnées"],"x":"DANGER : les fichiers sont effacés."},{"id":"git-f3-13","q":"Quel type de tag est recommandé ?","a":"Le tag annoté : git tag -a v1.0.0 -m \"Version 1\"","w":["Le tag léger : git tag v1.0.0","Le tag distant : git tag --remote v1.0.0","Le tag forcé : git tag -f v1.0.0"]},{"id":"git-f3-14","q":"Comment pousser tous les tags ?","a":"git push --tags","w":["git push origin --all-tags","git tag --push","git push -t"]}]}]},{"id":"docker","name":"Docker","sub":"Images, volumes, réseaux","steps":[{"title":"Quiz de formation 1/2","src":"quiz","qs":[{"id":"docker-01","q":"Dockerfile est écrit en :","a":"Aucune des réponses ci-dessus","w":["Go","Javascript","YAML"],"o":["Go","Javascript","YAML","Aucune des réponses ci-dessus"],"x":"Un Dockerfile est écrit dans sa propre syntaxe (un DSL), ni Go ni YAML."},{"id":"docker-02","q":"Lequel des éléments suivants n’est pas une alternative basée sur des conteneurs à Docker ?","a":"Kubernetes","w":["Conteneurs Windows Server","LXD de Canonical","rkt de CoreOS"]},{"id":"docker-03","q":"Que se passe-t-il si vous tentez d’effectuer un docker build en vous basant sur une image qui n’a pas encore été utilisée (référencée) sur votre machine ?","a":"Docker téléchargera l’image depuis Docker Hub.","w":["Docker retournera un message 404 : fichier introuvable.","Docker retournera un message 408 : image introuvable.","Docker téléchargera l’image depuis GitHub."]},{"id":"docker-04","q":"docker a été écrit en quel langage","a":"GO","w":["C","JAVA","C++"]},{"id":"docker-05","q":"Comment spécifier un Dockerfile autre que le \"Dockerfile\" par défaut lors du processus de build ?","a":"Utiliser l'option --file","w":["Utiliser l'option --filename","Utiliser l'option --source","Utiliser l'option --dockerfile"]},{"id":"docker-06","q":"Quelle commande permet de créer un nouveau volume dans Docker ?","a":"docker volume create","w":["docker new volume","docker create volume","docker create -v"]},{"id":"docker-07","q":"Comment pouvez-vous partager des volumes de stockage entre des conteneurs ?","a":"En utilisant --volumes-from","w":["En utilisant --share-storage","En utilisant --connect-volumes","En utilisant --link"]},{"id":"docker-08","q":"Le fichier .dockerignore est utilisé pour","a":"Empêcher certains fichiers et répertoires d'être copiés dans une image","w":["Lister toutes les images à télécharger depuis Docker Hub","Spécifier les commandes à exécuter à l'intérieur d'un conteneur","Fournir des métadonnées sur une image ble","sub":"Configurer des serveurs","steps":[{"title":"Les concepts","src":"fiche","qs":[{"id":"ansible-f1-1","q":"Que veut dire « agentless » pour Ansible ?","a":"Aucun logiciel à installer sur les serveurs cibles : Ansible passe par SSH","w":["Ansible fonctionne sans serveur de contrôle","Ansible n'a pas besoin d'inventaire","Ansible n'utilise pas Python"],"x":"SSH pour Linux, WinRM pour Windows."},{"id":"ansible-f1-2","q":"Qu'est-ce que le Control Node ?","a":"La machine où Ansible est installé et d'où tu lances les commandes","w":["Le serveur cible que tu configures","Le fichier qui liste les serveurs","Le serveur Ansible Galaxy"]},{"id":"ansible-f1-3","q":"Comment s'appellent les serveurs gérés par Ansible ?","a":"Les Managed Nodes","w":["Les Control Nodes","Les Workers","Les Agents"]},{"id":"ansible-f1-4","q":"Qu'est-ce que l'inventaire (inventory) ?","a":"Le fichier qui liste les serveurs à gérer","w":["La liste des modules installés","Le journal des exécutions","Le fichier des variables secrètes"]},{"id":"ansible-f1-5","q":"Qu'est-ce qu'un playbook ?","a":"Un fichier YAML qui contient la liste des tâches à exécuter","w":["Un module qui installe des paquets","Un fichier JSON d'inventaire","Le journal des tâches exécutées"]},{"id":"ansible-f1-6","q":"Qu'est-ce qu'un module Ansible ?","a":"Un petit programme qui fait une action précise (apt, copy, service…)","w":["Un groupe de serveurs","Un fichier de variables","Une extension de l'inventaire"]},{"id":"ansible-f1-7","q":"Que signifie l'idempotence pour Ansible ?","a":"Il n'agit que si nécessaire : relancé, il ne refait pas ce qui est déjà fait","w":["Il exécute toutes les tâches en parallèle","Il annule les tâches en cas d'erreur","Il réinstalle tout à chaque exécution"]},{"id":"ansible-f1-8","q":"Quels formats peut avoir un inventaire ?","a":"INI ou YAML","w":["JSON uniquement","XML ou CSV","Uniquement Python"]}]},{"title":"Commandes et playbooks","src":"fiche","qs":[{"id":"ansible-f2-1","q":"Que répond `ansible all -m ping` si la connexion fonctionne ?","a":"pong","w":["OK","200","ping"]},{"id":"ansible-f2-2","q":"Quel module lance une commande shell brute en ad-hoc ?","a":"shell","w":["command-raw","exec","bash"]},{"id":"ansible-f2-3","q":"Dans une commande ansible, que signifie l'option -b ?","a":"become : exécuter en root (sudo)","w":["background : en arrière-plan","batch : par lots","backup : sauvegarder avant"]},{"id":"ansible-f2-4","q":"Comment lancer un playbook ?","a":"ansible-playbook -i inventory site.yml","w":["ansible run site.yml","ansible -p site.yml","ansible-run --playbook site.yml"]},{"id":"ansible-f2-5","q":"Dans un playbook, que fait `become: yes` ?","a":"Les tâches s'exécutent avec les droits root","w":["Le playbook devient le playbook par défaut","Les erreurs sont ignorées","Les tâches s'exécutent en parallèle"]},{"id":"ansible-f2-6","q":"Avec le module apt, que fait `state: latest` ?","a":"Met à jour le paquet vers la dernière version","w":["Installe le paquet seulement s'il est absent","Désinstalle le paquet","Affiche la dernière version disponible"],"x":"present = installer, absent = désinstaller."},{"id":"ansible-f2-7","q":"Quelle est la différence entre les modules copy et template ?","a":"template injecte des variables (Jinja2, .j2), copy copie tel quel","w":["copy injecte des variables, template copie tel quel","template crée des dossiers","Aucune différence"]},{"id":"ansible-f2-8","q":"Quel module démarre, arrête ou redémarre un service ?","a":"service","w":["systemctl","daemon","process"]},{"id":"ansible-f2-9","q":"Quel module ajoute une clé SSH publique à un utilisateur ?","a":"authorized_key","w":["ssh_key","user_key","copy_key"]},{"id":"ansible-f2-10","q":"Que fait `ansible-playbook site.yml --check` ?","a":"Simule l'exécution sans rien modifier","w":["Vérifie seulement la syntaxe","Exécute puis annule","Vérifie la connexion SSH"]},{"id":"ansible-f2-11","q":"À quoi sert `-vvv` sur ansible-playbook ?","a":"Afficher un maximum de détails ","q":"Quelle commande permet de vérifier la syntaxe d'un playbook sans l'exécuter ?","a":"ansible-playbook --syntax-check","w":["ansible-playbook --check-syntax","ansible-playbook --dry-run","ansible-playbook --validate"]},{"id":"ansible-10","q":"Quel est le rôle de l'option forks dans un fichier de configuration ansible.cfg ?","a":"Elle spécifie le nombre de processus parallèles qui seront utilisés pour exécuter les tâches sur les hôtes cibles.","w":["Elle détermine le nombre de machines cibles qui peuvent être connectées simultanément.","Elle définit le nombre de threads pour gérer les erreurs dans les playbooks.","Elle permet de définir le nombre maximal de tâches qui peuvent être exécutées en parallèle lors de l'exécution du playbook."]},{"id":"ansible-11","q":"Quelle commande Ansible permet de vérifier la connectivité SSH avec des hôtes cibles ?","a":"ansible -m ping","w":["ansible -m status all","ansible -m check","ansible -ping"]},{"id":"ansible-12","q":"Quel fichier de configuration Ansible permet de définir les paramètres globaux ?","a":"ansible.cfg","w":["hosts.ini","config.json","ansible.yml"]}]},{"title":"Quiz de formation 2/2","src":"quiz","qs":[{"id":"ansible-13","q":"Dans Ansible, quel fichier contient les informations d'inventaire des hôtes ?","a":"Le fichier 'hosts.ini'","w":["Le fichier 'inventory.json'","Le fichier 'hosts.yml'","Le fichier 'ansible.cfg'"]},{"id":"ansible-14","q":"Quel est l’objectif du paramètre become dans un playbook Ansible ?","a":"Permet d'exécuter des tâches avec des privilèges élevés.","w":["Permet de réduire le temps d'exécution des tâches.","Limite l'accès aux fichiers système.","Active le mode de débogage pour les tâches."]},{"id":"ansible-15","q":"Comment peut-on stocker et réutiliser les valeurs d'une tâche dans Ansible ?","a":"register","w":["facts","store"]},{"id":"ansible-16","q":"Quelle option permet de ne pas exécuter une tâche si une condition spécifique est remplie dans un playbook ?","a":"Utiliser 'when'","w":["Utiliser 'unless'","Utiliser 'skip_when'","Utiliser 'ignore'"]},{"id":"ansible-17","q":"Dans Ansible, quel fichier est utilisé pour spécifier des variables spécifiques à un groupe d’hôtes dans un inventaire dynamique ?","a":"group_vars","w":["fichier d'inventaire statique","vars.yml","host_vars"]},{"id":"ansible-18","q":"Comment spécifier un utilisateur spécifique pour exécuter une commande dans Ansible ?","a":"Utilisez 'ansible_user' dans l'inventaire ou le playbook.","w":["Spécifiez l'utilisateur dans le fichier de configuration SSH.","Utilisez 'ansible_host' dans l'inventaire."]},{"id":"ansible-19","q":"Quelle option permet d’exécuter un playbook sur un sous-ensemble d’hôtes définis par un groupe dans l’inventaire ?","a":"--limit","w":["-v ou --verbose","-a ou --all","--force"]},{"id":"ansible-20","q":"Dans Ansible, quel fichier est utilisé pour créer un inventaire dynamique pour les clouds comme AWS, GCP ou Azure ?","a":"dynamic_inventory.py","w":["hosts.ini","ansible.cfg","inventory.yaml"]},{"id":"ansible-21","q":"Quel module Ansible est utilisé pour déployer une application Docker sur une machine distante ?","a":"docker_container","w":["docker_image","docker_service","docker_network"]},{"id":"ansible-22","q":"Quel module Ansible permet de gérer les configurations des bases de données MySQL ?","a":"mysql_db","w":["mysql_setup","mysql_manage","mysql_config"]},{"id":"ansible-23","q":"Quelle est la principale différence entre un fichier d'inventaire statique et un inventaire dynamique dans Ansible ?","a":"Un inventaire dynamique est généré via un script ou un plugin qui interroge une source externe (cloud, base de données, etc.) en temps réel.","w":["L'inventaire statique est plus rapide à exécuter que l'inventaire dynamique.","L'inventaire dynamique nécessite une configuration manuelle pour chaque hôte.","Un inventaire dynamique charge les hôtes lors de l'exécution, tandis qu'un inventaire statique est un fichier texte avec une liste fixe."]},{"id":"ansible-24","q":"Lors de l'utilisation d'un inventaire dynamique, quel format de sortie est généralement utilisé pour fournir des informations d'inventaire ?","a":"JSON","w":["YAML","XML","TXT"]},{"id":"ansible-25","q":"Quelle commande Ansible permet de récupérer les faits (facts) des hôtes cibles ?","a":"ansible -m setup","w":["ansible -m gather_facts","ansible -m get_facts","ansible -m ping"]}]}]},{"id":"terraform","name":"Terraform","sub":"L'infra en code","steps":[{"title":"Les concepts","src":"fiche","qs":[{"id":"terraform-f1-1","q":"Qu'est-ce que Terraform ?","a":"Un outil open source d'Infrastructure as Code qui provisionne l'infra de manière déclarative","w":["Un outil de configuration de serveurs par SSH","Un orchestrateur de conteneurs","Un service cloud d'AWS"]},{"id":"terraform-f1-2","q":"Que veut dire « idempotent » pour Terraform ?","a":"Même exécution, même résultat, même si on relance plusieurs fois","w":["Chaque exécution recrée toute l'infra","Les ressources ne peuvent pas être modifiées","Terraform s'exécute sans state"]},{"id":"terraform-f1-3","q":"Qu'est-ce qu'un provider ?","a":"Un plugin qui permet à Terraform de parler à une plateforme (AWS, Azure, Kubernetes…)","w":["Le fichier qui stocke l'état","Un module de variables","Le serveur qui héberge Terraform"]},{"id":"terraform-f1-4","q":"Que fait `terraform init` ?","a":"Initialise le projet et télécharge les providers","w":["Crée les ressources","Montre ce qui va changer","Supprime l'infrastructure"]},{"id":"terraform-f1-5","q":"Que fait `terraform plan` ?","a":"Montre ce qui va changer, sans rien modifier","w":["Applique les changements","Vérifie seulement la syntaxe","Télécharge les providers"]},{"id":"terraform-f1-6","q":"Que fait `terraform apply` ?","a":"Crée, modifie ou supprime réellement les ressources","w":["Montre ce qui va changer sans rien faire","Formate le code","Importe des ressources existantes"]},{"id":"terraform-f1-7","q":"Que fait `terraform validate` ?","a":"Vérifie la syntaxe et la cohérence sans contacter les providers","w":["Applique les changements après validation","Vérifie que les ressources existent dans le cloud","Valide le state distant"]},{"id":"terraform-f1-8","q":"Que fait `terraform destroy` ?","a":"Supprime toutes les ressources gérées par Terraform","w":["Supprime le fichier state","Supprime les providers téléchargés","Annule le dernier apply"]}]},{"title":"State, variables et modules","src":"fiche","qs":[{"id":"terraform-f2-1","q":"À quoi sert le fichier terraform.tfstate ?","a":"Stocker l'état réel de l'infrastructure","w":["Déclarer les variables","Lister les providers","Stocker les logs d'exécution"]},{"id":"terraform-f2-2","q":"Pourquoi utiliser un backend distant (ex : S3) pour le state ?","a":"Collaboration, state centralisé et verrouillage (locking)","w":["Pour accélérer terraform plan","Parce que le state local est interdit","Pour chiffrer le code .tf"]},{"id":"terraform-f2-3","q":"Pourquoi ne jamais modifier le state à la main ?","a":"Risque d'incohérence ou de corruption : on passe par les commandes Terraform","w":["Le fichier est en lecture seule","Terraform le régénère à chaque plan","C'est autorisé seulement en production"]},{"id":"terraform-f2-4","q":"À quoi servent les input variables ?","a":"Paramétrer la configuration et éviter le hardcoding","w":["Afficher des résultats après apply","Stocker l'état","Déclarer les providers"]},{"id":"terraform-f2-5","q":"Différence entre variables.tf et terraform.tfvars ?","a":"variables.tf déclare les variables, terraform.tfvars donne leurs valeurs","w":["variables.tf donne les valeurs, terraform.tfvars les déclare","terraform.tfvars contient le state","Aucune différence"]},{"id":"terraform-f2-6","q":"Qu'est-ce qu'un module Terraform ?","a":"Un dossier de fichiers .tf réutilisable pour une partie de l'infra","w":["Un plugin de connexion à un cloud","Une commande Terraform","Un fichier de state partagé"]},{"id":"terraform-f2-7","q":"Différence entre count et for_each ?","a":"count crée des copies par index numérique, for_each itère sur une liste/map avec une clé unique","w":["for_each crée des copies par index, count itère sur une map","count est réservé aux modules","Aucune différence"]},{"id":"terraform-f2-8","q":"À quoi sert `terraform import` ?","a":"Intégrer au state une ressource créée hors Terraform, sans la recréer","w":["Télécharger un module","Importer des variables","Copier le state d'un autre projet"]},{"id":"terraform-f2-9","q":"Que sont les workspaces ?","a":"Plusieurs instances d'une même config (dev, prod) avec des states isolés","w":["Des dossiers de modules","Des espaces de travail sur le cloud","Des copies de sauvegarde du state"]},{"id":"terraform-f2-10","q":"À quoi servait `terraform taint` ?","a":"Marquer une ressource comme endommagée pour la recréer au prochain apply","w":["Supprimer une ressource du state","Bloquer la modification d'une ressource","Signaler une erreur de syntaxe"],"x":"Aujourd'hui on utilise plutôt `terraform apply -replace=<ressource>`."}]},{"title":"Quiz de formation 1/2","src":"quiz","qs":[{"id":"terraform-01","q":"Vous avez défini les valeurs de vos variables dans le fichier terraform.tfvars et l'avez enregistré dans le même répertoire que votre configuration Terraform. Laquelle des commandes suivantes utilisera ces valeurs lors de la création d'un plan d'exécution ?","a":"Toutes les réponses ci-dessus","w":["terraform plan -var-file=terraform.tfvars","Aucune des réponses ci-dessus","terraform plan"],"o":["terraform plan -var-file=terraform.tfvars","Aucune des réponses ci-dessus","Toutes les réponses ci-dessus","terraform plan"]},{"id":"terraform-02","q":"Lesquelles des commandes Terraform suivantes actualisera automatiquement l'état, sauf si des options ou des arguments supplémentaires sont fournis ?","a":"terraform plan","w":["terraform state","terraform validate","terraform apply","terraform output"],"x":"terraform apply rafraîchit aussi l'état avant d'appliquer."},{"id":"terraform-03","q":"Que sont les provisionneurs Terraform et quand les utiliser ?","a":"Les provisionneurs sont utilisés pour exécuter des scripts ou des commandes après que Terraform a créé ou mis à jour des ressources.","w":["Les provisionneurs sont utilisés pour gérer les secrets dans Terraform.","Les provisionneurs sont utilisés pour gérer l'état des ressources dans Terraform.","Les provisionneurs sont utilisés pour gérer les dépendances des ressources."]},{"id":"terraform-04","q":"Comment pouvez-vous gérer plusieurs environnements avec Terraform (par exemple, production, staging) ?","a":"En utilisant des modules et des variables pour personnaliser les configurations selon l'environnement.","w":["En créant un fichier unique pour toutes les configurations et en ne changeant que les valeurs par défaut.","En utilisant plusieurs fichiers de configuration main.tf pour chaque environnement.","Terraform ne permet pas de gérer plusieurs environnements."]},{"id":"terraform-05","q":"Quelle est la commande Terraform pour auto formater le code ?","a":"terraform fmt","w":["terraform code fmt","terraform format","terraform lint -fix"]},{"id":"terraform-06","q":"Que fait la commande terraform taint aws_instance.aws-vm ?","a":"Tag la ressource en tainted pour forcer Terraform à la recréer au prochain terrafrom apply","w":["Cette commande n’est plus valide depuis Terraform v1.20","Tag la ressource en tainted pour que Terraform supprime la ressource du tfstate"],"x":"terraform taint est dépréciée depuis Terraform 0.15.2 : aujourd'hui on utilise terraform apply -replace=<ressource>."},{"id":"terraform-07","q":"Qu'est-ce qu'une ressource null_resource dans Terraform ?","a":"Une ressource qui peut être utilisée pour exécuter des actions arbitraires via des provisionneurs ou des déclencheurs.","w":["Une ressource utilisée pour générer des ressources en dehors de Terraform.","Une ressource de type \"vide\" qui ne fait rien.","Une ressource qui est utilisée uniquement pour les tests unitaires."]},{"id":"terraform-08","q":"Que se passe-t-il lorsque vous définissez une variable comme sensitive = true dans Terraform ?","a":"Terraform empêche la valeur de la variable d'apparaître dans les sorties, logs ou fichiers d'état.","w":["Terraform crée un fichier sécurisé pour stocker la variable sensible.","Terraform crée une alerte chaque fois que la variable sensible est utilisée.","Terraform crypte la variable avant de l'envoyer à un backend distant."]},{"id":"terraform-09","q":"Quelles commandes peuvent être utilisé pour importer des ressources existantes non présentes dans le tfstate ?","a":"terraform import","w":["terraform refresh","terraform reload","terraform state reload"],"x":"Depuis Terraform 1.5, on peut aussi utiliser un bloc import {} dans le code."}]},{"title":"Quiz de formation 2/2","src":"quiz","qs":[{"id":"terraform-10","q":"Comment Terraform gère-t-il l'état à distance ?","a":"Terraform utilise un backend distant comme AWS S3, Azure Blob Storage, ou HashiCorp Consul pour stocker l'état.","w":["Terraform crée une nouvelle instance de la ressource à chaque exécution pour ne pas avoir besoin d'un état.","Terraform stocke l'état dans une base de données relationnelle.","Terraform n'a pas de gestion d'état, tout est géré localement."]},{"id":"terraform-11","q":"Quelle est la commande à utiliser pour lister toutes les ressources présentes dans le Tfstate ?","a":"terraform state list","w":["terraform backend ls","terraform resource list","terraform ls"]},{"id":"terraform-12","q":"Qu’est-ce que Terragrunt ?","a":"Terragrunt est un outil qui s’interface au- dessus de Terraform et qui permet de mieux gérer ses multiples environnements sous Terraform en mettant en place un certain nombre de dossiers dans ses repos","w":["Terragrunt est un projet Opensource qui a pour but de gérer le drift d’infrastructure","Terragrunt est un linter qui permet d’analyser un ensemble de bonne pratique dans son code comme la qualité ou la sécurité"]},{"id":"terraform-13","q":"Comment sont gérés les dépendances de ressources dans Terraform, et quel est le rôle des dépendances implicites et explicites ?","a":"Les dépendances explicites sont définies avec depends_on, tandis que les dépendances implicites sont gérées automatiquement par Terraform en fonction des références de ressources.","w":["Les dépendances explicites sont définies automatiquement, et Terraform n'a pas besoin d'une gestion particulière des dépendances implicites.","Terraform crée des dépendances explicites uniquement à travers des variables externes.","Terraform ne gère pas les dépendances entre les ressources, c'est au développeur de les gérer."]},{"id":"terraform-14","q":"Que se passe-t-il lorsque vous appliquez une configuration Terraform ?","a":"Terraform effectue toutes les modifications d'infrastructure définies dans votre configuration.","w":["Terraform met à jour le fichier d'état avec les modifications apportées à la configuration.","Terraform récupère les plugins requis par la configuration.","Terraform corrige les erreurs de formatage dans votre configuration.","Terraform détruit et recrée toute votre infrastructure depuis zéro."]},{"id":"terraform-15","q":"Qu'est-ce que le terraform output ?","a":"Il permet d'afficher les résultats ou les valeurs des ressources ou des variables après l'application de la configuration.","w":["Il affiche les valeurs des variables définies dans le fichier de configuration Terraform.","Il génère un fichier d'état.","Il sert à déployer de nouvelles ressources."]},{"id":"terraform-16","q":"variable \"vpc_cidrs\" { type = map default = { us-east-1 = \"10.0.0.0/16\" us-east-2 = \"10.1.0.0/16\" us-west-1 = \"10.2.0.0/16\" us-west-2 = \"10.3.0.0/16\" } } resource \"aws_vpc\" \"shared\" { cidr_block = _____________ } How would you define the cidr_block for us-east-1 in the aws_vpc resource using a variable?","a":"var.vpc_cidrs[\"us-east-1\"]","w":["var.vpc_cidrs.0","vpc_cidrs[\"us-east-1\"]","var.vpc_cidrs[0]"]},{"id":"terraform-17","q":"Quelle est la meilleure pratique pour stocker des secrets dans Terraform ?","a":"Utiliser des services externes comme AWS Secrets Manager, HashiCorp Vault ou Azure Key Vault pour stocker et gérer les secrets.","w":["Utiliser des fichiers .tf pour définir les secrets et les sécuriser par des permissions de fichier.","Stocker les secrets directement dans le code source pour les référencer facilement.","Garder les secrets dans des variables locales pour les utiliser uniquement dans une machine."]}]}]},{"id":"aws","name":"AWS","sub":"Les services du cloud","steps":[{"title":"Calcul et stockage","src":"fiche","qs":[{"id":"aws-f1-1","q":"Qu'est-ce qu'une instance EC2 ?","a":"Un serveur virtuel dans le cloud dont tu contrôles l'OS, la RAM et le CPU","w":["Un service de stockage d'objets","Une base de données gérée","Un service pour exécuter du code sans serveur"]},{"id":"aws-f1-2","q":"Qu'est-ce qu'une AMI ?","a":"Le modèle (template) du serveur : OS et logiciels pré-installés","w":["La clé SSH de l'instance","Le pare-feu de l'instance","La taille de l'instance"]},{"id":"aws-f1-3","q":"À quoi sert la Key Pair d'une EC2 ?","a":"Se connecter en SSH (fichier .pem)","w":["Chiffrer le disque","Ouvrir les ports","Garder une IP fixe"]},{"id":"aws-f1-4","q":"À quoi sert une Elastic IP ?","a":"Avoir une IP publique fixe qui ne change pas au redémarrage","w":["Répartir la charge entre instances","Accéder à internet depuis un subnet privé","Augmenter la bande passante"]},{"id":"aws-f1-5","q":"Quel est le dernier état du cycle de vie d'une EC2 ?","a":"Terminated","w":["Stopped","Shutting-down","Pending"]},{"id":"aws-f1-6","q":"Comment AWS Lambda est-il facturé ?","a":"Au temps de calcul, en millisecondes","w":["À l'heure, que le code tourne ou non","Au nombre de serveurs","Au forfait mensuel"]},{"id":"aws-f1-7","q":"Différence entre ECS et EKS ?","a":"ECS orchestre des conteneurs Docker (plus simple), EKS c'est Kubernetes géré par AWS","w":["EKS orchestre Docker, ECS c'est Kubernetes","ECS est pour les bases de données","Aucune différence"]},{"id":"aws-f1-8","q":"Qu'est-ce qu'Elastic Beanstalk ?","a":"Un PaaS : tu envoies ton code, AWS gère LB, Auto Scaling et EC2","w":["Un service de stockage d'archives","Un pare-feu applicatif","Un outil de monitoring"]},{"id":"aws-f1-9","q":"Qu'est-ce que S3 ?","a":"Un stockage d'objets illimité (fichiers, images, backups)","w":["Un disque attaché à une EC2","Une base de données SQL","Un système de fichiers partagé NFS"]},{"id":"aws-f1-10","q":"Qu'est-ce qu'un bucket S3 ?","a":"Le « dossier » racine, avec un nom unique au monde","w":["Un fichier stocké dans S3","Une classe de stockage","Une règle d'accès"]},{"id":"aws-f1-11","q":"Quelle est la durabilité annoncée de S3 ?","a":"99,999999999 % (11 neuf)","w":["99,9 %","99,99 %","100 %"]},{"id":"aws-f1-12","q":"Différence entre S3 Standard et S3 Glacier ?","a":"Standard pour les données fréquentes, Glacier pour l'archivage (moins cher, lent)","w":["Glacier est plus rapide et plus cher","Standard est réservé aux vidéos","Glacier ne stocke que des bases de données"]},{"id":"aws-f1-13","q":"Qu'est-ce qu'un volume EBS ?","a":"Un disque réseau attaché à une EC2 ; les données survivent à l'instance","w":["Un stockage partagé entre plusieurs EC2","Un stockage d'objets","Une sauvegarde automatique de S3"]},{"id":"aws-f1-14","q":"Qu'est-ce qu'EFS ?","a":"Un stockage partagé (NFS) utilisable par plusieurs EC2 en même temps","w":["Un disque attaché à une seule EC2","Un service d'archivage","Un stockage d'objets"]}]},{"title":"Bases de données et réseau","src":"fiche","qs":[{"id":"aws-f2-1","q":"Qu'est-ce que RDS ?","a":"Des bases SQL gérées par AWS (mises à jour et backups)","w":["Une base NoSQL clé-valeur","Un entrepôt de données","Un cache en mémoire"]},{"id":"aws-f2-2","q":"À quoi sert l'option Multi-AZ de RDS ?","a":"La haute disponibilité, par réplication synchrone","w":["Soulager la base en lecture","Réduire les coûts","Chiffrer les données"]},{"id":"aws-f2-3","q":"À quoi servent les Read Replicas ?","a":"Soulager la base en lecture (réplication asynchrone)","w":["La haute disponibilité en cas de panne","Sauvegarder la base","Écrire plus vite"]},{"id":"aws-f2-4","q":"Qu'est-ce que DynamoDB ?","a":"Une base NoSQL clé-valeur serverless, très faible latence","w":["Une base SQL gérée","Un entrepôt de données","Un service ETL"]},{"id":"aws-f2-5","q":"Qu'est-ce que Redshift ?","a":"Un entrepôt de données (data warehouse)","w":["Un service ETL","Une base clé-valeur","Un CDN"]},{"id":"aws-f2-6","q":"Qu'est-ce que Glue ?","a":"Un service ETL (Extract, Transform, Load)","w":["Un entrepôt de données","Un service DNS","Un pare-feu"]},{"id":"aws-f2-7","q":"Qu'est-ce qu'un VPC ?","a":"Ton réseau privé isolé dans le cloud","w":["Un serveur virtuel","Un pare-feu applicatif","Un service DNS"]},{"id":"aws-f2-8","q":"Différence entre un subnet public et un subnet privé ?","a":"Le public a un accès direct à internet, le privé non (BDD, apps sécurisées)","w":["Le privé a un accès internet, le public non","Le public est gratuit, le privé payant","Aucune différence"]},{"id":"aws-f2-9","q":"À quoi sert une NAT Gateway ?","a":"Permettre aux instances d'un subnet privé de sortir sur internet sans être joignables","w":["Donner une IP publique fixe","Relier deux VPC","Bloquer les attaques web"]},{"id":"aws-f2-10","q":"À quoi sert une Internet Gateway ?","a":"C'est la porte d'accès à internet du VPC","w":["Relier un subnet privé à internet","Répartir la charge","Gérer le DNS"]},{"id":"aws-f2-11","q":"Quelle est la différence entre une NACL et un Security Group ?","a":"La NACL filtre au niveau du subnet, le Security Group au niveau de l'instance","w":["La NACL filtre l'instance, le Security Group le subnet","Les deux filtrent au niveau du VPC","Le Security Group filtre seulement HTTP"]},{"id":"aws-f2-12","q":"Qu'est-ce qu'une Route Table ?","a":"Le « GPS » du réseau : elle dit où vont les paquets","w":["La liste des IP publiques","Le pare-feu du subnet","L'annuaire DNS"]},{"id":"aws-f2-13","q":"Quand préférer Transit Gateway au VPC Peering ?","a":"Quand tu as beaucoup de VPC à relier via un hub central","w":["Pour relier deux VPC seulement","Pour sortir sur internet","Pour bloquer les attaques web"]},{"id":"aws-f2-14","q":"Qu'est-ce que Route 53 ?","a":"Le service DNS d'AWS (domaines, routage, health checks)","w":["Le CDN d'AWS","Un répartiteur de charge","Un service de routage entre VPC"]},{"id":"aws-f2-15","q":"Différence entre ALB et NLB ?","a":"ALB travaille en niveau 7 (HTTP/HTTPS), NLB en niveau 4 (TCP)","w":["ALB en niveau 4, NLB en niveau 7","ALB est pour les bases de données","NLB ne gère que HTTPS"]},{"id":"aws-f2-16","q":"Que fait CloudFront ?","a":"Copie tes fichiers statiques partout dans le monde pour un chargement rapide","w":["Il protège contre les attaques web","Il gère tes noms de domaine","Il stocke tes backups"]}]},{"title":"Sécurité, déploiement et supervision","src":"fiche","qs":[{"id":"aws-f3-1","q":"Qu'est-ce qu'IAM ?","a":"Le service qui gère « qui peut faire quoi » (users, groups, roles, policies)","w":["Le service de chiffrement","Le pare-feu d'AWS","Le service de monitoring"]},{"id":"aws-f3-2","q":"Qu'est-ce qu'un rôle IAM ?","a":"Une identité temporaire pour un service (ex : une EC2 qui écrit sur S3)","w":["Un groupe d'utilisateurs","Un document de permissions","Un compte administrateur"]},{"id":"aws-f3-3","q":"Sous quel format est écrite une IAM Policy ?","a":"JSON (Allow / Deny)","w":["YAML","XML","HCL"]},{"id":"aws-f3-4","q":"Quelle bonne pratique pour le compte root ?","a":"Ne jamais l'utiliser au quotidien et activer le MFA","w":["L'utiliser pour toutes les tâches d'administration","Partager ses identifiants avec l'équipe","Désactiver son mot de passe"]},{"id":"aws-f3-5","q":"À quoi sert KMS ?","a":"Gérer les clés de chiffrement (EBS, S3, RDS…)","w":["Stocker les mots de passe","Gérer les utilisateurs","Surveiller les accès"]},{"id":"aws-f3-6","q":"À quoi sert Secrets Manager ?","a":"Stocker les secrets (mots de passe, clés API) et les faire tourner automatiquement","w":["Gérer les clés de chiffrement","Créer des utilisateurs","Chiffrer les disques"]},{"id":"aws-f3-7","q":"Qu'est-ce que CloudFormation ?","a":"L'Infrastructure as Code d'AWS, en YAML ou JSON","w":["Le service de monitoring","Un outil de build","Le CDN d'AWS"]},{"id":"aws-f3-8","q":"Différence entre CodePipeline et CodeBuild ?","a":"CodePipeline orchestre les étapes, CodeBuild compile le code","w":["CodeBuild orchestre, CodePipeline compile","CodePipeline déploie seulement sur EC2","Aucune différence"]},{"id":"aws-f3-9","q":"Que permettent les CloudWatch Alarms ?","a":"Déclencher une action quand un seuil est dépassé (ex : CPU > 80 %)","w":["Stocker les logs","Tracer les requêtes entre microservices","Enregistrer qui a fait quoi"]},{"id":"aws-f3-10","q":"Que fait CloudTrail ?","a":"Il enregistre qui a fait quoi sur le compte AWS","w":["Il surveille le CPU et la RAM","Il optimise les coûts","Il trace les requêtes applicatives"]},{"id":"aws-f3-11","q":"À quoi sert X-Ray ?","a":"Suivre une requête à travers tous les microservices pour déboguer","w":["Scanner les vulnérabilités","Surveiller les coûts","Chiffrer les données"]},{"id":"aws-f3-12","q":"Qu'est-ce que Trusted Advisor ?","a":"Un « médecin » qui conseille sur les coûts, la sécurité et les performances","w":["Un service de support payant","Un outil de déploiement","Un pare-feu"]},{"id":"aws-f3-13","q":"Différence entre SNS et SQS ?","a":"SNS diffuse un message à plusieurs abonnés, SQS met les messages en file d'attente","w":["SQS diffuse, SNS met en file d'attente","SNS est pour les e-mails seulement","Aucune différence"]},{"id":"aws-f3-14","q":"Scalabilité verticale ou horizontale : ajouter des machines, c'est…","a":"Horizontale (scale out)","w":["Verticale (scale up)","Élasticité","Redondance"],"x":"Verticale = rendre une machine plus puissante."},{"id":"aws-f3-15","q":"Qu'est-ce qu'une application stateless ?","a":"Elle ne garde pas en m ,"q":"Comment pouvez-vous utiliser des services externes dans vos pipelines GitLab CI ?","a":"Toutes les réponses ci-dessus","w":["En utilisant des scripts shell","En définissant des services dans votre fichier .gitlab-ci.yml","En utilisant des containers Docker dans les jobs"],"o":["En utilisant des scripts shell","Toutes les réponses ci-dessus","En définissant des services dans votre fichier .gitlab-ci.yml","En utilisant des containers Docker dans les jobs"]}]}]},{"id":"k8s","name":"Kubernetes","sub":"Orchestrer des conteneurs","steps":[{"title":"Architecture et workloads","src":"fiche","qs":[{"id":"k8s-f1-1","q":"À quoi sert Kubernetes ?","a":"Automatiser le déploiement et la gestion de conteneurs, comme un chef d'orchestre","w":["Construire des images Docker","Versionner le code","Provisionner des VM dans le cloud"]},{"id":"k8s-f1-2","q":"Quel est le rôle du Control Plane ?","a":"Prendre les décisions globales du cluster (le « cerveau »)","w":["Exécuter les applications","Stocker les images Docker","Équilibrer le trafic externe"]},{"id":"k8s-f1-3","q":"Qu'est-ce qu'etcd ?","a":"La base de données qui stocke l'état du cluster","w":["L'agent des nœuds","Le gestionnaire de paquets","Le point d'entrée HTTP"]},{"id":"k8s-f1-4","q":"Quel composant choisit sur quel nœud placer un pod ?","a":"Le Scheduler","w":["Le Kubelet","etcd","Kube-proxy"]},{"id":"k8s-f1-5","q":"Qu'est-ce que le Kubelet ?","a":"L'agent qui tourne sur chaque worker node","w":["La base de données du cluster","L'outil en ligne de commande","Le load balancer interne"]},{"id":"k8s-f1-6","q":"Quel composant d'un worker node gère le réseau ?","a":"Kube-proxy","w":["Kubelet","etcd","Scheduler"]},{"id":"k8s-f1-7","q":"Qu'est-ce qu'un Pod ?","a":"L'unité de base : un ou plusieurs conteneurs partageant IP et volumes","w":["Un nœud du cluster","Un groupe de nœuds","Une image Docker"]},{"id":"k8s-f1-8","q":"Quel objet pour une application sans état avec mises à jour sans coupure ?","a":"Deployment","w":["StatefulSet","DaemonSet","Job"]},{"id":"k8s-f1-9","q":"Quel objet pour une base de données (identité et stockage stables) ?","a":"StatefulSet","w":["Deployment","DaemonSet","ReplicaSet"]},{"id":"k8s-f1-10","q":"Quel objet garantit un pod sur CHAQUE nœud (ex : monitoring) ?","a":"DaemonSet","w":["Deployment","StatefulSet","CronJob"]},{"id":"k8s-f1-11","q":"Quel objet pour une tâche planifiée ?","a":"CronJob","w":["Job","DaemonSet","Deployment"]}]},{"title":"Réseau, config et scaling","src":"fiche","qs":[{"id":"k8s-f2-1","q":"À quoi sert un Service ?","a":"Donner une IP stable et un nom DNS à un groupe de pods","w":["Exposer le cluster en HTTPS avec un domaine","Stocker la configuration","Isoler les environnements"]},{"id":"k8s-f2-2","q":"À quoi sert un Ingress ?","a":"Point d'entrée HTTP/HTTPS externe : routage par domaine et SSL","w":["IP interne stable pour les pods","Pare-feu entre pods","Stockage persistant"]},{"id":"k8s-f2-3","q":"À quoi sert une NetworkPolicy ?","a":"C'est le pare-feu interne qui restreint le trafic entre pods","w":["Exposer les pods sur internet","Attribuer des IP aux nœuds","Chiffrer les secrets"]},{"id":"k8s-f2-4","q":"Différence entre ConfigMap et Secret ?","a":"ConfigMap pour la config non sensible, Secret pour les données sensibles","w":["Secret pour la config, ConfigMap pour les mots de passe","Les deux chiffrent les données","Aucune différence"]},{"id":"k8s-f2-5","q":"Qu'est-ce qu'un PVC ?","a":"Une demande de stockage liée à un PersistentVolume","w":["Un disque physique du nœud","Un type de pod","Une règle réseau"]},{"id":"k8s-f2-6","q":"Que fait le HPA ?","a":"Ajoute ou retire des pods selon la charge CPU/RAM","w":["Agrandit le CPU/RAM des pods existants","Ajoute des nœuds au cluster","Redémarre les pods en erreur"]},{"id":"k8s-f2-7","q":"Que fait le VPA ?","a":"Ajuste le CPU/RAM des pods existants","w":["Ajoute des pods selon la charge","Ajoute des nœuds","Répartit le trafic"]},{"id":"k8s-f2-8","q":"À quoi sert un Namespace ?","a":"Isoler des environnements ou des équipes dans un même cluster","w":["Nommer les pods","Stocker les secrets","Relier deux clusters"]},{"id":"k8s-f2-9","q":"À quoi servent les Taints & Tolerations ?","a":"Réserver des nœuds à certains pods (ex : nœuds GPU)","w":["Signaler des pods en erreur","Limiter la RAM des pods","Chiffrer le trafic"]},{"id":"k8s-f2-10","q":"Qu'est-ce que Helm ?","a":"Un gestionnaire de paquets pour générer les manifestes Kubernetes","w":["L'outil en ligne de commande de Kubernetes","Un orchestrateur concurrent","Le tableau de bord du cluster"]},{"id":"k8s-f2-11","q":"Quel est l'outil en ligne de commande principal de Kubernetes ?","a":"kubectl","w":["kubeadm-cli","helm","k8sctl"]}]}]}];
const COLORS={linux:"#C2410C",git:"#D9480F",docker:"#1D72B8",ansible:"#B42318",terraform:"#6941C6",aws:"#C77700",cicd:"#3B5BDB",k8s:"#2F6FDB"};
const BADGE={linux:"$_",git:"git",docker:"🐳",ansible:"A",terraform:"tf",aws:"aws",cicd:"CI",k8s:"k8s"};
const PASS=0.7;
const $=id=>document.getElementById(id);
const h=(tag,attrs={},...kids)=>{const e=document.createElement(tag);for(const[k,v]of Object.entries(attrs)){if(v==null)continue;if(k==="class")e.className=v;else if(k==="html")e.innerHTML=v;else if(k.startsWith("on"))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v)}for(const c of kids.flat()){if(c==null||c===false)continue;e.append(c.nodeType?c:document.createTextNode(c))}return e};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=s=>esc(s).replace(/`([^`]+)`/g,"<code>$1</code>");
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const QINDEX={};BANK.forEach(t=>t.steps.forEach((s,si)=>s.qs.forEach(q=>QINDEX[q.id]={q,t:t.id,si})));
const TOTAL_STEPS=BANK.reduce((n,t)=>n+t.steps.length,0);

/* ---- Sauvegarde sur le téléphone ---- */
const KEY="devops-quiz-v1";
let S={best:{},miss:{},xp:0,streak:0,last:null};
try{const raw=localStorage.getItem(KEY);if(raw)S=Object.assign(S,JSON.parse(raw))}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function touchStreak(){const t=today();if(S.last===t)return;S.streak=S.last===yesterday()?S.streak+1:1;S.last=t}
function stepKey(tid,si){return tid+":"+si}
function stars(p){return p>=1?3:p>=.85?2:p>=PASS?1:0}
function starEl(n){const e=h("span",{class:"stars","aria-label":n+" étoile"+(n>1?"s":"")+" sur 3"});for(let i=0;i<3;i++)e.append(h("span",{class:i<n?"":"off"},"★"));return e}
function isOpen(t,si){return si===0||(S.best[stepKey(t.id,si-1)]||0)>=PASS}
function doneSteps(t){return t.steps.filter((s,si)=>(S.best[stepKey(t.id,si)]||0)>=PASS).length}
function yesterday(){const y=new Date();y.setDate(y.getDate()-1);return y.getFullYear()+"-"+String(y.getMonth()+1).padStart(2,"0")+"-"+String(y.getDate()).padStart(2,"0")}
function refreshChips(){const st=(S.last===today()||S.last===yesterday())?S.streak:0;$("streak").textContent=st;$("xp").textContent=S.xp}
function toast(m){const t=$("toast");t.textContent=m;t.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>t.hidden=true,2200)}

/* ---- Navigation ---- */
let stack=[];
function go(view,arg,replace){if(replace)stack.pop();stack.push([view,arg]);render()}
function back(){if(quizState&&!quizState.finished&&quizState.i>0&&stack[stack.length-1][0]==="quiz"){if(!backArmed){backArmed=true;toast("Appuie encore pour quitter la série");setTimeout(()=>backArmed=false,2500);return}}backArmed=false;stack.pop();if(!stack.length)stack=[["home"]];render()}
let backArmed=false;
$("back").onclick=back;
window.addEventListener("popstate",()=>{if(stack.length>1){back();history.pushState(null,"")}});
history.pushState(null,"");
function render(){const[view,arg]=stack[stack.length-1];$("back").hidden=stack.length<=1;refreshChips();const app=$("app");app.replaceChildren();window.scrollTo(0,0);({home:viewHome,theme:viewTheme,quiz:viewQuiz,result:viewResult})[view](app,arg)}

/* ---- Accueil ---- */
let deferredPrompt=null;
window.addEventListener("beforeinstallprompt",e=>{e.preventDefault();deferredPrompt=e;if(stack[stack.length-1][0]==="home")render()});
const standalone=()=>matchMedia("(display-mode: standalone)").matches||navigator.standalone===true;
function viewHome(app){
  $("title").textContent="DevOps Quiz";
  const done=BANK.reduce((n,t)=>n+doneSteps(t),0);
  app.append(h("section",{class:"card hero"},
    h("div",{class:"hero-row"},
      h("div",{},h("div",{class:"label"},"Ta progression"),h("div",{class:"big"},done+" / "+TOTAL_STEPS),h("div",{class:"small"},"étapes validées")),
      h("div",{style:"text-align:right"},h("div",{class:"big"},String(Object.keys(QINDEX).length)),h("div",{class:"small"},"questions"))),
    h("div",{class:"bar"},h("i",{style:"width:"+Math.round(done/TOTAL_STEPS*100)+"%"}))));
  const missN=Object.keys(S.miss).filter(id=>QINDEX[id]).length;
  app.append(h("button",{class:"card review",disabled:missN?null:"",onclick:()=>missN&&startReview()},
    h("span",{class:"ico"},String(missN)),
    h("span",{style:"flex:1;min-width:0"},h("b",{},"Revoir mes erreurs"),h("span",{class:"small"},missN?"Les questions ratées reviennent jusqu'à ce que tu les réussisses":"Aucune erreur à revoir pour l'instant"))));
  app.append(h("button",{class:"btn btn-ghost",onclick:startRandom},"🎲  Série aléatoire · 10 questions"));
  const grid=h("div",{class:"themes"});
  BANK.forEach(t=>{const d=doneSteps(t),n=t.steps.length;
    grid.append(h("button",{class:"card theme",onclick:()=>go("theme",t.id)},
      h("span",{class:"badge",style:"background:"+COLORS[t.id]},BADGE[t.id]),
      h("span",{},h("b",{},t.name),h("div",{class:"sub"},t.sub)),
      h("span",{class:"foot"},h("span",{},d+"/"+n+" étapes"),h("span",{class:"bar"},h("i",{style:"width:"+Math.round(d/n*100)+"%;background:"+COLORS[t.id]})))))});
  app.append(h("div",{class:"label",style:"margin-top:4px"},"Thèmes"),grid);
  if(!standalone()){
    const ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
    const box=h("section",{class:"card install"},h("b",{},"Installer l'appli sur ton téléphone"));
    if(deferredPrompt){box.append(h("p",{},"Ajoute DevOps Quiz à ton écran d'accueil : elle s'ouvrira comme une appli, même sans connexion."),h("button",{class:"btn btn-primary",onclick:async()=>{deferredPrompt.prompt();await deferredPrompt.userChoice;deferredPrompt=null;render()}},"Installer"))}
    else if(ios){box.append(h("p",{html:"Dans Safari, touche <b>Partager</b> (le carré avec la flèche), puis <b>Sur l'écran d'accueil</b>."}))}
    else{box.append(h("p",{html:"Dans Chrome, ouvre le menu <b>⋮</b> puis <b>Installer l'application</b> (ou <b>Ajouter à l'écran d'accueil</b>)."}))}
    app.append(box);
  }
  app.append(h("button",{class:"danger",onclick:resetAll},"Remettre ma progression à zéro"));
}
let resetArmed=false;
function resetAll(){if(!resetArmed){resetArmed=true;toast("Touche encore une fois pour tout effacer");setTimeout(()=>resetArmed=false,3000);return}S={best:{},miss:{},xp:0,streak:0,last:null};save();resetArmed=false;toast("Progression remise à zéro");render()}

/* ---- Thème : parcours par étapes ---- */
function viewTheme(app,tid){
  const t=BANK.find(x=>x.id===tid);$("title").textContent=t.name;
  const d=doneSteps(t);
  app.append(h("section",{class:"card hero"},h("div",{class:"label"},t.sub),
    h("div",{},h("div",{class:"big"},d+" / "+t.steps.length),h("div",{class:"small"},"étapes validées · 70 % pour débloquer la suivante")),
    h("div",{class:"bar"},h("i",{style:"width:"+Math.round(d/t.steps.length*100)+"%;background:"+COLORS[t.id]}))));
  const path=h("div",{class:"path"});
  t.steps.forEach((s,si)=>{const best=S.best[stepKey(t.id,si)];const open=isOpen(t,si);const done=(best||0)>=PASS;
    const cls="step "+(done?"done":open?"open":"locked");
    path.append(h("button",{class:cls,disabled:open?null:"",onclick:()=>open&&startStep(t.id,si),"aria-label":"Étape "+(si+1)+" : "+s.title+(open?"":" (verrouillée)")},
      h("span",{class:"node"},done?"✓":open?String(si+1):"🔒"),
      h("span",{class:"info"},h("b",{},s.title),
        h("span",{class:"meta"},s.src==="quiz"?h("span",{class:"tag"},"Ton quiz"):null,h("span",{},s.qs.length+" questions"),best!=null?starEl(stars(best)):null,best!=null?h("span",{},"meilleur : "+Math.round(best*100)+" %"):null))))});
  app.append(path);
}

/* ---- Série de questions ---- */
let quizState=null;
function prepare(q){const opts=q.o?q.o.slice():shuffle([q.a,...q.w]);return{q,opts,correct:opts.indexOf(q.a)}}
function startStep(tid,si){const t=BANK.find(x=>x.id===tid);quizState={mode:"step",tid,si,title:t.name+" · Étape "+(si+1),items:shuffle(t.steps[si].qs).map(prepare),i:0,good:0,answered:false,missed:[]};go("quiz")}
function startReview(){const ids=shuffle(Object.keys(S.miss).filter(id=>QINDEX[id])).slice(0,15);quizState={mode:"review",title:"Mes erreurs",items:ids.map(id=>prepare(QINDEX[id].q)),i:0,good:0,answered:false,missed:[]};go("quiz")}
function startRandom(){const all=Object.values(QINDEX).map(x=>x.q);quizState={mode:"random",title:"Série aléatoire",items:shuffle(all).slice(0,10).map(prepare),i:0,good:0,answered:false,missed:[]};go("quiz")}
function viewQuiz(app){
  const st=quizState;if(!st){back();return}
  $("title").textContent=st.title;
  const it=st.items[st.i];const n=st.items.length;
  app.append(h("div",{class:"qhead"},h("div",{class:"bar"},h("i",{style:"width:"+Math.round(st.i/n*100)+"%"})),h("span",{},(st.i+1)+"/"+n)));
  const theme=BANK.find(t=>t.id===QINDEX[it.q.id].t);
  app.append(h("section",{class:"card qcard"},h("div",{class:"label",style:"color:"+COLORS[theme.id]},theme.name),h("h2",{html:fmt(it.q.q)})));
  const opts=h("div",{class:"opts"});const keys="ABCDE";
  const fb=h("div");const bottom=h("div",{class:"bottom"});
  it.opts.forEach((o,k)=>{const b=h("button",{class:"opt"},h("span",{class:"k"},keys[k]),h("span",{html:fmt(o)}));
    b.onclick=()=>{if(st.answered)return;st.answered=true;const ok=k===it.correct;
      [...opts.children].forEach((x,j)=>{x.disabled=true;if(j===it.correct)x.classList.add("right");else if(j===k)x.classList.add("wrong");else x.classList.add("dim")});
      if(ok){st.good++;S.xp+=10;if(S.miss[it.q.id]){S.miss[it.q.id]--;if(S.miss[it.q.id]<=0)delete S.miss[it.q.id]}}
      else{st.missed.push(it);S.miss[it.q.id]=2}
      touchStreak();save();refreshChips();
      try{navigator.vibrate&&navigator.vibrate(ok?15:[30,40,30])}catch(e){}
      fb.replaceChildren(h("div",{class:"feedback "+(ok?"good":"bad")},
        h("b",{},ok?pick(["Bien joué !","Exact !","Parfait !","C'est ça !"]):"Pas tout à fait"),
        ok?null:h("p",{html:"Bonne réponse : <b>"+fmt(it.q.a)+"</b>"}),
        it.q.x?h("p",{html:fmt(it.q.x)}):null));
      const last=st.i===n-1;
      bottom.replaceChildren(h("button",{class:"btn btn-primary",onclick:()=>{if(last)finish();else{st.i++;st.answered=false;render()}}},last?"Voir mon résultat":"Question suivante"));
      bottom.firstChild.focus({preventScroll:true});fb.scrollIntoView({behavior:"smooth",block:"nearest"});
    };opts.append(b)});
  app.append(opts,fb,bottom);
}
const pick=a=>a[Math.floor(Math.random()*a.length)];
function finish(){const st=quizState;st.finished=true;const p=st.good/st.items.length;
  let unlocked=false;
  if(st.mode==="step"){const k=stepKey(st.tid,st.si);const prev=S.best[k]||0;if(p>prev)S.best[k]=p;if(p>=PASS&&prev<PASS){S.xp+=50;unlocked=true}}
  save();go("result",{p,unlocked},true)}
function viewResult(app,{p,unlocked}){
  const st=quizState;$("title").textContent=st.title;
  const n=stars(p);const t=st.tid?BANK.find(x=>x.id===st.tid):null;
  const msg=st.mode!=="step"?(p>=PASS?"Belle série, continue comme ça.":"Ces questions reviendront dans « Mes erreurs ».")
    :p>=PASS?(unlocked?(st.si<t.steps.length-1?"Étape validée : la suivante est débloquée !":"Thème terminé, bravo !"):"Étape validée."):"Il faut 70 % pour valider. Revois tes erreurs et retente.";
  const s=starEl(n);s.classList.add("pop");
  app.append(h("section",{class:"card result"},st.mode==="step"?s:null,h("div",{class:"score"},Math.round(p*100)+" %"),h("div",{class:"small"},st.good+" bonnes réponses sur "+st.items.length),h("p",{},msg)));
  const acts=h("div",{class:"actions"});
  if(st.mode==="step"&&p>=PASS&&st.si<t.steps.length-1)acts.append(h("button",{class:"btn btn-primary",onclick:()=>{stack.pop();startStep(st.tid,st.si+1)}},"Étape suivante →"));
  if(st.missed.length)acts.append(h("button",{class:st.mode==="step"&&p>=PASS?"btn btn-ghost":"btn btn-primary",onclick:()=>{const items=shuffle(st.missed).map(x=>prepare(x.q));quizState={mode:"review",title:"Rattrapage",items,i:0,good:0,answered:false,missed:[]};go("quiz",null,true)}},"Refaire mes "+st.missed.length+" erreur"+(st.missed.length>1?"s":"")));
  if(st.mode==="step")acts.append(h("button",{class:"btn btn-ghost",onclick:()=>{stack.pop();startStep(st.tid,st.si)}},"Recommencer l'étape"));
  acts.append(h("button",{class:"btn btn-ghost",onclick:back},st.mode==="step"?"Retour aux étapes":"Retour à l'accueil"));
  app.append(acts);
  if(st.missed.length){const ul=h("ul");st.missed.forEach(x=>ul.append(h("li",{},h("span",{html:fmt(x.q.q)}),h("span",{class:"good",html:"→ "+fmt(x.q.a)}))));
    app.append(h("section",{class:"card missed"},h("div",{class:"label"},"À retenir"),ul))}
}

stack=[["home"]];render();
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}
</script>
