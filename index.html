:"Met de côté tes modifications en cours","w":["Supprime tes modifications","Crée un commit temporaire sur le serveur","Sauvegarde le dépôt dans une archive"],"why":"`stash` range tes modifications non commitées dans une pile et remet ton dossier propre. Tu peux changer de branche, puis les récupérer avec `stash pop`.","wx":["Rien n'est perdu : elles sont mises de côté.","Le stash est local et n'est jamais envoyé au serveur.","Aucune archive n'est créée ; c'est une pile interne à Git."]},{"id":"git-f3-7","q":"Différence entre `git stash pop` et `git stash apply` ?","a":"pop applique et retire le stash de la liste, apply le garde","w":["apply applique et retire, pop le garde","pop supprime sans appliquer","Aucune différence"],"why":"Les deux réappliquent le stash. `pop` le retire ensuite de la liste ; `apply` le laisse, ce qui permet de l'appliquer ailleurs.","wx":["C'est l'inverse.","Supprimer sans appliquer, c'est `git stash drop`.","La différence est de garder le stash dans la liste ou non."]},{"id":"git-f3-8","q":"Que fait `git reset --soft HEAD~1` ?","a":"Annule le dernier commit en gardant les modifications dans le staging","w":["Annule le dernier commit et efface les modifications","Annule le dernier commit et sort les modifs du staging","Crée un commit qui annule le précédent"],"why":"`--soft` recule la branche d'un commit, mais garde tous les changements dans le staging : tu peux recommiter tout de suite, par exemple avec un meilleur message.","wx":["Effacer les changements, c'est `--hard`.","Sortir du staging en gardant les modifs, c'est `--mixed` (le mode par défaut).","Créer un commit inverse, c'est `git revert`."]},{"id":"git-f3-9","q":"Que fait `git reset --hard HEAD~1` ?","a":"Annule le dernier commit ET efface les modifications","w":["Annule le commit en gardant les modifications","Revient au commit sans rien supprimer","Annule seulement le dernier push"],"x":"Très dangereux : les modifications sont perdues.","why":"`--hard` recule la branche ET remet ton dossier exactement comme le commit cible : les modifications du commit annulé sont perdues. C'est dangereux ; seul le reflog peut t'aider à les retrouver.","wx":["Garder les modifications, c'est `--soft` ou `--mixed`.","`--hard` supprime justement les modifications.","reset agit en local ; il n'annule rien sur le serveur."]},{"id":"git-f3-10","q":"Quelle commande annule un commit sans réécrire l'historique ?","a":"git revert <hash>","w":["git reset --hard <hash>","git restore <hash>","git checkout -- <hash>"],"x":"revert crée un nouveau commit inverse : c'est la méthode sûre.","why":"`revert` crée un nouveau commit qui fait l'inverse du commit ciblé. L'historique est conservé, donc c'est sûr sur une branche déjà partagée.","wx":["reset --hard réécrit l'historique en supprimant des commits : à éviter sur une branche partagée.","restore agit sur des fichiers, pas sur un commit.","`checkout --` restaure des fichiers, il n'annule pas un commit."]},{"id":"git-f3-11","q":"Que fait `git restore <fichier>` ?","a":"Annule les modifications non commitées du fichier","w":["Restaure un fichier supprimé du serveur","Retire le fichier du dernier commit","Récupère le fichier d'une autre branche"],"why":"`git restore` remet le fichier tel qu'il est dans le dernier commit (ou le staging) : tes modifications non commitées sont perdues. C'est l'équivalent moderne de `git checkout -- <fichier>`.","wx":["restore ne contacte pas le serveur.","Modifier le dernier commit, c'est `--amend`.","Ce serait possible avec `--source=<branche>`, mais sans option restore part du commit actuel."]},{"id":"git-f3-12","q":"Que fait `git clean -fd` ?","a":"Supprime les fichiers et dossiers non suivis","w":["Nettoie l'historique des commits","Vide le stash","Supprime les branches fusionnées"],"x":"DANGER : les fichiers sont effacés.","why":"`clean` supprime les fichiers non suivis par Git ; `-f` (force) est obligatoire, `-d` inclut les dossiers. C'est définitif : teste d'abord avec `-n` pour voir ce qui serait supprimé.","wx":["clean ne touche pas à l'historique.","Vider le stash, c'est `git stash clear`.","Supprimer des branches, c'est `git branch -d`."]},{"id":"git-f3-13","q":"Quel type de tag est recommandé ?","a":"Le tag annoté : git tag -a v1.0.0 -m \"Version 1\"","w":["Le tag léger : git tag v1.0.0","Le tag distant : git tag --remote v1.0.0","Le tag forcé : git tag -f v1.0.0"],"why":"Un tag annoté (`-a`) est un vrai objet Git : il stocke l'auteur, la date et un message, et peut être signé. C'est la pratique recommandée pour marquer une version.","wx":["Le tag léger n'est qu'un pointeur sans message ni auteur ; il convient pour un usage personnel ou temporaire.","`--remote` n'existe pas : un tag se crée en local puis se pousse.","`-f` remplace un tag existant ; ce n'est pas une bonne pratique."]},{"id":"git-f3-14","q":"Comment pousser tous les tags ?","a":"git push --tags","w":["git push origin --all-tags","git tag --push","git push -t"],"why":"Par défaut, push n'envoie pas les tags ; `--tags` les pousse tous. Pour un seul tag : `git push origin v1.0.0`.","wx":["`--all-tags` n'existe pas.","`git tag` n'a pas d'option `--push`.","`-t` n'est pas l'option des tags pour push."]}]}]},{"id":"docker","name":"Docker","sub":"Images, volumes, réseaux","steps":[{"title":"Quiz de formation 1/2","src":"quiz","qs":[{"id":"docker-01","q":"Dockerfile est écrit en :","a":"Aucune des réponses ci-dessus","w":["Go","Javascript","YAML"],"o":["Go","Javascript","YAML","Aucune des réponses ci-dessus"],"x":"Un Dockerfile est écrit dans sa propre syntaxe (un DSL), ni Go ni YAML.","why":"Un Dockerfile utilise sa propre syntaxe (un DSL) : des instructions comme FROM, RUN, COPY, CMD. Ce n'est ni du Go, ni du JavaScript, ni du YAML, d'où la réponse « Aucune ».","wx":["Go est le langage dans lequel Docker lui-même est écrit, pas celui du Dockerfile.","Aucun lien avec JavaScript.","YAML est le format de docker-compose.yml, pas du Dockerfile."]},{"id":"docker-02","q":"Lequel des éléments suivants n’est pas une alternative basée sur des conteneurs à Docker ?","a":"Kubernetes","w":["Conteneurs Windows Server","LXD de Canonical","rkt de CoreOS"],"why":"Kubernetes n'est pas un moteur de conteneurs : c'est un orchestrateur qui pilote des conteneurs lancés par un runtime (containerd…). Ce n'est donc pas une alternative à Docker au même niveau.","wx":["Les conteneurs Windows Server sont bien un moteur de conteneurs.","LXD (Canonical) est un gestionnaire de conteneurs système : une vraie alternative.","rkt (CoreOS) était un moteur de conteneurs concurrent de Docker, aujourd'hui abandonné."]},{"id":"docker-03","q":"Que se passe-t-il si vous tentez d’effectuer un docker build en vous basant sur une image qui n’a pas encore été utilisée (référencée) sur votre machine ?","a":"Docker téléchargera l’image depuis Docker Hub.","w":["Docker retournera un message 404 : fichier introuvable.","Docker retournera un message 408 : image introuvable.","Docker téléchargera l’image depuis GitHub."],"why":"Si l'image du `FROM` n'est pas en local, Docker la télécharge automatiquement depuis le registre par défaut, Docker Hub, puis continue le build.","wx":["Docker ne répond pas par une erreur HTTP 404 : il télécharge l'image.","Pas d'erreur 408 non plus ; le téléchargement est automatique.","Le registre par défaut est Docker Hub. GitHub a son propre registre (ghcr.io), mais il faut l'indiquer explicitement."]},{"id":"docker-04","q":"docker a été écrit en quel langage","a":"GO","w":["C","JAVA","C++"],"why":"Docker est écrit en Go, le langage de Google, comme Kubernetes et Terraform : il est compilé, rapide et simple à distribuer.","wx":["Ce n'est pas du C, même si Docker s'appuie sur des fonctions du noyau Linux écrit en C.","Ce n'est pas du Java.","Ce n'est pas du C++."]},{"id":"docker-05","q":"Comment spécifier un Dockerfile autre que le \"Dockerfile\" par défaut lors du processus de build ?","a":"Utiliser l'option --file","w":["Utiliser l'option --filename","Utiliser l'option --source","Utiliser l'option --dockerfile"],"why":"`docker build --file chemin` (ou `-f`) indique un autre Dockerfile, par exemple `docker build -f Dockerfile.prod .`.","wx":["`--filename` n'existe pas.","`--source` n'existe pas ; le contexte de build est le dernier argument (le `.`).","`--dockerfile` n'existe pas en ligne de commande. Le mot-clé `dockerfile:` existe dans docker-compose.yml, ce qui peut prêter à confusion."]},{"id":"docker-06","q":"Quelle commande permet de créer un nouveau volume dans Docker ?","a":"docker volume create","w":["docker new volume","docker create volume","docker create -v"],"why":"Les commandes Docker suivent le schéma `docker <objet> <action>` : `docker volume create`, `docker network ls`, `docker image rm`…","wx":["`new` n'est pas une action Docker.","L'objet vient avant l'action : volume puis create.","`-v` sert à monter un volume au lancement d'un conteneur (`docker run -v`), pas à le créer."]},{"id":"docker-07","q":"Comment pouvez-vous partager des volumes de stockage entre des conteneurs ?","a":"En utilisant --volumes-from","w":["En utilisant --share-storage","En utilisant --connect-volumes","En utilisant --link"],"why":"`docker run --volumes-from conteneurA` monte dans le nouveau conteneur tous les volumes de conteneurA. Les deux partagent alors les mêmes données.","wx":["`--share-storage` n'existe pas.","`--connect-volumes` n'existe pas.","`--link` reliait des conteneurs côté réseau ; c'est obsolète et ça ne concerne pas les volumes."]},{"id":"docker-08","q":"Le fichier .dockerignore est utilisé pour","a":"Empêcher certains fichiers et répertoires d'être copiés dans une image","w":["Lister toutes les images à télécharger depuis Docker Hub","Spécifier les commandes à exécuter à l'intérieur d'un conteneur","Fournir des métadonnées sur une image Docker"],"why":"Comme .gitignore, .dockerignore liste les fichiers à exclure du contexte de build (node_modules, .git, .env…). L'image est plus légère et les secrets n'y entrent pas.","wx":["Aucune liste d'images à télécharger ; c'est FROM qui choisit l'image de base.","Les commandes à exécuter se mettent dans le Dockerfile (RUN, CMD).","Les métadonnées se définissent avec LABEL dans le Dockerfile."]}]},{"title":"Quiz de formation 2/2","src":"quiz","qs":[{"id":"docker-09","q":"Quelle commande permet de lister tous les réseaux Docker disponibles ?","a":"docker network ls","w":["docker list network","docker show networks","docker network list"],"why":"Même schéma que les autres commandes : objet `network`, action `ls`. Tu vois bridge, host, none et tes réseaux personnalisés.","wx":["L'ordre est objet puis action, et l'action s'appelle `ls`.","`show` n'existe pas.","L'action est `ls`, pas `list`."]},{"id":"docker-10","q":"Quel type de réseau Docker est créé par défaut lorsqu’aucun n’est spécifié ?","a":"bridge","w":["overlay","host","none"],"why":"Sans `--network`, un conteneur est branché sur le réseau bridge par défaut : un réseau privé sur l'hôte, avec du NAT pour sortir.","wx":["overlay relie des conteneurs sur plusieurs hôtes (Swarm) ; ce n'est pas le réseau par défaut.","host partage le réseau de la machine ; il faut le demander explicitement.","none coupe tout réseau ; il faut aussi le demander."]},{"id":"docker-11","q":"Quelle commande Docker affiche l'historique et les couches intermédiaires d'une image ?","a":"docker history","w":["docker layers","docker inspect","docker details"],"why":"`docker history image` liste chaque couche de l'image avec l'instruction qui l'a créée et sa taille. Pratique pour savoir pourquoi une image est lourde.","wx":["`docker layers` n'existe pas.","`docker inspect` donne la configuration en JSON, pas l'historique couche par couche.","`docker details` n'existe pas."]},{"id":"docker-12","q":"Dans un fichier docker-compose.yml, quelle est la fonction de la clé depends_on ?","a":"Spécifie l’ordre dans lequel les services sont démarrés","w":["Spécifie les images de base pour les services","Spécifie les liens réseau entre les services","Spécifie le contexte de construction des services"],"why":"`depends_on` dit à Compose de démarrer un service après un autre (ex : l'appli après la base). Attention : il attend le démarrage, pas que le service soit prêt, sauf avec une condition de healthcheck.","wx":["L'image se définit avec `image:`.","Les réseaux se définissent avec `networks:`.","Le contexte de build se définit avec `build:`."]},{"id":"docker-13","q":"Quel est le but principal de Docker Swarm ?","a":"Orchestration de conteneurs sur plusieurs hôtes","w":["Gestion des versions d’images","Optimisation du stockage des conteneurs","Pipeline automatisé de création de conteneurs"],"why":"Swarm est l'orchestrateur intégré à Docker : il regroupe plusieurs machines en cluster et répartit les conteneurs dessus (réplicas, mises à jour progressives).","wx":["Les versions d'images se gèrent avec les tags et les registres.","Le stockage est géré par les drivers et les volumes.","Les pipelines relèvent du CI/CD (Jenkins, GitLab CI)."]},{"id":"docker-14","q":"Quelle est la principale différence entre ARG et ENV dans Docker ?","a":"ARG peut être utilisé uniquement pendant le build, tandis que ENV peut être utilisé pendant le build et à l'exécution du conteneur.","w":["ARG est pour des informations sensibles (ex : mots de passe), tandis que ENV est pour des paramètres de configuration.","ARG est pour l’exécution, et ENV est uniquement pour le build."],"why":"ARG existe seulement pendant `docker build` (on le passe avec `--build-arg`). ENV est inscrit dans l'image : il sert au build et reste présent quand le conteneur tourne.","wx":["Aucun des deux n'est fait pour les secrets : ils restent visibles dans l'historique de l'image. On utilise plutôt les secrets de BuildKit.","C'est l'inverse : ARG sert au build, ENV aussi au runtime."]},{"id":"docker-15","q":"Si tu veux que la variable définie avec ARG soit disponible dans l’image finale au runtime, quelle solution utiliser ?","a":"La variable ARG doit être directement copiée dans une variable ENV","w":["Utiliser ENV dans l’instruction CMD.","Utiliser ARG dans une instruction CMD.","Les variables ARG sont déjà disponibles au runtime, il n’y a rien à faire."],"why":"Comme ARG disparaît après le build, on recopie sa valeur dans ENV : `ARG VERSION` puis `ENV APP_VERSION=$VERSION`. La valeur est alors disponible au runtime.","wx":["CMD ne transforme pas une ARG en variable d'environnement.","Au moment de CMD (runtime), l'ARG n'existe plus.","C'est faux : ARG n'existe que pendant le build."]}]}]},{"id":"ansible","name":"Ansible","sub":"Configurer des serveurs","steps":[{"title":"Les concepts","src":"fiche","qs":[{"id":"ansible-f1-1","q":"Que veut dire « agentless » pour Ansible ?","a":"Aucun logiciel à installer sur les serveurs cibles : Ansible passe par SSH","w":["Ansible fonctionne sans serveur de contrôle","Ansible n'a pas besoin d'inventaire","Ansible n'utilise pas Python"],"x":"SSH pour Linux, WinRM pour Windows.","why":"« Agentless » veut dire sans agent : on n'installe rien de spécial sur les serveurs cibles. Ansible s'y connecte en SSH (WinRM pour Windows), y pousse de petits scripts Python, les exécute puis les supprime. Il suffit d'un accès SSH et de Python sur la cible.","wx":["Il faut au contraire une machine de contrôle, le Control Node, d'où tu lances Ansible.","L'inventaire est indispensable : c'est lui qui dit à Ansible quels serveurs gérer.","Ansible est écrit en Python et en a généralement besoin sur les cibles."]},{"id":"ansible-f1-2","q":"Qu'est-ce que le Control Node ?","a":"La machine où Ansible est installé et d'où tu lances les commandes","w":["Le serveur cible que tu configures","Le fichier qui liste les serveurs","Le serveur Ansible Galaxy"],"why":"Le Control Node est la machine sur laquelle Ansible est installé (ton PC ou un serveur d'admin) : c'est de là que partent les commandes vers les serveurs.","wx":["Le serveur cible s'appelle un Managed Node.","Le fichier qui liste les serveurs, c'est l'inventaire.","Galaxy est un site de partage de rôles, pas une machine de contrôle."]},{"id":"ansible-f1-3","q":"Comment s'appellent les serveurs gérés par Ansible ?","a":"Les Managed Nodes","w":["Les Control Nodes","Les Workers","Les Agents"],"why":"Les serveurs pilotés par Ansible sont les Managed Nodes : les cibles listées dans l'inventaire.","wx":["Le Control Node est la machine qui pilote, pas celles qui sont pilotées.","« Worker » est un terme de Kubernetes ou Jenkins, pas d'Ansible.","Ansible n'utilise justement pas d'agents."]},{"id":"ansible-f1-4","q":"Qu'est-ce que l'inventaire (inventory) ?","a":"Le fichier qui liste les serveurs à gérer","w":["La liste des modules installés","Le journal des exécutions","Le fichier des variables secrètes"],"why":"L'inventaire est le carnet d'adresses d'Ansible : il liste les IP ou noms des serveurs, souvent regroupés ([webservers], [databases]), avec parfois des variables.","wx":["Les modules sont fournis par Ansible et ses collections, pas par l'inventaire.","Ansible n'a pas de journal par défaut ; la sortie s'affiche dans le terminal.","Les secrets vont dans des fichiers chiffrés avec Ansible Vault."]},{"id":"ansible-f1-5","q":"Qu'est-ce qu'un playbook ?","a":"Un fichier YAML qui contient la liste des tâches à exécuter","w":["Un module qui installe des paquets","Un fichier JSON d'inventaire","Le journal des tâches exécutées"],"why":"Un playbook est un fichier YAML qui décrit des « plays » : sur quels hôtes, avec quels droits, et quelles tâches exécuter dans l'ordre. On le lance avec `ansible-playbook`.","wx":["Un module installe des paquets (apt) ; un playbook appelle les modules.","Un playbook est en YAML et décrit des tâches ; l'inventaire liste des hôtes.","Il décrit ce qu'il faut faire, ce n'est pas un journal de ce qui a été fait."]},{"id":"ansible-f1-6","q":"Qu'est-ce qu'un module Ansible ?","a":"Un petit programme qui fait une action précise (apt, copy, service…)","w":["Un groupe de serveurs","Un fichier de variables","Une extension de l'inventaire"],"why":"Un module est une brique d'action prête à l'emploi : apt installe un paquet, copy copie un fichier, service gère un service. Chaque tâche d'un playbook appelle un module.","wx":["Un groupe de serveurs se définit dans l'inventaire.","Les variables vont dans vars, vars_files, group_vars…","Un module agit sur les cibles ; il n'a rien à voir avec l'inventaire."]},{"id":"ansible-f1-7","q":"Que signifie l'idempotence pour Ansible ?","a":"Il n'agit que si nécessaire : relancé, il ne refait pas ce qui est déjà fait","w":["Il exécute toutes les tâches en parallèle","Il annule les tâches en cas d'erreur","Il réinstalle tout à chaque exécution"],"why":"Idempotent : Ansible vérifie l'état avant d'agir. Si nginx est déjà installé, la tâche affiche « ok » au lieu de « changed ». Tu peux relancer un playbook 10 fois, le résultat est le même.","wx":["Le parallélisme vient des forks, pas de l'idempotence.","Ansible n'annule pas automatiquement en cas d'erreur.","C'est exactement le contraire de l'idempotence."]},{"id":"ansible-f1-8","q":"Quels formats peut avoir un inventaire ?","a":"INI ou YAML","w":["JSON uniquement","XML ou CSV","Uniquement Python"],"why":"Un inventaire statique s'écrit en INI (format simple avec des [groupes]) ou en YAML (format recommandé).","wx":["Le JSON sert aux inventaires dynamiques (scripts) ; ce n'est pas le seul format.","XML et CSV ne sont pas des formats d'inventaire Ansible.","Un script Python peut produire un inventaire dynamique, mais ce n'est pas le seul format."]}]},{"title":"Commandes et playbooks","src":"fiche","qs":[{"id":"ansible-f2-1","q":"Que répond `ansible all -m ping` si la connexion fonctionne ?","a":"pong","w":["OK","200","ping"],"why":"Le module ping ne fait pas un ping réseau (ICMP) : il vérifie la connexion SSH et la présence de Python. Il répond `\"ping\": \"pong\"` quand tout va bien.","wx":["La réponse est « pong », en clin d'œil au ping-pong.","200 est un code HTTP ; ce n'est pas la réponse du module.","La réponse est « pong », pas « ping »."]},{"id":"ansible-f2-2","q":"Quel module lance une commande shell brute en ad-hoc ?","a":"shell","w":["command-raw","exec","bash"],"why":"Le module shell exécute une commande via /bin/sh : pipes `|`, redirections `>` et variables sont acceptés. Exemple : `ansible webservers -m shell -a \"uname -a\"`.","wx":["`command-raw` n'existe pas. Il existe `command` (sans shell) et `raw` (sans Python).","`exec` n'est pas un module Ansible.","`bash` n'est pas un module ; c'est shell qui lance le shell."]},{"id":"ansible-f2-3","q":"Dans une commande ansible, que signifie l'option -b ?","a":"become : exécuter en root (sudo)","w":["background : en arrière-plan","batch : par lots","backup : sauvegarder avant"],"why":"`-b` = `--become` : Ansible exécute la commande avec les droits d'un autre utilisateur, root par défaut, via sudo. Indispensable pour installer un paquet.","wx":["L'arrière-plan s'obtient avec `-B` (async) ; `-b` minuscule est become.","Le travail par lots, c'est `serial` dans un playbook.","Ansible n'a pas d'option de sauvegarde générale ; certains modules ont un paramètre `backup: yes`."]},{"id":"ansible-f2-4","q":"Comment lancer un playbook ?","a":"ansible-playbook -i inventory site.yml","w":["ansible run site.yml","ansible -p site.yml","ansible-run --playbook site.yml"],"why":"`ansible-playbook` est la commande dédiée aux playbooks ; `-i` indique l'inventaire et le dernier argument est le fichier YAML.","wx":["`ansible run` n'existe pas ; `ansible` seul sert aux commandes ad-hoc.","`ansible -p` n'existe pas.","`ansible-run` n'existe pas."]},{"id":"ansible-f2-5","q":"Dans un playbook, que fait `become: yes` ?","a":"Les tâches s'exécutent avec les droits root","w":["Le playbook devient le playbook par défaut","Les erreurs sont ignorées","Les tâches s'exécutent en parallèle"],"why":"`become: yes` active l'élévation de privilèges : les tâches tournent en root (via sudo), ce qu'il faut pour installer des paquets ou modifier /etc.","wx":["Il n'y a pas de notion de playbook « par défaut ».","Ignorer les erreurs, c'est `ignore_errors: yes`.","Le parallélisme dépend des forks, pas de become."]},{"id":"ansible-f2-6","q":"Avec le module apt, que fait `state: latest` ?","a":"Met à jour le paquet vers la dernière version","w":["Installe le paquet seulement s'il est absent","Désinstalle le paquet","Affiche la dernière version disponible"],"x":"present = installer, absent = désinstaller.","why":"`state: latest` installe le paquet s'il manque ET le met à jour s'il existe une version plus récente.","wx":["« Seulement s'il est absent », c'est `state: present`.","Désinstaller, c'est `state: absent`.","Le module agit ; il n'affiche pas simplement la version."]},{"id":"ansible-f2-7","q":"Quelle est la différence entre les modules copy et template ?","a":"template injecte des variables (Jinja2, .j2), copy copie tel quel","w":["copy injecte des variables, template copie tel quel","template crée des dossiers","Aucune différence"],"why":"copy envoie le fichier tel quel. template traite d'abord le fichier .j2 avec Jinja2 : les `{{ variables }}` sont remplacées par leurs valeurs, puis le résultat est envoyé. Idéal pour des fichiers de configuration qui changent selon le serveur.","wx":["C'est l'inverse.","Créer des dossiers, c'est le module file.","La différence, c'est le remplacement des variables."]},{"id":"ansible-f2-8","q":"Quel module démarre, arrête ou redémarre un service ?","a":"service","w":["systemctl","daemon","process"],"why":"Le module service (ou systemd) gère les services : `state: started`, `stopped` ou `restarted`, et `enabled: yes` pour un démarrage au boot.","wx":["systemctl est la commande Linux ; le module Ansible s'appelle service (ou systemd).","Il n'y a pas de module « daemon ».","Il n'y a pas de module « process »."]},{"id":"ansible-f2-9","q":"Quel module ajoute une clé SSH publique à un utilisateur ?","a":"authorized_key","w":["ssh_key","user_key","copy_key"],"why":"authorized_key ajoute une clé publique dans ~/.ssh/authorized_keys de l'utilisateur cible : il peut alors se connecter en SSH avec sa clé, sans mot de passe.","wx":["Il n'y a pas de module ssh_key.","user_key n'existe pas ; le module user crée des utilisateurs.","copy_key n'existe pas (ne pas confondre avec la commande `ssh-copy-id`)."]},{"id":"ansible-f2-10","q":"Que fait `ansible-playbook site.yml --check` ?","a":"Simule l'exécution sans rien modifier","w":["Vérifie seulement la syntaxe","Exécute puis annule","Vérifie la connexion SSH"],"why":"`--check` (dry run) simule le playbook : Ansible indique ce qu'il aurait changé, sans rien modifier. On l'associe souvent à `--diff`.","wx":["Vérifier seulement la syntaxe, c'est `--syntax-check`.","Rien n'est exécuté, donc rien à annuler.","La connexion se teste avec `ansible -m ping`."]},{"id":"ansible-f2-11","q":"À quoi sert `-vvv` sur ansible-playbook ?","a":"Afficher un maximum de détails pour déboguer","w":["Valider trois fois le playbook","Lancer en mode rapide","Vérifier la version d'Ansible"],"why":"Chaque `v` ajoute du détail : `-v` les résultats, `-vvv` aussi la connexion SSH, `-vvvv` encore plus. C'est l'outil de débogage n°1.","wx":["Les v ne valident rien ; ils augmentent la verbosité.","Plus de détails rend l'exécution plutôt plus lente.","La version, c'est `ansible --version`."]}]},{"title":"Variables, handlers et rôles","src":"fiche","qs":[{"id":"ansible-f3-1","q":"Comment inclure un fichier de variables dans un playbook ?","a":"vars_files","w":["include_vars_file","variables","import_vars"],"why":"Dans un play, `vars_files:` suivi d'une liste de fichiers YAML charge leurs variables.","wx":["Le module s'appelle `include_vars`, pas `include_vars_file`, et il s'utilise comme une tâche.","Le mot-clé `vars` définit des variables directement, pas un fichier.","`import_vars` n'existe pas."]},{"id":"ansible-f3-2","q":"Que sont les facts ?","a":"Les infos collectées automatiquement sur la cible (OS, IP, RAM…)","w":["Les variables que tu définis toi-même","Les résultats des tâches","Les logs d'exécution"],"why":"Au début d'un play, Ansible collecte automatiquement des infos sur chaque cible : distribution (ansible_distribution), IP, RAM, CPU… Ce sont les facts. On les utilise comme des variables, par exemple `when: ansible_os_family == \"Debian\"`.","wx":["Celles-là, ce sont tes variables ; les facts sont collectés automatiquement.","Le résultat d'une tâche se capture avec `register`.","Les facts sont des données système, pas des logs."]},{"id":"ansible-f3-3","q":"Quand un handler s'exécute-t-il ?","a":"Seulement si une tâche qui le notifie a fait un changement","w":["À chaque exécution du playbook","Uniquement en cas d'erreur","Avant toutes les tâches"],"x":"Typique : redémarrer Nginx seulement si sa config a changé.","why":"Un handler ne tourne que s'il est notifié par une tâche qui a réellement changé quelque chose (statut « changed »). Il s'exécute à la fin du play, une seule fois même si plusieurs tâches le notifient.","wx":["S'il n'y a aucun changement, il ne s'exécute pas.","Le cas d'erreur se gère avec `rescue` ou un handler de rattrapage, pas avec les handlers classiques.","Les handlers s'exécutent à la fin, pas au début."]},{"id":"ansible-f3-4","q":"Quel mot-clé déclenche un handler depuis une tâche ?","a":"notify","w":["trigger","handler","call"],"why":"Dans une tâche, `notify: Nom du handler` déclenche le handler portant ce nom si la tâche est « changed ».","wx":["`trigger` n'est pas un mot-clé Ansible.","`handlers:` est la section où on définit les handlers, pas le mot-clé qui les déclenche.","`call` n'existe pas."]},{"id":"ansible-f3-5","q":"Dans un rôle, quel dossier contient la liste principale des tâches ?","a":"tasks/ (main.yml)","w":["defaults/","handlers/","meta/"],"why":"tasks/main.yml est le point d'entrée d'un rôle : c'est la liste des tâches exécutées quand on appelle le rôle.","wx":["defaults/ contient les variables par défaut.","handlers/ contient les handlers.","meta/ contient les dépendances et les infos du rôle."]},{"id":"ansible-f3-6","q":"Dans un rôle, à quoi sert le dossier defaults/ ?","a":"Les variables par défaut","w":["Les tâches principales","Les dépendances du rôle","Les fichiers statiques"],"why":"defaults/main.yml contient les variables par défaut du rôle, de priorité la plus basse : l'utilisateur peut les écraser facilement.","wx":["Les tâches sont dans tasks/.","Les dépendances sont dans meta/.","Les fichiers statiques sont dans files/."]},{"id":"ansible-f3-7","q":"Dans un rôle, à quoi sert le dossier meta/ ?","a":"Les dépendances du rôle","w":["Les templates Jinja2","Les variables par défaut","Les handlers"],"why":"meta/main.yml décrit le rôle (auteur, plateformes) et surtout ses dépendances : les autres rôles à exécuter avant lui.","wx":["Les templates sont dans templates/.","Les variables par défaut sont dans defaults/.","Les handlers sont dans handlers/."]},{"id":"ansible-f3-8","q":"Quel mot-clé permet de répéter une tâche sur plusieurs éléments ?","a":"loop","w":["repeat","for","each"],"x":"Ancienne syntaxe : with_items.","why":"`loop:` suivi d'une liste répète la tâche pour chaque élément, accessible avec `{{ item }}`. C'est la syntaxe moderne qui remplace with_items.","wx":["`repeat` n'existe pas.","`for` existe dans les templates Jinja2, pas comme mot-clé de tâche.","`each` n'existe pas."]},{"id":"ansible-f3-9","q":"Quel mot-clé exécute une tâche seulement si une condition est vraie ?","a":"when","w":["if","only_if","condition"],"why":"`when:` contient une condition (sans `{{ }}`) : la tâche ne s'exécute que si elle est vraie. Exemple : `when: ansible_os_family == \"Debian\"`.","wx":["`if` existe en Jinja2, pas comme mot-clé de tâche.","`only_if` n'existe pas (c'est du Chef).","`condition` n'est pas un mot-clé Ansible."]},{"id":"ansible-f3-10","q":"Comment chiffrer un fichier de secrets ?","a":"ansible-vault encrypt secret.yml","w":["ansible-secret lock secret.yml","ansible-playbook --encrypt secret.yml","ansible -m vault secret.yml"],"why":"`ansible-vault encrypt` chiffre le fichier en AES256 avec un mot de passe. Il reste utilisable dans les playbooks et peut être commité sans exposer les secrets.","wx":["`ansible-secret` n'existe pas.","ansible-playbook n'a pas d'option `--encrypt`.","Vault est une commande à part, pas un module."]},{"id":"ansible-f3-11","q":"Comment lancer un playbook qui utilise un fichier chiffré ?","a":"ansible-playbook site.yml --ask-vault-pass","w":["ansible-playbook site.yml --decrypt","ansible-vault run site.yml","ansible-playbook site.yml -p"],"why":"`--ask-vault-pass` demande le mot de passe au lancement, ce qui permet de déchiffrer les fichiers Vault à la volée. On peut aussi utiliser `--vault-password-file`.","wx":["`--decrypt` n'existe pas pour ansible-playbook.","`ansible-vault run` n'existe pas ; Vault chiffre et déchiffre, il ne lance pas de playbook.","`-p` n'est pas l'option du mot de passe Vault."]},{"id":"ansible-f3-12","q":"Qu'est-ce qu'Ansible Galaxy ?","a":"Le « Docker Hub » des rôles Ansible, écrits par la communauté","w":["L'interface graphique d'Ansible","Le module de gestion du cloud","La version payante d'Ansible"],"why":"Galaxy (galaxy.ansible.com) est une bibliothèque publique de rôles et collections partagés par la communauté. On les installe avec `ansible-galaxy install geerlingguy.nginx`.","wx":["L'interface web, c'est AWX ou Ansible Automation Platform.","Les modules cloud sont dans des collections (amazon.aws…), pas « Galaxy » en soi.","Galaxy est gratuit et communautaire."]}]},{"title":"Quiz de formation 1/2","src":"quiz","qs":[{"id":"ansible-01","q":"Comment déclarer des variables dans Ansible ?","a":"{{}}","w":["{}","$","[]"],"why":"Ansible utilise Jinja2 : une variable s'écrit `{{ ma_variable }}`. En YAML, si la valeur commence par `{{`, il faut des guillemets : `name: \"{{ paquet }}\"`.","wx":["En YAML, `{}` désigne un dictionnaire, pas une variable.","`$` est la syntaxe de Bash, pas d'Ansible.","`[]` désigne une liste en YAML."]},{"id":"ansible-02","q":"Quelle commande Ansible permet de spécifier le nombre de processus parallèles pour l'exécution de tâches ?","a":"ansible-playbook -f","w":["ansible-playbook -n","ansible-playbook -c","ansible-playbook -p"],"why":"`-f` (`--forks`) fixe le nombre de processus parallèles, donc de serveurs traités en même temps (5 par défaut).","wx":["`-n` n'est pas l'option des forks.","`-c` choisit le type de connexion (ssh, local…).","`-p` n'est pas l'option des forks."]},{"id":"ansible-03","q":"Lesquelles de ces actions peuvent être réalisées avec Ansible ?","a":"Toutes les réponses ci-dessus","w":["Déploiement d'application","Gestion de configuration","Automatisation des tâches"],"o":["Déploiement d'application","Toutes les réponses ci-dessus","Gestion de configuration","Automatisation des tâches"],"why":"Ansible sait faire les trois : déployer des applications, gérer la configuration des serveurs et automatiser des tâches. D'où « Toutes les réponses ».","wx":["Juste, mais incomplet : Ansible fait aussi la configuration et l'automatisation.","Juste, mais incomplet.","Juste, mais incomplet."]},{"id":"ansible-04","q":"Ansible est","a":"toutes les réponses ci-dessus","w":["agentless","extensible","simple"],"o":["toutes les réponses ci-dessus","agentless","extensible","simple"],"why":"Ansible est agentless (SSH, rien à installer), extensible (modules, plugins, collections) et simple (YAML lisible). Les trois sont vrais.","wx":["Vrai, mais il y a d'autres qualités : la bonne réponse est « toutes ».","Vrai, mais incomplet.","Vrai, mais incomplet."]},{"id":"ansible-05","q":"Quel module permet de créer un répertoire dans ansible ?","a":"file","w":["data","template","fetch"],"why":"Le module file gère fichiers et dossiers : `state: directory` crée un dossier, avec `mode` et `owner` en option.","wx":["Il n'y a pas de module « data ».","template copie un fichier en y injectant des variables.","fetch récupère un fichier depuis la cible vers le control node."]},{"id":"ansible-06","q":"Une tâche est une action unitaire dans Ansible.","a":"vrai","w":["faux"],"o":["vrai","faux"],"why":"Une tâche (task) appelle un seul module avec ses paramètres : c'est la plus petite unité d'action d'un playbook.","wx":["C'est bien vrai : la tâche est l'action unitaire."]},{"id":"ansible-07","q":"Quel module Ansible est utilisé pour installer des paquets sur des systèmes basés sur Debian ?","a":"apt","w":["pip","yum","dnf"],"why":"apt est le gestionnaire de paquets de Debian et Ubuntu ; le module apt l'utilise.","wx":["pip installe des paquets Python, pas des paquets système.","yum est pour Red Hat et CentOS (anciennes versions).","dnf est pour Fedora et RHEL 8 et plus."]},{"id":"ansible-08","q":"Quel type de boucle peut-on utiliser dans un playbook Ansible pour répéter une tâche plusieurs fois ?","a":"with_items","w":["repeat_until","with_loops","for_each"],"why":"`with_items` répète une tâche sur une liste. C'est la syntaxe historique, toujours valide ; aujourd'hui on préfère `loop`.","wx":["`repeat_until` n'existe pas ; il existe `until` pour réessayer une tâche.","`with_loops` n'existe pas.","`for_each` vient de Terraform, pas d'Ansible."]},{"id":"ansible-09","q":"Quelle commande permet de vérifier la syntaxe d'un playbook sans l'exécuter ?","a":"ansible-playbook --syntax-check","w":["ansible-playbook --check-syntax","ansible-playbook --dry-run","ansible-playbook --validate"],"why":"`--syntax-check` analyse le YAML et la structure du playbook sans rien exécuter.","wx":["L'ordre des mots est inversé ; la bonne option est `--syntax-check`.","`--dry-run` n'existe pas dans Ansible ; la simulation, c'est `--check`.","`--validate` n'existe pas."]},{"id":"ansible-10","q":"Quel est le rôle de l'option forks dans un fichier de configuration ansible.cfg ?","a":"Elle spécifie le nombre de processus parallèles qui seront utilisés pour exécuter les tâches sur les hôtes cibles.","w":["Elle détermine le nombre de machines cibles qui peuvent être connectées simultanément.","Elle définit le nombre de threads pour gérer les erreurs dans les playbooks.","Elle permet de définir le nombre maximal de tâches qui peuvent être exécutées en parallèle lors de l'exécution du playbook."],"why":"Dans ansible.cfg, `forks = 20` fixe le nombre de processus parallèles : Ansible exécute chaque tâche sur 20 hôtes à la fois (5 par défaut).","wx":["Les forks limitent l'exécution simultanée, pas le nombre de connexions possibles.","Les forks n'ont rien à voir avec la gestion des erreurs.","Les tâches s'exécutent dans l'ordre ; c'est le nombre d'hôtes traités en parallèle qui change."]},{"id":"ansible-11","q":"Quelle commande Ansible permet de vérifier la connectivité SSH avec des hôtes cibles ?","a":"ansible -m ping","w":["ansible -m status all","ansible -m check","ansible -ping"],"why":"`ansible <hôtes> -m ping` (ex : `ansible all -m ping`) teste la connexion SSH et Python sur chaque cible ; une réponse « pong » veut dire OK.","wx":["Il n'y a pas de module status, et la syntaxe est incorrecte.","Il n'y a pas de module check.","`-ping` n'est pas une option : ping est un module qu'on appelle avec `-m`."]},{"id":"ansible-12","q":"Quel fichier de configuration Ansible permet de définir les paramètres globaux ?","a":"ansible.cfg","w":["hosts.ini","config.json","ansible.yml"],"why":"ansible.cfg contient la configuration globale : inventaire par défaut, utilisateur distant, forks, options SSH…","wx":["hosts.ini est un inventaire.","Ansible n'utilise pas de config.json.","ansible.yml n'est pas un fichier de configuration standard."]}]},{"title":"Quiz de formation 2/2","src":"quiz","qs":[{"id":"ansible-13","q":"Dans Ansible, quel fichier contient les informations d'inventaire des hôtes ?","a":"Le fichier 'hosts.ini'","w":["Le fichier 'inventory.json'","Le fichier 'hosts.yml'","Le fichier 'ansible.cfg'"],"why":"Selon ton corrigé, l'inventaire est le fichier hosts.ini (format INI). Par défaut, Ansible lit /etc/ansible/hosts.","wx":["Le JSON sert aux inventaires dynamiques, pas au fichier d'inventaire classique attendu ici.","Un inventaire peut aussi être en YAML, mais le corrigé attendait hosts.ini.","ansible.cfg est la configuration ; il peut seulement pointer vers l'inventaire."]},{"id":"ansible-14","q":"Quel est l’objectif du paramètre become dans un playbook Ansible ?","a":"Permet d'exécuter des tâches avec des privilèges élevés.","w":["Permet de réduire le temps d'exécution des tâches.","Limite l'accès aux fichiers système.","Active le mode de débogage pour les tâches."],"why":"become permet de devenir un autre utilisateur, root par défaut (via sudo), pour exécuter des tâches qui demandent des privilèges élevés.","wx":["Il n'a aucun effet sur la vitesse.","C'est l'inverse : il donne plus d'accès.","Le débogage, c'est `-v` ou le module debug."]},{"id":"ansible-15","q":"Comment peut-on stocker et réutiliser les valeurs d'une tâche dans Ansible ?","a":"register","w":["facts","store"],"why":"`register: resultat` enregistre la sortie d'une tâche dans une variable, réutilisable ensuite (ex : `resultat.stdout` ou `when: resultat.rc == 0`).","wx":["Les facts sont collectés automatiquement sur les hôtes ; ce ne sont pas des résultats de tâches.","`store` n'est pas un mot-clé Ansible."]},{"id":"ansible-16","q":"Quelle option permet de ne pas exécuter une tâche si une condition spécifique est remplie dans un playbook ?","a":"Utiliser 'when'","w":["Utiliser 'unless'","Utiliser 'skip_when'","Utiliser 'ignore'"],"why":"`when` est le mot-clé de condition : avec une condition inversée (`when: not ...`), la tâche est sautée quand la condition est remplie.","wx":["`unless` n'existe pas dans Ansible (c'est du Chef ou du Ruby).","`skip_when` n'existe pas.","`ignore` n'existe pas ; il y a `ignore_errors` pour ignorer les erreurs."]},{"id":"ansible-17","q":"Dans Ansible, quel fichier est utilisé pour spécifier des variables spécifiques à un groupe d’hôtes dans un inventaire dynamique ?","a":"group_vars","w":["fichier d'inventaire statique","vars.yml","host_vars"],"why":"Le dossier group_vars/ contient un fichier par groupe (ex : group_vars/webservers.yml) : ses variables s'appliquent à tous les hôtes du groupe.","wx":["Un inventaire statique peut contenir des variables, mais ici on parle d'inventaire dynamique.","vars.yml est un nom libre qu'il faut inclure à la main.","host_vars/ contient les variables par hôte, pas par groupe."]},{"id":"ansible-18","q":"Comment spécifier un utilisateur spécifique pour exécuter une commande dans Ansible ?","a":"Utilisez 'ansible_user' dans l'inventaire ou le playbook.","w":["Spécifiez l'utilisateur dans le fichier de configuration SSH.","Utilisez 'ansible_host' dans l'inventaire."],"why":"`ansible_user` définit l'utilisateur SSH avec lequel Ansible se connecte à un hôte ; on peut le mettre dans l'inventaire, group_vars ou le playbook.","wx":["La config SSH peut aider, mais la méthode Ansible attendue est ansible_user.","`ansible_host` définit l'adresse IP ou le nom de l'hôte, pas l'utilisateur."]},{"id":"ansible-19","q":"Quelle option permet d’exécuter un playbook sur un sous-ensemble d’hôtes définis par un groupe dans l’inventaire ?","a":"--limit","w":["-v ou --verbose","-a ou --all","--force"],"why":"`--limit groupe` (ou `-l`) restreint l'exécution aux hôtes indiqués, par exemple `ansible-playbook site.yml --limit webservers`.","wx":["`-v` augmente la verbosité.","`-a` passe les arguments d'un module en ad-hoc ; ça ne cible pas des hôtes.","`--force` n'existe pas pour ansible-playbook."]},{"id":"ansible-20","q":"Dans Ansible, quel fichier est utilisé pour créer un inventaire dynamique pour les clouds comme AWS, GCP ou Azure ?","a":"dynamic_inventory.py","w":["hosts.ini","ansible.cfg","inventory.yaml"],"why":"Selon ton corrigé : un script exécutable (ex : dynamic_inventory.py) qui interroge l'API du cloud et renvoie les hôtes en JSON. Aujourd'hui, on utilise plutôt des plugins d'inventaire (aws_ec2.yml).","wx":["hosts.ini est un inventaire statique.","ansible.cfg est la configuration.","inventory.yaml est un inventaire statique en YAML."]},{"id":"ansible-21","q":"Quel module Ansible est utilisé pour déployer une application Docker sur une machine distante ?","a":"docker_container","w":["docker_image","docker_service","docker_network"],"why":"Le module docker_container (aujourd'hui community.docker.docker_container) lance, arrête et configure des conteneurs sur la cible : c'est lui qui déploie l'appli.","wx":["docker_image gère les images (pull, build), pas le lancement du conteneur.","Il n'y a pas de module docker_service ; il y a docker_compose ou docker_swarm_service.","docker_network gère les réseaux Docker."]},{"id":"ansible-22","q":"Quel module Ansible permet de gérer les configurations des bases de données MySQL ?","a":"mysql_db","w":["mysql_setup","mysql_manage","mysql_config"],"why":"Le module mysql_db (collection community.mysql) crée, supprime, sauvegarde ou importe des bases MySQL.","wx":["mysql_setup n'existe pas.","mysql_manage n'existe pas.","mysql_config n'existe pas. Pour les utilisateurs, c'est mysql_user."]},{"id":"ansible-23","q":"Quelle est la principale différence entre un fichier d'inventaire statique et un inventaire dynamique dans Ansible ?","a":"Un inventaire dynamique est généré via un script ou un plugin qui interroge une source externe (cloud, base de données, etc.) en temps réel.","w":["L'inventaire statique est plus rapide à exécuter que l'inventaire dynamique.","L'inventaire dynamique nécessite une configuration manuelle pour chaque hôte.","Un inventaire dynamique charge les hôtes lors de l'exécution, tandis qu'un inventaire statique est un fichier texte avec une liste fixe."],"why":"Un inventaire dynamique est produit à la demande par un script ou un plugin qui interroge une source externe (AWS, base de données…). Il suit automatiquement les créations et suppressions de serveurs.","wx":["La vitesse n'est pas la différence principale.","C'est l'inverse : c'est le statique qui demande une saisie manuelle.","Cette réponse ressemble à la bonne, mais elle ne cite pas la source externe, qui est l'élément clé selon ton corrigé."]},{"id":"ansible-24","q":"Lors de l'utilisation d'un inventaire dynamique, quel format de sortie est généralement utilisé pour fournir des informations d'inventaire ?","a":"JSON","w":["YAML","XML","TXT"],"why":"Un script d'inventaire dynamique doit afficher du JSON : les groupes, leurs hôtes et les variables (_meta).","wx":["Le YAML sert aux inventaires statiques et aux plugins de configuration, pas à la sortie des scripts.","Ansible n'utilise pas de XML.","Le texte brut n'est pas structuré."]},{"id":"ansible-25","q":"Quelle commande Ansible permet de récupérer les faits (facts) des hôtes cibles ?","a":"ansible -m setup","w":["ansible -m gather_facts","ansible -m get_facts","ansible -m ping"],"why":"Le module setup collecte les facts : OS, IP, mémoire… C'est lui qu'Ansible lance automatiquement au début de chaque play (gather_facts).","wx":["`gather_facts` est le paramètre d'un play, pas le nom du module en ad-hoc.","`get_facts` n'existe pas.","ping teste la connexion ; il ne collecte rien."]}]}]},{"id":"terraform","name":"Terraform","sub":"L'infra en code","steps":[{"title":"Les concepts","src":"fiche","qs":[{"id":"terraform-f1-1","q":"Qu'est-ce que Terraform ?","a":"Un outil open source d'Infrastructure as Code qui provisionne l'infra de manière déclarative","w":["Un outil de configuration de serveurs par SSH","Un orchestrateur de conteneurs","Un service cloud d'AWS"],"why":"Terraform (HashiCorp) décrit l'infrastructure dans des fichiers .tf (langage HCL) : tu déclares ce que tu veux et il calcule quoi créer, modifier ou supprimer chez le fournisseur (AWS…).","wx":["La configuration de serveurs par SSH, c'est Ansible.","L'orchestration de conteneurs, c'est Kubernetes.","Terraform est indépendant d'AWS et fonctionne avec de nombreux clouds. L'IaC propre à AWS, c'est CloudFormation."]},{"id":"terraform-f1-2","q":"Que veut dire « idempotent » pour Terraform ?","a":"Même exécution, même résultat, même si on relance plusieurs fois","w":["Chaque exécution recrée toute l'infra","Les ressources ne peuvent pas être modifiées","Terraform s'exécute sans state"],"why":"Idempotent : si l'infra correspond déjà au code, relancer apply ne change rien. Le résultat final est toujours le même.","wx":["Terraform ne touche qu'aux différences.","On peut modifier les ressources : il suffit de changer le code.","Le state est justement ce qui permet à Terraform de savoir ce qui existe déjà."]},{"id":"terraform-f1-3","q":"Qu'est-ce qu'un provider ?","a":"Un plugin qui permet à Terraform de parler à une plateforme (AWS, Azure, Kubernetes…)","w":["Le fichier qui stocke l'état","Un module de variables","Le serveur qui héberge Terraform"],"why":"Un provider (aws, azurerm, kubernetes…) est un plugin téléchargé par `terraform init` : il traduit tes ressources en appels à l'API de la plateforme.","wx":["L'état est dans terraform.tfstate.","Les modules regroupent des ressources ; les variables sont autre chose.","Terraform tourne sur ta machine ou ta CI ; le provider est un plugin, pas un serveur."]},{"id":"terraform-f1-4","q":"Que fait `terraform init` ?","a":"Initialise le projet et télécharge les providers","w":["Crée les ressources","Montre ce qui va changer","Supprime l'infrastructure"],"why":"`terraform init` prépare le dossier : il télécharge les providers et les modules et configure le backend du state. C'est la première commande à lancer.","wx":["Créer les ressources, c'est `apply`.","Voir les changements, c'est `plan`.","Supprimer, c'est `destroy`."]},{"id":"terraform-f1-5","q":"Que fait `terraform plan` ?","a":"Montre ce qui va changer, sans rien modifier","w":["Applique les changements","Vérifie seulement la syntaxe","Télécharge les providers"],"why":"`plan` compare ton code au state et à la réalité, puis affiche la liste des créations (+), modifications (~) et suppressions (-), sans rien toucher.","wx":["Appliquer, c'est `apply`.","La syntaxe seule, c'est `validate`.","Les providers se téléchargent avec `init`."]},{"id":"terraform-f1-6","q":"Que fait `terraform apply` ?","a":"Crée, modifie ou supprime réellement les ressources","w":["Montre ce qui va changer sans rien faire","Formate le code","Importe des ressources existantes"],"why":"`apply` exécute les changements prévus : il crée, modifie ou supprime les ressources (après confirmation par « yes »), puis met à jour le state.","wx":["Ça, c'est `plan`.","Le formatage, c'est `fmt`.","Importer, c'est `import`."]},{"id":"terraform-f1-7","q":"Que fait `terraform validate` ?","a":"Vérifie la syntaxe et la cohérence sans contacter les providers","w":["Applique les changements après validation","Vérifie que les ressources existent dans le cloud","Valide le state distant"],"why":"`validate` vérifie que tes fichiers .tf sont syntaxiquement corrects et cohérents (références, types) sans appeler AWS. C'est rapide, idéal en CI.","wx":["validate n'applique jamais rien.","Il ne contacte pas le cloud.","Il ne vérifie pas le state."]},{"id":"terraform-f1-8","q":"Que fait `terraform destroy` ?","a":"Supprime toutes les ressources gérées par Terraform","w":["Supprime le fichier state","Supprime les providers téléchargés","Annule le dernier apply"],"why":"`destroy` supprime toutes les ressources gérées par ce state (après confirmation). Utile pour nettoyer un environnement de test et ne pas payer pour rien.","wx":["Le fichier state reste ; il devient simplement vide de ressources.","Les providers restent dans .terraform/.","Il n'y a pas d'annulation en Terraform : destroy supprime tout."]}]},{"title":"State, variables et modules","src":"fiche","qs":[{"id":"terraform-f2-1","q":"À quoi sert le fichier terraform.tfstate ?","a":"Stocker l'état réel de l'infrastructure","w":["Déclarer les variables","Lister les providers","Stocker les logs d'exécution"],"why":"terraform.tfstate fait le lien entre ton code et les vraies ressources : identifiants AWS, attributs… C'est grâce à lui que Terraform sait ce qui existe déjà.","wx":["Les variables se déclarent dans variables.tf.","Les providers se déclarent dans les blocs terraform et provider.","Les logs ne sont pas stockés là."]},{"id":"terraform-f2-2","q":"Pourquoi utiliser un backend distant (ex : S3) pour le state ?","a":"Collaboration, state centralisé et verrouillage (locking)","w":["Pour accélérer terraform plan","Parce que le state local est interdit","Pour chiffrer le code .tf"],"why":"Avec un backend distant (S3 + DynamoDB, Terraform Cloud…), toute l'équipe partage le même state, et le verrouillage empêche deux apply simultanés de le corrompre.","wx":["Ce n'est pas une question de vitesse.","Le state local est autorisé, mais il ne convient pas au travail en équipe.","Le code .tf est dans Git ; le backend stocke le state, pas le code."]},{"id":"terraform-f2-3","q":"Pourquoi ne jamais modifier le state à la main ?","a":"Risque d'incohérence ou de corruption : on passe par les commandes Terraform","w":["Le fichier est en lecture seule","Terraform le régénère à chaque plan","C'est autorisé seulement en production"],"why":"Le state est un JSON interne précis : une modification à la main peut le désynchroniser de la réalité ou le corrompre. Pour le manipuler, on utilise `terraform state mv`, `state rm` ou `import`.","wx":["Ce n'est pas un fichier en lecture seule.","Terraform le met à jour, il ne le régénère pas de zéro.","C'est risqué partout, et encore plus en production."]},{"id":"terraform-f2-4","q":"À quoi servent les input variables ?","a":"Paramétrer la configuration et éviter le hardcoding","w":["Afficher des résultats après apply","Stocker l'état","Déclarer les providers"],"why":"Les variables d'entrée rendent le code réutilisable : le type d'instance, la région ou le nom changent selon l'environnement sans toucher au code.","wx":["Afficher des résultats, c'est le rôle des outputs.","L'état est dans le state.","Les providers se déclarent dans un bloc provider."]},{"id":"terraform-f2-5","q":"Différence entre variables.tf et terraform.tfvars ?","a":"variables.tf déclare les variables, terraform.tfvars donne leurs valeurs","w":["variables.tf donne les valeurs, terraform.tfvars les déclare","terraform.tfvars contient le state","Aucune différence"],"why":"variables.tf déclare les variables (nom, type, description, valeur par défaut). terraform.tfvars fournit les valeurs réelles pour un environnement donné.","wx":["C'est l'inverse.","Le state est dans terraform.tfstate.","Les deux fichiers ont des rôles différents : déclaration d'un côté, valeurs de l'autre."]},{"id":"terraform-f2-6","q":"Qu'est-ce qu'un module Terraform ?","a":"Un dossier de fichiers .tf réutilisable pour une partie de l'infra","w":["Un plugin de connexion à un cloud","Une commande Terraform","Un fichier de state partagé"],"why":"Un module est un dossier de .tf (ressources, variables, outputs) qu'on réutilise avec un bloc `module` : par exemple un module vpc appelé pour dev et pour prod.","wx":["Ça, c'est un provider.","Ce n'est pas une commande.","Le state est séparé du code."]},{"id":"terraform-f2-7","q":"Différence entre count et for_each ?","a":"count crée des copies par index numérique, for_each itère sur une liste/map avec une clé unique","w":["for_each crée des copies par index, count itère sur une map","count est réservé aux modules","Aucune différence"],"why":"`count = 3` crée des copies repérées par un numéro (aws_instance.web[0], [1]…). `for_each` crée une ressource par élément d'une map ou d'un set, repérée par une clé (web[\"api\"]). Si tu retires un élément du milieu, for_each ne décale pas les autres.","wx":["C'est l'inverse.","count marche sur les ressources comme sur les modules.","Ils ne fonctionnent pas pareil : index numérique d'un côté, clé de l'autre."]},{"id":"terraform-f2-8","q":"À quoi sert `terraform import` ?","a":"Intégrer au state une ressource créée hors Terraform, sans la recréer","w":["Télécharger un module","Importer des variables","Copier le state d'un autre projet"],"why":"`terraform import` rattache au state une ressource créée à la main (ex : un bucket S3 existant) : Terraform la gère ensuite sans la recréer.","wx":["Les modules se téléchargent avec `init`.","Les variables se passent avec `-var` ou les .tfvars.","Pour déplacer du state, on utilise `state mv` ou `state pull/push`."]},{"id":"terraform-f2-9","q":"Que sont les workspaces ?","a":"Plusieurs instances d'une même config (dev, prod) avec des states isolés","w":["Des dossiers de modules","Des espaces de travail sur le cloud","Des copies de sauvegarde du state"],"why":"Un workspace est un state séparé pour la même configuration : `terraform workspace new dev` permet de gérer dev et prod avec le même code, sans mélanger leurs ressources.","wx":["Les modules sont des dossiers de code, sans lien avec les workspaces.","Ce n'est pas une notion du cloud : c'est local à Terraform.","Ce ne sont pas des sauvegardes : chaque workspace a son propre state actif."]},{"id":"terraform-f2-10","q":"À quoi servait `terraform taint` ?","a":"Marquer une ressource comme endommagée pour la recréer au prochain apply","w":["Supprimer une ressource du state","Bloquer la modification d'une ressource","Signaler une erreur de syntaxe"],"x":"Aujourd'hui on utilise plutôt `terraform apply -replace=<ressource>`.","why":"`taint` marquait une ressource comme abîmée : au prochain apply, Terraform la détruisait puis la recréait. Aujourd'hui, on fait `terraform apply -replace=aws_instance.web`.","wx":["Retirer une ressource du state, c'est `terraform state rm`.","Pour protéger une ressource, on utilise `lifecycle { prevent_destroy = true }`.","Les erreurs de syntaxe, c'est `validate`."]}]},{"title":"Quiz de formation 1/2","src":"quiz","qs":[{"id":"terraform-01","q":"Vous avez défini les valeurs de vos variables dans le fichier terraform.tfvars et l'avez enregistré dans le même répertoire que votre configuration Terraform. Laquelle des commandes suivantes utilisera ces valeurs lors de la création d'un plan d'exécution ?","a":"Toutes les réponses ci-dessus","w":["terraform plan -var-file=terraform.tfvars","Aucune des réponses ci-dessus","terraform plan"],"o":["terraform plan -var-file=terraform.tfvars","Aucune des réponses ci-dessus","Toutes les réponses ci-dessus","terraform plan"],"why":"Terraform charge automatiquement terraform.tfvars s'il est dans le dossier. `terraform plan` seul utilise donc ces valeurs, et `-var-file=terraform.tfvars` fonctionne aussi, de manière explicite : les deux réponses sont justes.","wx":["Juste, mais la version sans option l'est aussi : la bonne réponse est « Toutes ».","Faux : les deux commandes utilisent bien les valeurs.","Juste, mais incomplet : la version avec -var-file marche aussi."]},{"id":"terraform-02","q":"Lesquelles des commandes Terraform suivantes actualisera automatiquement l'état, sauf si des options ou des arguments supplémentaires sont fournis ?","a":"terraform plan","w":["terraform state","terraform validate","terraform apply","terraform output"],"x":"terraform apply rafraîchit aussi l'état avant d'appliquer.","why":"Selon ton corrigé : `terraform plan` rafraîchit l'état (il relit la réalité dans le cloud) avant de calculer les changements, sauf avec `-refresh=false`.","wx":["`terraform state` est un groupe de sous-commandes de manipulation, sans rafraîchissement automatique.","validate ne contacte pas le cloud.","apply rafraîchit aussi l'état. Le corrigé de ton quiz n'attendait que plan, mais en pratique les deux le font.","output lit le state sans le rafraîchir."]},{"id":"terraform-03","q":"Que sont les provisionneurs Terraform et quand les utiliser ?","a":"Les provisionneurs sont utilisés pour exécuter des scripts ou des commandes après que Terraform a créé ou mis à jour des ressources.","w":["Les provisionneurs sont utilisés pour gérer les secrets dans Terraform.","Les provisionneurs sont utilisés pour gérer l'état des ressources dans Terraform.","Les provisionneurs sont utilisés pour gérer les dépendances des ressources."],"why":"Les provisioners (remote-exec, local-exec, file) lancent des scripts sur une ressource après sa création, par exemple installer un logiciel. HashiCorp les conseille en dernier recours : on leur préfère user_data, cloud-init ou Ansible.","wx":["Les secrets se gèrent avec Vault, Secrets Manager ou les variables sensitive.","L'état est géré par le state et le backend.","Les dépendances se gèrent avec les références et `depends_on`."]},{"id":"terraform-04","q":"Comment pouvez-vous gérer plusieurs environnements avec Terraform (par exemple, production, staging) ?","a":"En utilisant des modules et des variables pour personnaliser les configurations selon l'environnement.","w":["En créant un fichier unique pour toutes les configurations et en ne changeant que les valeurs par défaut.","En utilisant plusieurs fichiers de configuration main.tf pour chaque environnement.","Terraform ne permet pas de gérer plusieurs environnements."],"why":"Bonne pratique : un code commun en modules, avec des variables (et des .tfvars ou des dossiers par environnement) pour adapter tailles, noms et régions entre staging et prod.","wx":["Un seul fichier pour tout devient vite impossible à maintenir et risqué.","Copier un main.tf par environnement fait dupliquer le code ; les modules évitent ça.","C'est faux : Terraform le permet (modules, workspaces, tfvars)."]},{"id":"terraform-05","q":"Quelle est la commande Terraform pour auto formater le code ?","a":"terraform fmt","w":["terraform code fmt","terraform format","terraform lint -fix"],"why":"`terraform fmt` réécrit tes fichiers .tf au format standard : indentation et alignement des `=`. `fmt -check` est utile en CI.","wx":["`code fmt` n'existe pas.","La commande est `fmt`, pas `format`.","`lint` n'existe pas dans Terraform ; le linter externe s'appelle tflint."]},{"id":"terraform-06","q":"Que fait la commande terraform taint aws_instance.aws-vm ?","a":"Tag la ressource en tainted pour forcer Terraform à la recréer au prochain terrafrom apply","w":["Cette commande n’est plus valide depuis Terraform v1.20","Tag la ressource en tainted pour que Terraform supprime la ressource du tfstate"],"x":"terraform taint est dépréciée depuis Terraform 0.15.2 : aujourd'hui on utilise terraform apply -replace=<ressource>.","why":"taint marque la ressource « tainted » : au prochain apply, elle est détruite puis recréée. La commande est dépréciée depuis v0.15.2 ; on utilise `apply -replace=`.","wx":["La version v1.20 n'existe pas ; la commande est dépréciée, pas supprimée.","La ressource reste dans le state ; elle sera recréée, pas oubliée."]},{"id":"terraform-07","q":"Qu'est-ce qu'une ressource null_resource dans Terraform ?","a":"Une ressource qui peut être utilisée pour exécuter des actions arbitraires via des provisionneurs ou des déclencheurs.","w":["Une ressource utilisée pour générer des ressources en dehors de Terraform.","Une ressource de type \"vide\" qui ne fait rien.","Une ressource qui est utilisée uniquement pour les tests unitaires."],"why":"null_resource ne crée rien dans le cloud : elle sert de support à des provisioners (scripts), relancés quand ses `triggers` changent. Aujourd'hui, on utilise terraform_data.","wx":["Elle ne crée rien hors de Terraform.","Elle n'est pas totalement vide : elle sert à porter des actions.","Elle n'est pas réservée aux tests."]},{"id":"terraform-08","q":"Que se passe-t-il lorsque vous définissez une variable comme sensitive = true dans Terraform ?","a":"Terraform empêche la valeur de la variable d'apparaître dans les sorties, logs ou fichiers d'état.","w":["Terraform crée un fichier sécurisé pour stocker la variable sensible.","Terraform crée une alerte chaque fois que la variable sensible est utilisée.","Terraform crypte la variable avant de l'envoyer à un backend distant."],"why":"`sensitive = true` masque la valeur dans plan, apply et les outputs (« sensitive value »). Attention : elle reste en clair dans le fichier state, d'où l'importance de sécuriser le backend.","wx":["Aucun fichier sécurisé n'est créé.","Aucune alerte n'est générée.","Terraform ne chiffre pas la valeur ; c'est le backend (ex : S3 chiffré) qui doit protéger le state."]},{"id":"terraform-09","q":"Quelles commandes peuvent être utilisé pour importer des ressources existantes non présentes dans le tfstate ?","a":"terraform import","w":["terraform refresh","terraform reload","terraform state reload"],"x":"Depuis Terraform 1.5, on peut aussi utiliser un bloc import {} dans le code.","why":"`terraform import adresse id` ajoute une ressource existante au state. Depuis la v1.5, on peut aussi écrire un bloc `import {}` dans le code.","wx":["refresh met à jour les ressources déjà connues ; il n'en ajoute pas.","`reload` n'existe pas.","`state reload` n'existe pas."]}]},{"title":"Quiz de formation 2/2","src":"quiz","qs":[{"id":"terraform-10","q":"Comment Terraform gère-t-il l'état à distance ?","a":"Terraform utilise un backend distant comme AWS S3, Azure Blob Storage, ou HashiCorp Consul pour stocker l'état.","w":["Terraform crée une nouvelle instance de la ressource à chaque exécution pour ne pas avoir besoin d'un état.","Terraform stocke l'état dans une base de données relationnelle.","Terraform n'a pas de gestion d'état, tout est géré localement."],"why":"On déclare un bloc `backend` (s3, azurerm, consul…) : le state est stocké à distance, partagé et verrouillé pendant les modifications.","wx":["Terraform ne recrée rien à chaque fois ; c'est justement le state qui l'en empêche.","Ce n'est pas une base relationnelle, mais un fichier JSON dans un stockage.","Le state est local par défaut, mais peut être distant."]},{"id":"terraform-11","q":"Quelle est la commande à utiliser pour lister toutes les ressources présentes dans le Tfstate ?","a":"terraform state list","w":["terraform backend ls","terraform resource list","terraform ls"],"why":"`terraform state list` affiche toutes les adresses des ressources du state (ex : aws_instance.web).","wx":["`backend ls` n'existe pas.","`resource list` n'existe pas.","`terraform ls` n'existe pas."]},{"id":"terraform-12","q":"Qu’est-ce que Terragrunt ?","a":"Terragrunt est un outil qui s’interface au- dessus de Terraform et qui permet de mieux gérer ses multiples environnements sous Terraform en mettant en place un certain nombre de dossiers dans ses repos","w":["Terragrunt est un projet Opensource qui a pour but de gérer le drift d’infrastructure","Terragrunt est un linter qui permet d’analyser un ensemble de bonne pratique dans son code comme la qualité ou la sécurité"],"why":"Terragrunt (Gruntwork) est un outil qui enveloppe Terraform : il évite de répéter backends et variables, et facilite la gestion de nombreux environnements et modules.","wx":["La détection du drift, c'est `plan` ou des outils comme driftctl.","Le linter, c'est tflint ; Terragrunt n'en est pas un."]},{"id":"terraform-13","q":"Comment sont gérés les dépendances de ressources dans Terraform, et quel est le rôle des dépendances implicites et explicites ?","a":"Les dépendances explicites sont définies avec depends_on, tandis que les dépendances implicites sont gérées automatiquement par Terraform en fonction des références de ressources.","w":["Les dépendances explicites sont définies automatiquement, et Terraform n'a pas besoin d'une gestion particulière des dépendances implicites.","Terraform crée des dépendances explicites uniquement à travers des variables externes.","Terraform ne gère pas les dépendances entre les ressources, c'est au développeur de les gérer."],"why":"Implicite : si une ressource utilise un attribut d'une autre (ex : `subnet_id = aws_subnet.a.id`), Terraform comprend tout seul l'ordre de création. Explicite : `depends_on` force un ordre quand aucune référence ne l'indique.","wx":["Ce sont les dépendances implicites qui sont automatiques, pas les explicites.","Les dépendances explicites passent par depends_on, pas par des variables externes.","C'est faux : Terraform construit un graphe de dépendances."]},{"id":"terraform-14","q":"Que se passe-t-il lorsque vous appliquez une configuration Terraform ?","a":"Terraform effectue toutes les modifications d'infrastructure définies dans votre configuration.","w":["Terraform met à jour le fichier d'état avec les modifications apportées à la configuration.","Terraform récupère les plugins requis par la configuration.","Terraform corrige les erreurs de formatage dans votre configuration.","Terraform détruit et recrée toute votre infrastructure depuis zéro."],"why":"apply réalise réellement toutes les modifications d'infrastructure prévues par ta configuration (créer, modifier, supprimer).","wx":["Il met aussi à jour le state, mais ce n'est pas le but principal : c'est une conséquence.","Récupérer les plugins, c'est `init`.","Le formatage, c'est `fmt`.","Il ne modifie que ce qui a changé ; il ne recrée pas tout."]},{"id":"terraform-15","q":"Qu'est-ce que le terraform output ?","a":"Il permet d'afficher les résultats ou les valeurs des ressources ou des variables après l'application de la configuration.","w":["Il affiche les valeurs des variables définies dans le fichier de configuration Terraform.","Il génère un fichier d'état.","Il sert à déployer de nouvelles ressources."],"why":"Les outputs exposent des valeurs après apply (IP publique, URL d'un load balancer…). `terraform output` les affiche ; ils servent aussi à passer des valeurs entre modules.","wx":["Les outputs affichent des résultats, pas les variables d'entrée.","Le state est créé par apply.","Déployer, c'est `apply`."]},{"id":"terraform-16","q":"variable \"vpc_cidrs\" { type = map default = { us-east-1 = \"10.0.0.0/16\" us-east-2 = \"10.1.0.0/16\" us-west-1 = \"10.2.0.0/16\" us-west-2 = \"10.3.0.0/16\" } } resource \"aws_vpc\" \"shared\" { cidr_block = _____________ } How would you define the cidr_block for us-east-1 in the aws_vpc resource using a variable?","a":"var.vpc_cidrs[\"us-east-1\"]","w":["var.vpc_cidrs.0","vpc_cidrs[\"us-east-1\"]","var.vpc_cidrs[0]"],"why":"On accède à une variable avec le préfixe `var.`, puis, pour une map, à une clé entre crochets et guillemets : `var.vpc_cidrs[\"us-east-1\"]`.","wx":["Une map ne s'indexe pas par un numéro ; on utilise sa clé.","Il manque le préfixe `var.`.","Une map ne s'indexe pas par position."]},{"id":"terraform-17","q":"Quelle est la meilleure pratique pour stocker des secrets dans Terraform ?","a":"Utiliser des services externes comme AWS Secrets Manager, HashiCorp Vault ou Azure Key Vault pour stocker et gérer les secrets.","w":["Utiliser des fichiers .tf pour définir les secrets et les sécuriser par des permissions de fichier.","Stocker les secrets directement dans le code source pour les référencer facilement.","Garder les secrets dans des variables locales pour les utiliser uniquement dans une machine."],"why":"Les secrets vont dans un coffre (Vault, AWS Secrets Manager, Azure Key Vault) et Terraform les lit au moment voulu (data source), avec des variables marquées sensitive.","wx":["Les .tf finissent dans Git : les secrets seraient exposés.","C'est la pire pratique : le secret est visible dans l'historique Git.","Les variables locales restent dans le code et dans le state."]}]}]},{"id":"aws","name":"AWS","sub":"Les services du cloud","steps":[{"title":"Calcul et stockage","src":"fiche","qs":[{"id":"aws-f1-1","q":"Qu'est-ce qu'une instance EC2 ?","a":"Un serveur virtuel dans le cloud dont tu contrôles l'OS, la RAM et le CPU","w":["Un service de stockage d'objets","Une base de données gérée","Un service pour exécuter du code sans serveur"],"why":"EC2 (Elastic Compute Cloud) loue des machines virtuelles : tu choisis l'OS (via une AMI), la puissance (type d'instance) et tu as un accès complet, en SSH par exemple.","wx":["Le stockage d'objets, c'est S3.","La base gérée, c'est RDS.","Le code sans serveur, c'est Lambda : là, tu ne gères aucune machine."]},{"id":"aws-f1-2","q":"Qu'est-ce qu'une AMI ?","a":"Le modèle (template) du serveur : OS et logiciels pré-installés","w":["La clé SSH de l'instance","Le pare-feu de l'instance","La taille de l'instance"],"why":"L'AMI (Amazon Machine Image) est le modèle à partir duquel on lance une instance : OS (Ubuntu, Amazon Linux, Windows) et logiciels pré-installés. Tu peux aussi créer tes propres AMI.","wx":["La clé SSH, c'est la Key Pair.","Le pare-feu, c'est le Security Group.","La taille, c'est l'Instance Type (t2.micro…)."]},{"id":"aws-f1-3","q":"À quoi sert la Key Pair d'une EC2 ?","a":"Se connecter en SSH (fichier .pem)","w":["Chiffrer le disque","Ouvrir les ports","Garder une IP fixe"],"why":"La Key Pair est une paire de clés SSH : AWS garde la clé publique sur l'instance et tu télécharges la clé privée (.pem) pour te connecter avec `ssh -i cle.pem ubuntu@ip`.","wx":["Le chiffrement du disque passe par KMS (EBS chiffré).","Les ports s'ouvrent dans le Security Group.","L'IP fixe, c'est l'Elastic IP."]},{"id":"aws-f1-4","q":"À quoi sert une Elastic IP ?","a":"Avoir une IP publique fixe qui ne change pas au redémarrage","w":["Répartir la charge entre instances","Accéder à internet depuis un subnet privé","Augmenter la bande passante"],"why":"L'IP publique d'une EC2 change quand on l'arrête et la redémarre. Une Elastic IP est une IP publique réservée qui reste à toi et qu'on rattache à l'instance.","wx":["Répartir la charge, c'est le rôle d'un Load Balancer (ELB).","Sortir sur internet depuis un subnet privé, c'est une NAT Gateway.","La bande passante dépend du type d'instance, pas de l'IP."]},{"id":"aws-f1-5","q":"Quel est le dernier état du cycle de vie d'une EC2 ?","a":"Terminated","w":["Stopped","Shutting-down","Pending"],"why":"Cycle de vie : Pending → Running → Stopping → Stopped, puis Shutting-down → Terminated. Terminated est définitif : l'instance est supprimée.","wx":["Stopped est réversible : on peut relancer l'instance.","Shutting-down est l'étape juste avant Terminated.","Pending est le premier état, au démarrage."]},{"id":"aws-f1-6","q":"Comment AWS Lambda est-il facturé ?","a":"Au temps de calcul, en millisecondes","w":["À l'heure, que le code tourne ou non","Au nombre de serveurs","Au forfait mensuel"],"why":"Lambda facture le nombre d'appels et la durée réelle d'exécution, à la milliseconde (selon la mémoire allouée). Si ton code ne tourne pas, tu ne paies rien.","wx":["Ça, c'est le modèle d'EC2.","Avec Lambda, il n'y a aucun serveur à compter.","Il n'y a pas de forfait : c'est du paiement à l'usage."]},{"id":"aws-f1-7","q":"Différence entre ECS et EKS ?","a":"ECS orchestre des conteneurs Docker (plus simple), EKS c'est Kubernetes géré par AWS","w":["EKS orchestre Docker, ECS c'est Kubernetes","ECS est pour les bases de données","Aucune différence"],"why":"ECS est l'orchestrateur maison d'AWS pour conteneurs Docker : plus simple à prendre en main. EKS est un Kubernetes géré par AWS : standard du marché, plus complexe, mais portable.","wx":["C'est l'inverse.","ECS est fait pour les conteneurs ; les bases de données, c'est RDS ou DynamoDB.","Ce sont deux orchestrateurs différents."]},{"id":"aws-f1-8","q":"Qu'est-ce qu'Elastic Beanstalk ?","a":"Un PaaS : tu envoies ton code, AWS gère LB, Auto Scaling et EC2","w":["Un service de stockage d'archives","Un pare-feu applicatif","Un outil de monitoring"],"why":"Elastic Beanstalk est un PaaS : tu envoies ton appli (Java, Python, Node…) et AWS crée et gère pour toi EC2, Load Balancer et Auto Scaling.","wx":["L'archivage, c'est Glacier.","Le pare-feu applicatif, c'est WAF.","Le monitoring, c'est CloudWatch."]},{"id":"aws-f1-9","q":"Qu'est-ce que S3 ?","a":"Un stockage d'objets illimité (fichiers, images, backups)","w":["Un disque attaché à une EC2","Une base de données SQL","Un système de fichiers partagé NFS"],"why":"S3 stocke des objets (fichiers et leurs métadonnées) dans des buckets, avec une capacité illimitée et une très haute durabilité. On y accède par une URL ou une API, pas comme un disque.","wx":["Le disque attaché à une EC2, c'est EBS.","Les bases SQL, c'est RDS.","Le système de fichiers partagé, c'est EFS."]},{"id":"aws-f1-10","q":"Qu'est-ce qu'un bucket S3 ?","a":"Le « dossier » racine, avec un nom unique au monde","w":["Un fichier stocké dans S3","Une classe de stockage","Une règle d'accès"],"why":"Un bucket est le conteneur principal de S3 : tous les objets sont dedans. Son nom doit être unique dans le monde entier (pas seulement dans ton compte).","wx":["Un fichier dans S3 s'appelle un objet.","Les classes de stockage sont Standard, Glacier… ; le bucket est autre chose.","Les règles d'accès, ce sont les Bucket Policies et les ACL."]},{"id":"aws-f1-11","q":"Quelle est la durabilité annoncée de S3 ?","a":"99,999999999 % (11 neuf)","w":["99,9 %","99,99 %","100 %"],"why":"S3 annonce une durabilité de 99,999999999 % (11 neuf) : les données sont copiées sur plusieurs zones, la perte d'un objet est quasi impossible. La disponibilité, elle, est d'environ 99,99 %.","wx":["99,9 % correspond plutôt à des engagements de disponibilité de certaines classes.","99,99 % est la disponibilité de S3 Standard, pas sa durabilité.","Aucun service ne garantit 100 %."]},{"id":"aws-f1-12","q":"Différence entre S3 Standard et S3 Glacier ?","a":"Standard pour les données fréquentes, Glacier pour l'archivage (moins cher, lent)","w":["Glacier est plus rapide et plus cher","Standard est réservé aux vidéos","Glacier ne stocke que des bases de données"],"why":"S3 Standard sert aux données lues souvent (accès immédiat, prix plus élevé). Glacier sert à l'archivage : très bon marché, mais la récupération prend de quelques minutes à plusieurs heures.","wx":["C'est l'inverse : Glacier est moins cher et plus lent.","Standard accepte tout type de fichier.","Glacier archive n'importe quel fichier."]},{"id":"aws-f1-13","q":"Qu'est-ce qu'un volume EBS ?","a":"Un disque réseau attaché à une EC2 ; les données survivent à l'instance","w":["Un stockage partagé entre plusieurs EC2","Un stockage d'objets","Une sauvegarde automatique de S3"],"why":"EBS est un disque en mode bloc rattaché à une EC2 (gp3, io1…). Il est indépendant de l'instance : si celle-ci disparaît, le volume et ses données restent, sauf si l'option de suppression automatique est cochée.","wx":["Le stockage partagé entre plusieurs EC2, c'est EFS.","Le stockage d'objets, c'est S3.","Les sauvegardes d'EBS sont des snapshots ; EBS lui-même est un disque."]},{"id":"aws-f1-14","q":"Qu'est-ce qu'EFS ?","a":"Un stockage partagé (NFS) utilisable par plusieurs EC2 en même temps","w":["Un disque attaché à une seule EC2","Un service d'archivage","Un stockage d'objets"],"why":"EFS (Elastic File System) est un système de fichiers réseau NFS : plusieurs EC2 le montent en même temps et partagent les mêmes fichiers. Il s'agrandit automatiquement.","wx":["Un disque pour une seule EC2, c'est EBS.","L'archivage, c'est Glacier.","Le stockage d'objets, c'est S3."]}]},{"title":"Bases de données et réseau","src":"fiche","qs":[{"id":"aws-f2-1","q":"Qu'est-ce que RDS ?","a":"Des bases SQL gérées par AWS (mises à jour et backups)","w":["Une base NoSQL clé-valeur","Un entrepôt de données","Un cache en mémoire"],"why":"RDS gère pour toi des bases relationnelles (MySQL, PostgreSQL, Aurora, Oracle, SQL Server) : installation, mises à jour, sauvegardes, réplication.","wx":["La base NoSQL clé-valeur, c'est DynamoDB.","L'entrepôt de données, c'est Redshift.","Le cache en mémoire, c'est ElastiCache."]},{"id":"aws-f2-2","q":"À quoi sert l'option Multi-AZ de RDS ?","a":"La haute disponibilité, par réplication synchrone","w":["Soulager la base en lecture","Réduire les coûts","Chiffrer les données"],"why":"Multi-AZ crée une copie de la base dans une autre zone de disponibilité, synchronisée en temps réel. Si la base principale tombe, la copie prend le relais automatiquement.","wx":["Soulager la lecture, ce sont les Read Replicas.","Multi-AZ coûte plus cher : on paie la seconde instance.","Le chiffrement passe par KMS."]},{"id":"aws-f2-3","q":"À quoi servent les Read Replicas ?","a":"Soulager la base en lecture (réplication asynchrone)","w":["La haute disponibilité en cas de panne","Sauvegarder la base","Écrire plus vite"],"why":"Les Read Replicas sont des copies en lecture seule, synchronisées avec un léger décalage (asynchrone). On y envoie les requêtes de lecture pour décharger la base principale.","wx":["La haute disponibilité, c'est Multi-AZ.","Les sauvegardes, ce sont les snapshots et les backups automatiques.","Les écritures vont toujours sur la base principale."]},{"id":"aws-f2-4","q":"Qu'est-ce que DynamoDB ?","a":"Une base NoSQL clé-valeur serverless, très faible latence","w":["Une base SQL gérée","Un entrepôt de données","Un service ETL"],"why":"DynamoDB est une base NoSQL clé-valeur et document, entièrement gérée et serverless. Elle monte en charge à l'horizontale presque sans limite, avec une latence de quelques millisecondes.","wx":["La base SQL gérée, c'est RDS.","L'entrepôt de données, c'est Redshift.","L'ETL, c'est Glue."]},{"id":"aws-f2-5","q":"Qu'est-ce que Redshift ?","a":"Un entrepôt de données (data warehouse)","w":["Un service ETL","Une base clé-valeur","Un CDN"],"why":"Redshift est un data warehouse : une base en colonnes optimisée pour l'analyse de très gros volumes (requêtes SQL d'analyse, reporting).","wx":["L'ETL, c'est Glue.","La base clé-valeur, c'est DynamoDB.","Le CDN, c'est CloudFront."]},{"id":"aws-f2-6","q":"Qu'est-ce que Glue ?","a":"Un service ETL (Extract, Transform, Load)","w":["Un entrepôt de données","Un service DNS","Un pare-feu"],"why":"Glue est un ETL serverless : il extrait des données, les transforme et les charge ailleurs (ex : de S3 vers Redshift). Il catalogue aussi les données.","wx":["L'entrepôt, c'est Redshift.","Le DNS, c'est Route 53.","Le pare-feu, c'est WAF ou les Security Groups."]},{"id":"aws-f2-7","q":"Qu'est-ce qu'un VPC ?","a":"Ton réseau privé isolé dans le cloud","w":["Un serveur virtuel","Un pare-feu applicatif",
